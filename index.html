<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energo Intelligence Team</title>
<style>
/* Workspace layout: sidebar of views, one main surface, a peek panel for items. Neutral structure, one accent. */
:root {
  --bg: #ffffff;
  --side: #f7f7f5;
  --hover: #efefed;
  --line: #e9e9e7;
  --line-2: #dcdcd8;
  --text: #2f3437;
  --muted: #73726e;
  --faint: #a5a4a0;
  --accent: #00699b;
  --accent-soft: #e6f1f7;
  --accent-ink: #ffffff;
  --rel2: #9cc3d8;
  --rel1: #dcdcd8;
  --watch: #a36a12;
  --watch-soft: #fbf1df;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919; --side: #202020; --hover: #2a2a2a; --line: #2e2e2e; --line-2: #3a3a3a;
    --text: #e6e6e4; --muted: #9b9a97; --faint: #6f6e6b; --accent: #4fa8d8; --accent-soft: #1d3340;
    --accent-ink: #0b1d27; --rel2: #2f5d76; --rel1: #3a3a3a; --watch: #e0a54b; --watch-soft: #33280f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191919; --side: #202020; --hover: #2a2a2a; --line: #2e2e2e; --line-2: #3a3a3a;
  --text: #e6e6e4; --muted: #9b9a97; --faint: #6f6e6b; --accent: #4fa8d8; --accent-soft: #1d3340;
  --accent-ink: #0b1d27; --rel2: #2f5d76; --rel1: #3a3a3a; --watch: #e0a54b; --watch-soft: #33280f; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }
/* Sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; padding: 12px 8px; gap: 2px; }
.ws { display: flex; align-items: center; gap: 8px; padding: 6px 8px 14px; font-weight: 600; font-size: 14px; }
.ws .logo { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.nav-label { font-size: 12px; color: var(--muted); padding: 14px 8px 4px; font-weight: 500; }
.nav { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: var(--r); color: var(--text); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--hover); }
.nav[aria-current="page"] { background: var(--hover); font-weight: 600; }
.nav .ic { width: 16px; height: 16px; flex: none; color: var(--muted); }
.nav .ct { margin-left: auto; font-size: 12px; color: var(--muted); }
.side-foot { margin-top: auto; padding: 12px 8px 4px; font-size: 12px; color: var(--muted); }

/* Main */
.main { overflow-y: auto; height: 100%; position: relative; }
.bar { position: sticky; top: 0; z-index: 4; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--line); min-height: 52px; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; flex: 1; }
.crumb b { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn.menu-btn { display: none; }
.search { position: relative; width: 260px; }
.search input { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: var(--r); background: var(--side); padding: 0 10px 0 30px; }
.search svg { position: absolute; left: 9px; top: 9px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--bg); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--hover); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.page { padding: 28px 24px 64px; max-width: 1280px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.3px; }
h2 { font-size: 16px; margin: 0; font-weight: 600; }
h3 { font-size: 14px; margin: 0; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 24px; }

/* Counts */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-height: 48px; text-align: left; background: var(--bg); cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
.kpi:hover { border-color: var(--line-2); background: var(--side); }
.kpi .v { font-size: 20px; font-weight: 700; line-height: 1.6; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi.hot .v { color: var(--accent); }

/* Item rows */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 6px; cursor: pointer; border-radius: 4px; }
.rows .row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row .rt { font-weight: 600; }
.row .rw { grid-column: 1 / -1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .rm { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Cards and grid */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--bg); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card-h .link { color: var(--muted); font-size: 12px; cursor: pointer; background: none; border: 0; padding: 8px 4px; margin: -8px -4px; white-space: nowrap; }
.card-h .link:hover { color: var(--accent); }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
svg text { font-family: var(--font); }

/* Horizontal bars */
.hbars { display: flex; flex-direction: column; gap: 4px; }
.hbar { display: grid; grid-template-columns: 112px minmax(0, 1fr) 28px; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; border: 0; background: none; text-align: left; }
.hbar:hover { background: var(--hover); }
.hbar .track { height: 10px; border-radius: 3px; background: var(--side); overflow: hidden; display: flex; }
.hbar .seg3 { background: var(--accent); } .hbar .seg2 { background: var(--rel2); } .hbar .seg1 { background: var(--rel1); }
.hbar .n { text-align: right; color: var(--muted); font-size: 12px; }
.outline { margin: 6px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
.outline li { margin-bottom: 4px; }

/* Heatmap */
.heat { display: grid; gap: 3px; font-size: 12px; }
.heat .hd { color: var(--muted); text-align: center; align-self: end; padding-bottom: 2px; line-height: 1.2; }
.heat .rl { color: var(--muted); align-self: center; white-space: nowrap; }
.heat button { height: 34px; border: 0; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
.heat button:hover { outline: 2px solid var(--accent); }

/* Timeline */
.tl { position: relative; }
.tl-list { display: flex; flex-direction: column; }
.tl-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 4px; }
.tl-row:hover { background: var(--hover); }
.tl-row .d { color: var(--watch); font-weight: 600; font-size: 12px; }
.tl-row .in { color: var(--muted); font-size: 12px; white-space: nowrap; }
.tl-row.two { grid-template-columns: 84px minmax(0, 1fr); align-items: start; } .tl-row.two .in { display: block; }

/* Table */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.chipf { position: relative; }
.chipf > button { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; }
.chipf > button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chipf > button:hover { background: var(--hover); }
.pop { position: absolute; top: 34px; left: 0; z-index: 20; min-width: 220px; max-height: 320px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; }
.pop label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.pop label:hover { background: var(--hover); }
.pop .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
.pop input { accent-color: var(--accent); width: 16px; height: 16px; }
.tbl-wrap { border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th.c-rel { width: 108px; } th.c-reg { width: 128px; } th.c-svc { width: 200px; } th.c-date { width: 112px; }
.c-reg, .c-svc { color: var(--muted); }
.sortsel { display: none; height: 30px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); padding: 0 10px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--side); white-space: nowrap; position: sticky; top: 0; }
th button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; font: inherit; display: inline-flex; gap: 4px; align-items: center; }
th button:hover { color: var(--text); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--side); }
tbody tr.sel td { background: var(--accent-soft); }
.t-title { font-weight: 500; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-src { color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--side); color: var(--text); border: 1px solid var(--line); }
.pill.r3 { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.r2 { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.due { background: var(--watch-soft); color: var(--watch); border-color: transparent; }
.pill.flag { background: transparent; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.st-saved { color: var(--accent); } .st-used { color: var(--muted); } .st-dismissed { color: var(--faint); text-decoration: line-through; }

/* Threads */
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; background: var(--bg); text-align: left; }
.tcard:hover { background: var(--side); }
.tcard p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tcard .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin-top: auto; }

/* Peek panel */
.peek { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--line); box-shadow: -16px 0 40px rgba(0,0,0,.10); z-index: 30; display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden; transition: transform 200ms ease-out, visibility 0s 200ms; }
.peek.open { transform: none; visibility: visible; transition: transform 200ms ease-out; }
.peek-bar { display: flex; align-items: center; gap: 4px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.peek-body { flex: 1; overflow-y: auto; padding: 24px 28px 32px; display: flex; flex-direction: column; gap: 20px; }
.peek-foot { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--bg); }
.peek-foot .sp { flex: 1; }
.peek h2.t { font-size: 20px; line-height: 1.3; font-weight: 700; }
.props { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; }
.props dt { color: var(--muted); padding: 3px 0; }
.props dd { margin: 0; padding: 3px 0; }
.props a { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: pointer; }
.block p { margin: 6px 0 0; font-size: 16px; line-height: 1.6; }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; }
.callout h3 { color: var(--accent); font-size: 12px; }
.callout p { margin: 4px 0 0; font-size: 16px; }
.note { font-size: 12px; color: var(--watch); }
.decide { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-list { display: flex; flex-direction: column; }
.mini-list button { display: flex; gap: 8px; align-items: center; text-align: left; border: 0; background: none; padding: 8px 6px; border-radius: 4px; cursor: pointer; border-top: 1px solid var(--line); }
.mini-list button:hover { background: var(--hover); }
.mini-list .tx { flex: 1; min-width: 0; }
.mini-list .s { color: var(--muted); font-size: 12px; }

/* Ask */
.ask .peek-body { gap: 16px; }
.ask textarea { width: 100%; min-height: 80px; border: 1px solid var(--line-2); border-radius: 8px; padding: 10px; resize: vertical; background: var(--bg); }
.ask select { height: 34px; border: 1px solid var(--line-2); border-radius: var(--r); padding: 0 8px; background: var(--bg); }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; }
.sugs button { border: 1px solid var(--line); background: var(--side); border-radius: 999px; padding: 6px 10px; cursor: pointer; font-size: 14px; text-align: left; }
.sugs button:hover { border-color: var(--accent); }
.qa { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.qa .q { font-weight: 600; }
.qa .a { white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
.qa .a a { color: var(--accent); font-weight: 500; cursor: pointer; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 25; display: none; }
.scrim.open { display: block; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 8px 8px 14px; border-radius: 8px; display: none; align-items: center; gap: 10px; z-index: 40; }
.toast.show { display: flex; }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px 8px; }
.empty { border: 1px dashed var(--line-2); border-radius: 10px; padding: 28px; color: var(--muted); }
.empty b { color: var(--text); display: block; margin-bottom: 4px; }
.banner { background: var(--watch-soft); color: var(--text); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.sk { height: 120px; border-radius: 10px; background: var(--side); }
.digest { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
.digest summary { padding: 14px 16px; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.digest summary span { color: var(--muted); font-weight: 400; font-size: 12px; }
.digest .body { padding: 0 16px 16px; }
.dg h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 20px 0 4px; }
.dg p { margin: 0 0 8px; font-size: 16px; line-height: 1.5; max-width: 72ch; }
.dg p.q { color: var(--muted); font-size: 14px; }
.dg .row .rw { display: block; }
.dg .row { cursor: default; } .dg .row[data-item] { cursor: pointer; }
.digest .body a { color: var(--accent); cursor: pointer; }

#qBtn { display: none; }
@media (max-width: 1100px) { .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } .c-svc { display: none; } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 35; transform: translateX(-100%); transition: transform 200ms ease-out; }
  .side.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .search { display: none; order: 9; width: 100%; }
  .bar { flex-wrap: wrap; }
  .bar.searching .search { display: block; }
  #qBtn { display: inline-flex; }
  .bar { padding: 8px 12px; }
  .page { padding: 20px 16px 64px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .btn, .nav, .chipf > button { min-height: 40px; }
  .peek-body { padding: 20px 18px 32px; }
  .sortsel { display: inline-block; min-height: 40px; }
  .tlstrip { display: none; }
  .tbl-wrap { border: 0; border-radius: 0; overflow: visible; }
  table, tbody, td { display: block; } thead { display: none; }
  tbody tr { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  td { padding: 0; border: 0; }
  td.c-rel { grid-row: 1; grid-column: 1; } td.c-date { grid-row: 1; grid-column: 2; text-align: right; color: var(--muted); font-size: 12px; align-self: center; }
  td.c-item, td.c-reg { grid-column: 1 / -1; } td.c-reg { font-size: 12px; } td.c-svc { display: none; }
}
@media (prefers-reduced-motion: reduce) { .peek, .side { transition: none; } }
#askBtn, [data-view="saved"], [data-kpi="saved"] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Views">
    <div class="ws"><span class="logo">E</span>Energo Intelligence</div>
    <button class="nav" data-go="overview"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>This week</button>
    <button class="nav" data-go="items"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg>All items<span class="ct num" id="ctAll"></span></button>
    <button class="nav" data-go="threads"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="4" cy="12" r="2"/><path d="M6 4.5l4 2.5M6 11.5l4-2.5"/></svg>Threads<span class="ct num" id="ctThreads"></span></button>
    <button class="nav" data-go="deadlines"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg>Dates<span class="ct num" id="ctDates"></span></button>
    <button class="nav" data-go="digests"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h12v9H2z"/><path d="M2 4l6 4.5L14 4"/></svg>Digests<span class="ct num" id="ctDigests"></span></button>
    <button class="nav" data-go="coverage"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 13.5v-4M6.5 13.5v-8M10.5 13.5v-6M14 13.5v-11"/></svg>Coverage</button>
    <div class="nav-label">Views</div>

 you can use them already for 2026.", "content_outline": {"article": ["What happened: the revised ESRS entered into force on 10 November 2026.", "When they apply: mandatory from financial year 2027, voluntary for financial year 2026.", "What changed: almost 60% fewer mandatory datapoints, shorter standards, new structure.", "How this fits the Omnibus steps: quick-fix in 2025, Omnibus I in February 2026, full simplified set in September 2026.", "What companies should decide now: whether to apply the new set early; section for Energo's advice."], "carousel": ["Slide 1: hook: the simplified ESRS are now in force", "Slide 2: in force since 10 November 2026", "Slide 3: mandatory from FY2027, optional for FY2026", "Slide 4: almost 60% fewer mandatory datapoints", "Slide 5: shorter standards, new structure", "Slide 6: decide now whether to switch early", "Slide 7: need help with your next report? Talk to Energo"]}, "content_worthy": true, "deadline": "", "deadline_label": "", "for_danilo": false, "for_marija": true, "language": "en", "processed_at": "2026-11-26T07:50:00Z", "published_at": "2026-11-25T07:41:26Z", "regions": ["eu", "fr"], "relevance": 2, "services": ["esg-reporting"], "source_name": "Autorité des marchés financiers (AMF)", "status": "new", "summary": "The French market authority AMF notes that the revised, simplified ESRS entered into force on 10 November 2026. They replace the previous standards from financial year 2027 (reports published in 2028) and can be applied voluntarily for financial year 2026. The new set cuts the number of mandatory datapoints by almost 60% and has shorter standards with a new structure.", "text_basis": "article", "thread": "csrd-omnibus", "title_en": "AMF: simplified ESRS in force since 10 November 2026", "topics": ["csrd", "esrs"], "type": "reporting-standard", "url": "https://www.amf-france.org/en/news-publications/news/corporate-sustainability-reporting-entry-force-simplified-esrs", "why_it_matters": "Clients still in CSRD scope can choose the lighter ESRS for their 2026 reports; Energo's ESG reporting service should plan the switch with them.", "id": "122283ec8f033d97a48e4d438992ccc289eaee4a"}, {"also_at": ["https://www.uvek.admin.ch/de/newnsb/AH-xcGzxaLqA"], "certifications": [], "content_angle": "What a single Swiss renovation programme from 2028 means for owners planning heating replacement.", "content_outline": {"article": ["Explain the proposal: one federal and cantonal renovation programme funded only from the earmarked share of the CO2 levy, merging the Gebaeudeprogramm and the Impulsprogramm.", "Note that the cantonal energy directors adopted the model in August and that the start is planned for early 2028.", "Set out the focus areas: replacing fossil heating with renewables, envelope efficiency and comprehensive renovations.", "Give the timing: the consultation runs until 11 February 2027.", "Advise owners planning a heating replacement on how to think about timing between now and 2028, framed as questions to check."], "carousel": ["Slide 1: hook, 'Swiss renovation funding is being redesigned for 2028.'", "Slide 2: one programme instead of two: Gebaeudeprogramm and Impulsprogramm merge.", "Slide 3: funded only from the CO2 levy.", "Slide 4: what it funds: fossil heating replacement, envelope, comprehensive renovation.", "Slide 5: key dates: consultation until 11 February 2027, start planned for early 2028.", "Slide 6: what owners planning a heat pump should ask now."]}, "content_worthy": true, "deadline": "2027-02-11", "deadline_label": "Swiss renovation funding: consultation closes", "for_danilo": true, "for_marija": false, "language": "de", "processed_at": "2026-11-05T23:05:00Z", "published_at": "2026-10-28", "regions": ["ch"], "relevance": 3, "services": ["mep-engineering"], "source_name": "Nau", "status": "new", "summary": "The Federal Council sent a redesigned programme for energy renovation of buildings to consultation. It would be funded only from the earmarked share of ": "publication", "url": "https://www.squirepattonboggs.com/insights/publications/esg-disclosure-and-corporate-due-diligence-obligations-under-the-omnibus-reform", "why_it_matters": "Companies dropping out of the CSRD will still get ESG data requests from lenders and clients, which keeps demand for voluntary reporting such as VSME.", "id": "78d11872992e7c43aee51ef0c4360a0db67d4328"}, {"also_at": [], "certifications": ["leed"], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": false, "for_marija": true, "language": "en", "processed_at": "2026-11-26T07:50:00Z", "published_at": "2026-11-23T14:00:54Z", "regions": ["global", "us"], "relevance": 2, "services": ["certification", "academy"], "source_name": "USGBC", "status": "new", "summary": "Headline only: USGBC announces that its members have ratified LEED v5 for Cities. No further detail was available.", "text_basis": "headline", "thread": "leed-v5", "title_en": "USGBC members ratify LEED v5 for Cities", "topics": ["leed"], "type": "certification-update", "url": "https://www.usgbc.org/articles/leed-v5-cities-ratified-usgbc-members", "why_it_matters": "Completes the LEED v5 family; relevant for municipal clients and for Marija's LEED training content.", "id": "7a6f0d9bc7935a4802588fd6b95b13ee83e514bf"}, {"certifications": [], "content_angle": "What the exemption means in practice for Italian companies, and why investors and lenders will still ask for the data.", "content_outline": {"article": ["Explain decree-law 193/2026, in force since 24 October, amending Italy's CSRD transposition.", "Set out who is exempt for financial years starting 1 January 2026 to 31 December 2027: net revenue up to 450 million euro or up to 1,000 employees on average, either condition enough.", "Explain why investors, lenders and clients will still ask for ESG data.", "Suggest voluntary reporting such as VSME as a practical answer for exempt companies.", "Offer a quick check of a company's positio o.it/art/csrd-consultazione-sugli-standard-di-limited-assurance", "https://esgnews.it/regulator/csrd-la-commissione-ue-pubblica-i-nuovi-standard-per-lassurance-come-partecipare-alla-consultazione", "https://finance.ec.europa.eu/news/commission-seeks-feedback-limited-assurance-standards-sustainability-reporting-2026-11-12_en", "https://t.co/EcjkiXAmG8"], "certifications": [], "content_angle": "CSRD reports will be checked against one EU assurance standard: what auditors will ask for, and how to have the data ready.", "content_outline": {"article": ["Introduce the consultation launched on 12 November on the draft EU standard for limited assurance of sustainability reporting.", "Explain the basis: CEAOB technical advice built on ISSA 5000, adapted to the EU legal framework, and limited assurance confirmed by Omnibus I.", "Cover what assurers would check: ESRS and EU Taxonomy as criteria, Taxonomy eligibility and alignment, digital tagging and third-party verification reports.", "Note the open question on timing (2027, 2028 or later) and the 18 January 2027 deadline for comments.", "End with what reporting companies should ask their advisers now about evidence and data trails, with Energo's view as a separate section."], "carousel": ["Slide 1: hook, 'Your CSRD report will be assured against one EU standard.'", "Slide 2: the Commission opened a consultation on the draft limited assurance standard.", "Slide 3: it is based on ISSA 5000, adapted by CEAOB for EU law.", "Slide 4: ESRS and the EU Taxonomy become the criteria assurers check.", "Slide 5: open question: mandatory from 2027, 2028 or later.", "Slide 6: comments close on 18 January 2027.", "Slide 7: call to action: check your Taxonomy evidence before the auditor does."]}, "content_worthy": true, "deadline": "2027-01-18", "deadline_label": "Consultation on the CSRD assurance standard closes", "for_danilo": false, "for_marija": true, "language": "en", "processed_at": "2026-11-16T06:45:00Z", "published_at": "2026-11-12", "regions": ["eu"], "relevance": 3, "services": ["esg-reporting"], "source_name": "ESG Today", "status": "new", "summary": "The Commission has opened a consultation on draft standards for limited assurance of sustainability reporting under the CSRD, prepared with technical advice from CEAOB and based on ISSA 5000 with EU adaptations. The draft treats ESRS and the EU Taxonomy, including eligibility and alignment checks and digital tagging, as assurance criteria, and asks when the standard should become mandatory: 2027, 2028 or later. Omnibus I confirmed limited assurance and removed the option of moving to reasonable assurance; the consultation is open until 18 January 2027.", "text_basis": "article", "thread": "csrd-omnibus", "title_en": "Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027", "topics": ["csrd", "esrs", "eu-taxonomy", "assurance"], "type": "consultation", "url": "https://www.esgtoday.com/eu-commission-releases-draft-sustainability-reporting-assurance-standards", "why_it_matters": "Clients reporting under CSRD will be assured against these rules, so the evidence trail for Energo's ESG and Taxonomy work has to meet them.", "id": "7ef19c2720a172915527561d7dfbe66d0c771e77"}, {"also_at": [], "certifications": [], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": false, "for_marija": false, "language": "en", "processed_at": "2026-11-12T07:50:00Z", "published_at": "2026-11-09", "regions": ["global"], "relevance": 1, "services": [], "source_name": "Balkan Green Energy News", "status": "new", "summary": "Bulgaria's National Assembly adopted amendments to its Energy from Renewable Sources Act to align with RED3, whose transposition deadline was May 2025.", "text_basis": "article", "thread": "", "title_en": "Bulgaria amends its renewables law to align with RED3", "topics": ["red"], "type": "regulation", "url": "https://balkangreenenergynews.com/bulgaria-amends-energy-from lot running until March 2028.", "text_basis": "article", "thread": "data-centres", "title_en": "NTT Docomo to pilot data centre heat for a shrimp farm in Japan", "topics": ["data-centres", "heat-recovery"], "type": "project", "url": "https://www.datacenterdynamics.com/en/news/ntt-docomo-to-pilot-data-center-heat-reuse-for-on-shore-shrimp-farm-in-japan", "why_it_matters": "Background on uses for low-temperature data centre heat.", "id": "fa9af418ed354a68470775bb5cc08e8df76e0ebd"}, {"also_at": [], "certifications": [], "content_angle": "Noise is a reason to demolish old flats; a Swiss study shows one ceiling can fix noise, heating and cooling.", "content_outline": {"article": ["The problem: many Swiss apartment blocks from 1900 to 1980 are noisy and inefficient, and noise is used to justify demolition.", "The CombiSound study by OST, Empa and FHNW: suspended ceilings with integrated water pipes.", "Results reported: much better sound insulation, plus heating and cooling of the flats.", "Why it matters: avoiding demolition saves embodied emissions and prepares buildings for hotter summers.", "What owners should consider: a section for Energo's view on radiant ceiling retrofits and when to ask for a feasibility check."], "carousel": ["Slide 1: hook: noise is a reason old flats get demolished", "Slide 2: Swiss blocks from 1900 to 1980 are often noisy and inefficient", "Slide 3: CombiSound by OST, Empa and FHNW", "Slide 4: one ceiling with water pipes: quieter, heated and cooled", "Slide 5: less demolition means less embodied carbon", "Slide 6: and better comfort in hotter summers", "Slide 7: weighing renovation against demolition? Ask Energo"]}, "content_worthy": true, "deadline": "", "deadline_label": "", "for_danilo": true, "for_marija": false, "language": "fr", "processed_at": "2026-11-26T07:50:00Z", "published_at": "2026-11-24T09:28:02Z", "regions": ["ch"], "relevance": 2, "services": ["mep-engineering"], "source_name": "admin.ch", "status": "new", "summary": "The CombiSound study by OST, Empa and FHNW shows that suspended ceilings with integrated water pipes can greatly improve sound insulation between flats while heating and cooling them. Poor sound insulation is a common reason to demolish Swiss apartment blocks built between 1900 and 1980. The approach can avoid demolition and its embodied emissions and prepare buildings for hotter summers.", "text_basis": "article", "thread": "", "title_en": "Swiss CombiSound study: suspended ceilings with water pipes cut noise and heat and cool old flats", "topics": ["radiant-systems", "retrofit", "embodied-carbon"], "type": "publication", "url": "https://www.admin.ch/fr/newnsb/QHaUq9fxNXRU", "why_it_matters": "Gives Energo a retrofit argument that joins acoustics, radiant heating and cooling and embodied carbon in Swiss residential projects.", "id": "fae813373d30755411ceb1c39a7af424e171d5e1"}, {"also_at": [], "certifications": [], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": false, "for_marija": true, "language": "en", "processed_at": "2026-11-09T06:40:00Z", "published_at": "2026-10-28", "regions": ["eu"], "relevance": 1, "services": [], "source_name": "Responsible Investor", "status": "new", "summary": "Responsible Investor reports growing scepticism about the reporting reliefs for non-EU companies under the CSRD. Only the headline is available.", "text_basis": "headline", "thread": "csrd-omnibus", "title_en": "Scepticism over CSRD reliefs for non-EU groups", "topics": ["csrd"], "type": "publication", "url": "https://www.responsible-investor.com/scepticism-mounts-over-non-eu-reporting-reliefs-under-csrd", "why_it_matters": "Background on CSRD scope.", "id": "fb98626d4f596ffd491533ec8921d42b7a338db7"}, {"also_at": [], "certifications": [], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": false, "for_marija": false, "language": "en", "processed_at": "2026-11-09T06:40:00Z", "published_at": "2026-11-03", "regions": ["global"], "relevance": 1, "services": [], "source_name": "Sustainable Views", "status": "new", "summary": "Sustainable Views reports that development banks are counting data centres as climate finance. Only the headline is available.", "text_basis": "headline", "thread": "data-centres", "title_en": "Development banks count data centres as climate finance", "topics": ["data-centres", "green-finance"], "type": "publication", "url": "https://www.sustainableviews.com/development-banks-count-data-centres-as-climate-finance-17ae7673", "why_it_matters": "Background on green finance for data centres.", "id": "fc2ff0ded976e3e353d6156e5e4799a894df1cf6"}, {"also_at": [], "certifications": ["gresb"], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": false, "for_marija": false, "language": "en", "processed_at": "2026-11-16T06:45:00Z", "published_at": "2026-11-04", "regions": ["us"], "relevance": 1, "services": ["certification"], "source_name": "Yahoo Finance", "status": "new", "summary": "US community solar owner PureSky reports a GRESB Infrastructure Asset Score of 93.8 in the 2025 assessment, up 4.4 points.", "text_basis": "article", "thread": "certification-finance", "title_en": "PureSky Energy scores 93.8 in GRESB Infrastructure", "topics": ["gresb"], "type": "market-news", "url": "https://finance.yahoo.com/energy/articles/puresky-energy-earns-improved-2025-140000253.html", "why_it_matters": "Background on GRESB results.", "id": "fcaef34b2d217541952276a0f28b8f3724acf2a3"}, {"also_at": [], "certifications": [], "content_angle": "UK Net Zero Carbon Buildings Standard goes to verification: what it means for European owners.", "content_outline": {"article": ["Explain that the UK Net Zero Carbon Buildings Standard has moved from framework to verification.", "Discuss the point that verified 'Net Zero Carbon Aligned' status may become a market expectation.", "Add that the FCA has finalised UK SRS rules for listed companies on a comply-or-explain basis.", "Discuss what it means for European owners with UK assets or UK investors."], "carousel": ["Slide 1: hook, 'UK net zero buildings now get verified.'", "Slide 2: what the NZCBS is.", "Slide 3: from framework to verification.", "Slide 4: UK SRS rules final.", "Slide 5: what it means for European owners.", "Slide 6: call to action."]}, "content_worthy": true, "deadline": "", "deadline_label": "", "for_danilo": true, "for_marija": true, "language": "en", "processed_at": "2026-11-06T00:05:00Z", "published_at": "2026-10-19", "regions": ["uk"], "relevance": 2, "services": ["esg-reporting", "certification"], "source_name": "Mishcon de Reya LLP", "status": "new", "summary": "Mishcon's quarterly review says the UK Net Zero Carbon Buildings Standard has moved from framework to verification, so verified 'Net Zero Carbon Aligned' status may become a market expectation. The FCA has finalised UK SRS rules for listed companies on a comply-or-explain basis.", "text_basis": "article", "thread": "", "title_en": "Mishcon ESG Watch Q3 2026: UK NZCBS moves to verification, UK SRS rules final", "topics": ["uk-nzcbs", "uk-srs", "esg-reporting"], "type": "publication", "url": "https://www.mishcon.com/news/esg-watch-rules-become-reality", "why_it_matters": "A new verifiable net zero building standard in the UK that owners and lenders may start asking for.", "id": "fd5edf7e36f38ba0f5e6f1688cc08ee6c2de0735"}, {"also_at": [], "certifications": [], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": true, "for_marija": false, "language": "it", "processed_at": "2026-11-06T00:05:00Z", "published_at": "2026-10-20", "regions": ["eu"], "relevance": 2, "services": ["mep-engineering", "certification"], "source_name": "Eunews", "status": "new", "summary": "Answering Lega MEPs, Energy Commissioner Dan Jorgensen said more than half of Member States have self-declared partial transposition of the EPBD, so the Commission does not accept that all have failed to transpose it. The Commission opened infringement procedures against all 27 on 15 July and will review the directive by the end of 2028; it is not reopening the text now.", "text_basis": "article", "thread": "epbd-transposition-eu", "title_en": "Jorgensen: over half of Member States have partly transposed the EPBD", "topics": ["epbd"], "type": "regulation", "url": "https://www.eunews.it/2026/10/20/case-green-jorgensen-smentisce-lammutinamento-dei-governi-meta-degli-stati-ha-gia-in-parte-recepito-le-norme", "why_it_matters": "The EPBD is staying as it is, so national transposition and its building requirements will come.", "id": "fe37d069abedaf22ba682399ba4b41f795cc84e0"}, {"also_at": [], "certifications": [], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": false, "for_marija": false, "language": "it", "processed_at": "2026-11-19T06:50:00Z", "published_at": "2026-11-18", "regions": ["it"], "relevance": 1, "services": [], "source_name": "Ingenio", "status": "new", "summary": "An INGENIO survey, projected to 400 respondents, finds that professionals want seismic safety and energy efficiency treated together in building bonuses, with verifiable energy savings and a return of credit transfer under clear rules and strict controls.", "text_basis": "article", "thread": "italy-incentives-2027", "title_en": "INGENIO survey: professionals want seismic and energy bonuses weighted equally", "topics": ["incentives"], "type": "publication", "url": "https://www.ingenio-web.it/articoli/bonus-edilizi-sisma-energia-risparmio-cessione-credito-sondaggio", "why_it_matters": "Background on what the Italian technical community asks from the 2027 incentives.", "id": "feb7c5cbdbf2da6d78f28b47c7f5cb6d988bf11a"}, {"also_at": ["https://magazinbiznis.rs/pripremljena-studija-o-razvoju-data-centara-u-becu"], "certifications": [], "content_angle": "", "content_worthy": false, "deadline": "", "deadline_label": "", "for_danilo": true, "for_marija": false, "language": "sr", "processed_at": "2026-11-12T07:50:00Z", "published_at": "2026-11-11", "regions": ["at"], "relevance": 2, "services": ["mep-engineering"], "source_name": "Dunav.at", "status": "new", "summary": "STRABAG Real Estate and the Vienna Business Agency are planning a modular data centre in Seestadt Aspern with up to 48 MW grid connection, built in phases, and estimated by EcoAustria to trigger about 350 million euro of investment. Server heat could heat about 12,700 households, according to the headline. EcoAustria puts Austrian data centre demand at about 419 MW against 80 to 100 MW of supply.", "text_basis": "article", "thread": "data-centres", "title_en": "Vienna plans a 48 MW data centre whose heat could warm thousands of homes", "topics": ["data-centres", "heat-recovery"], "type": "project", "url": "https://dunav.at/bec-planira-data-centar-od-48-megavata-toplota-iz-servera-mogla-bi-grijati-12-700-domacinstava", "why_it_matters": "Another European project designing heat reuse in from the start, close to Energo's markets.", "id": "ff08be9cf95bf354b4d84baff8d8bfa40d75d5ae"}, {"certifications": [], "content_worthy": false, "for_danilo": true, "for_marija": false, "language": "it", "processed_at": "2026-11-05T23:05:00Z", "published_at": "2026-10-21", "regions": ["it"], "relevance": 3, "services": ["performance-testing"], "source_name": "ACCA software", "status": "new", "summary": "In a notice of 19 October, ENEA said DOCET cannot be used to issue APEs until further notice, because it does not reflect the D.M. of 28 October 2025 updating the minimum requirements. The notice does not cover certificates already prepared or work in progress.", "text_basis": "article", "thread": "ape-italy", "title_en": "ENEA: DOCET can no longer be used to issue energy performance certificates", "topics": ["ape", "energy-certificates"], "type": "guidance", "url": "https://biblus.acca.it/certificazione-energetica-stop-all-uso-del-docet", "why_it_matters": "Anyone issuing APEs in Italy with DOCET must move to compliant software now. Affects our certificate and audit work in Italy if DOCET is in use.", "id": "ff6d43a246af9f67a3d8014bc5bdeb6f428af809"}], "threads": [{"state": "Italy's updated minimum energy requirements decree (D.M. 28.10.2025) is in force, changing envelope checks, thermal bridges and BACS rules. ENEA has stopped DOCET for issuing APEs after the update, and its annual report on APEs issued in 2025 is coming.", "title": "Energy performance certificates (APE) in Italy", "updated": "2026-11-06", "id": "ape-italy"}, {"state": "Lenders are starting to price verified BREEAM performance into loan terms. GRESB published its 2026 results on 27 October, and preparation for the 2027 cycle is the next step for real estate investors.", "title": "Certification in finance and investment", "updated": "2026-11-06", "id": "certification-finance"}, {"state": "The Federal Council proposes one federal and cantonal programme funded only from the CO2 levy, merging the Gebäudeprogramm and the Impulsprogramm. The consultation closes on 11 February and the start is planned for early 2028.", "title": "Swiss renovation funding from 2028", "updated": "2026-11-05", "id": "ch-funding"}, {"state": "The revised regulation applies from 8 January 2026. Declarations of performance become DoPCs with life-cycle environmental data, and a Digital Product Passport is introduced; exact requirements arrive through delegated acts and harmonised standards.", "title": "Construction Products Regulation, EPDs and product passports", "updated": "2026-11-07", "id": "cpr-epd"}, {"state": "Omnibus I narrowed the CSRD to groups above 1,000 employees and 450 million euro turnover, and the simplified ESRS entered into force on 10 November 2026: mandatory from financial year 2027, optional for 2026, with almost 60% fewer mandatory datapoints. The Voluntary Standard was adopted as a Delegated Act in September 2026, and EFRAG asks companies outside CSRD scope to sign up for engagement by 15 December. Open consultations: the Commission's draft limited assurance standard until 18 January 2027, EFRAG's ISSB nature comment letter until 19 January 2027, and EFRAG's 2027 to 2029 agenda until 15 February 2027, with a launch webinar on 7 December.", "title": "CSRD after Omnibus I", "updated": "2026-11-26", "id": "csrd-omnibus"}, {"state": "Rules are tightening: the EU plans annual A to G labels for PUE and WUE for data centres of 500 kW or more from 15 August 2027, and Spain requires 80% renewable power and water efficiency limits. Local resistance is spreading in Europe: Wales' Future Generations Commissioner wants a pause on new AI data centres until national guidance exists, and in Beringen (Schaffhausen) a petition with 1,800 signatures targets two planned sites that together would use more power than the canton. Heat reuse projects in Dielsdorf and Bulle show the Swiss route to acceptance.", "title": "Data centres: energy, cooling and the grid", "updated": "2026-11-26", "id": "data-centres"}, {"state": "Owners and tenants of tertiary buildings with 1,000 m² or more must declare consumption every year on OPERAT and cut final energy use by 40% by 2030, 50% by 2040 and 60% by 2050. Guidance for 2027 focuses on data quality and tracking the trajectory.", "title": "France's tertiary decree (Décret tertiaire)", "updated": "2026-11-09", "id": "decret-tertiaire"}, {"state": "London's draft plan caps upfront embodied carbon and requires whole-life carbon reporting, and LCA tools are being marketed around LEED v5. BRE, USGBC, DGNB and other rating bodies have started a 12-month collaboration on how BREEAM, LEED, DGNB, EDGE and Green Star recognise responsible timber construction.", "title": "Embodied carbon and LCA", "updated": "2026-11-12", "id": "embodied-carbon"}, {"state": "The transposition deadline passed on 29 May 2026 and the Commission sent Italy two reasoned opinions on 1 October. On 18 November the government said it cannot give a transposition date because the decree depends on the 2026 EU Delegation Law still in Parliament; MASE is drafting the national renovation plan and a funding mix of deductions, Conto Termico and credit tools. Minister Pichetto says Italy will decide the timing and methods, while local actors point to unresolved one-stop shop funding.", "title": "Italy's transposition of the EPBD (Case Green)", "updated": "2026-11-26", "id": "epbd-italy"}, {"state": "Serbia must adopt an action plan for its long-term building renovation strategy to progress in Chapter 15, and amended its Law on Planning and Construction in August 2026. Croatia's new building energy efficiency law applies from 1 January 2026, and Montenegro's draft requires new public buildings to be zero-emission from 2028.", "title": "Serbia and the region: aligning building energy rules with the EU", "updated": "2026-11-07", "id": "epbd-serbia"}, {"state": "The Commission opened infringement procedures against all 27 Member States on 15 July and says more than half have partly transposed the directive. EPP and Lega MEPs are pushing back, but the Commission is not reopening the text and plans its review by the end of 2028. Countries such as Greece report difficulty adapting older building stock.", "title": "EPBD transposition across the EU", "updated": "2026-11-06", "id": "epbd-transposition-eu"}, {"state": "The carbon price on fuels for building heating and road transport is set to start in 2028. Ahead of the 26 and 27 November European Council, the Visegrad leaders asked for a delay to 2030, while Spain, Germany, Denmark, Finland, Luxembourg, the Netherlands, Portugal and Sweden asked the Commission to keep the design and timetable. Spain approved a decree-law transposing ETS2 on 20 November, and the environment committee votes on the ETS reform on 1 December.", "title": "ETS2: carbon price on building heating", "updated": "2026-11-26", "id": "ets2"}, {"state": "The Commission proposes updated technical criteria for building activities: a new route for existing buildings that cut primary energy demand by at least 60% in ten years, new buildings measured against zero emission buildings, and EPC class D as a minimum for acquisition and ownership. Adoption is pending.", "title": "EU Taxonomy review of building criteria", "updated": "2026-11-07", "id": "eu-taxonomy-review"}, {"state": "Germany dropped its 65% renewable rule: under the Building Modernisation Law, new fossil heating installed in existing buildings after 29 July 2026 must use a rising share of green fuels from 2029, and a green gas quota bill is due by 1 December 2026. Liechtenstein is easing heat pump permits, France is shifting renovation aid toward energy savings certificates, Spain multiplies savings credits for heat pumps, the UK Future Homes Standard moves new homes to heat pumps from March 2027 and Graubünden has a tender for industrial high-temperature heat pumps until 26 April 2027. The EU has authorised F-gas exemptions for some indoor monoblock heat pumps and for commercial laundry equipment with heat pumps.", "title": "Heating rules across Europe", "updated": "2026-11-19", "id": "heating-rules"}, {"state": "The 2027 budget bill (A.C. 3174-bis) proposes 36% as the standard rate and 50% for main homes with a cap of 96,000 euro per unit, and drops the return of the ecobonus to 65%. A gap in the new income tax code (D.Lgs. 117/2026, from 1 January 2027) may leave stand-alone heat pumps out of the Ecobonus; amendments propose to restore them with a 65% deduction for 2027. The Conto Termico 3.0 is oversubscribed, and Sicily plans a 25 million euro revolving fund so schools can pre-finance Conto Termico projects.", "title": "Italian building incentives for 2027", "updated": "2026-11-26", "id": "italy-incentives-2027"}, {"state": "USGBC published its October LEED updates (guidance, project priorities, alternative compliance paths) and guidance for project managers running LEED v5 projects.", "title": "LEED v5 in practice", "updated": "2026-11-05", "id": "leed-v5"}, {"state": "Scotland's Stage 2 consultation proposes Passivhaus certification as a deemed-to-satisfy route under standard 6.1, alongside a Scottish Passivhaus-equivalent standard that housing bodies have criticised. In England, planning rules such as the South Downs requirement for 10% Passivhaus homes are driving the first volume projects.", "title": "Passivhaus in UK building rules", "updated": "2026-11-26", "id": "scotland-passivhaus"}, {"state": "The Ministry of Mining and Energy keeps handing out renovation subsidies with municipalities: almost 50,000 households in three years, with a target of 20,000 more. Rates reach up to 90% for vulnerable households, 50% for single measures and 65% for packages.", "title": "Serbia's household energy renovation subsidies", "updated": "2026-11-06", "id": "serbia-renovation-subsidies"}, {"state": "On 19 November 2026 the Council and Parliament reached a provisional agreement on SFDR 2.0, with three product categories (sustainable, transition, ESG basics) and at least 70% of a product's investments aligned with its category. Transition products can hold fossil fuel companies only if they put at least 20% of capex into Taxonomy-aligned activities and have a time-bound emissions plan. After formal adoption and publication, the rules apply two years later.", "title": "SFDR 2.0 and real estate funds", "updated": "2026-11-23", "id": "sfdr-2"}, {"state": "Member States must publish roadmaps for national life-cycle GWP limit values for new buildings by 1 January 2027. Life-cycle GWP must be calculated and disclosed for new buildings over 1,000 m² from 2028 and for all new buildings from 2030. Germany makes LCA mandatory for new buildings over 1,000 m² from 2028.", "title": "Whole-life carbon in EU building rules", "updated": "2026-11-07", "id": "whole-life-carbon"}], "digests": [{"id": "2026-11-06", "date": "2026-11-06", "kind": "mid-week", "title": "Energo Intelligence: mid-week update, 6 November 2026", "item_ids": ["f326e3ded507a9ac6aeddb115337ee3bd94586f6", "7a8feb2e3a5efc199d969d83b178ba0212bf9de1", "90d9eb1a0cc8e11ac9b1caddf722c619c6d0e913", "d495298ecdc0b54eab91bb5bd4bc2a7d31878021", "ff6d43a246af9f67a3d8014bc5bdeb6f428af809", "bb1ccadab8cca2fce1f22bfa033acffa0acdc813", "13367f3c4a5242496a42478b00180617281e6add"], "text": "TOP 5\n\n1. Italy speeds up EPBD transposition under EU pressure. MASE has sent Parliament draft principles for the Case Green directive to go into the 2026 EU Delegation Law, and the Commission has issued a reasoned opinion over Italy's missing renovation plan. Expect Italian renovation and certificate requirements to follow. [[f326e3ded507]]\n2. Italy exempts companies up to 450 million euro revenue or 1,000 employees from CSRD reporting for 2026 and 2027. Investors and lenders will still ask for the data, so VSME and GRESB stay relevant. [[7a8feb2e3a5e]]\n3. Italian incentives for 2027 are taking shape: the budget keeps the 50% and 36% bonus rates, and the Conto Termico 3.0 amendment passed the Unified Conference with new technical requirements. [[90d9eb1a0cc8]] [[d495298ecdc0]]\n4. ENEA has stopped DOCET for issuing APEs because it does not follow the new minimum requirements decree (D.M. 28.10.2025), which also changes envelope, thermal bridge and BACS checks. [[ff6d43a246af]] [[bb1ccadab8cc]]\n5. Switzerland proposes one renovation funding programme paid from the CO2 levy, merging the Gebaudeprogramm and Impulsprogramm, from early 2028. Consultation closes 11 February. [[13367f3c4a52]]\n\nCOMING UP\n\n11 Feb 2027: Swiss renovation funding consultation closes [[13367f3c4a52]]\n15 Feb 2027: EFRAG consultation on its 2027 to 2029 agenda closes [[5aa5fd21d92d]]\n19 Mar 2027: Omnibus I CSRD amendments must be transposed [[3b6db2e3cd2f]]\n24 Mar 2027: UK Future Homes Standard applies to most new homes [[8149337600b9]]\n31 Dec 2029: last date to apply for the Bolzano energy bonus [[ca6a4e15ddb7]]\n\nEU REGULATION AND ESG REPORTING\n\nOnly four Member States have transposed Omnibus I so far; eight have taken no step. [[3b6db2e3cd2f]]\nESMA will look at double materiality and connected information in 2026 sustainability statements; FY2026 is a transition year for ESRS sets. [[2195ff5e9ac2]]\nEFRAG plans no new standards from 2027 to 2029 and wants to spend half its capacity on implementation support. [[5aa5fd21d92d]]\nThe EPBD stays as it is: the Commissioner says over half of Member States have partly transposed it, and infringement procedures continue despite pushback from 18 EPP MEPs. [[fe37d069abed]] [[f6de68512b0b]]\nWhere it stands: the CSRD scope is shrinking nationally while the ESRS settle; the EPBD text is fixed and pressure is on transposition.\n\nITALY, SERBIA, SWITZERLAND\n\nItaly: GSE expects a large Conto Termico for public buildings, plus 600 million euro for hospitals; Edilportale reports 1.6 billion for public building efficiency. [[5bb8cc62224c]] [[6cd35cb69019]]\nItaly: ENEA updated its 13 Ecobonus guides, and Ecobonus spending limits change from 2027. [[d284476fd864]] [[a3bb055b6d04]]\nItaly: the Bolzano court ruled that local rules cannot run ahead of the EPBD. [[297923a46a0f]]\nItaly: at the Green Building Forum, a GBC Italia survey found 67% think their home needs efficiency work but only 28% plan to pay for it. [[0c0d5039d560]]\nSerbia: almost 50,000 households have received renovation subsidies in three years; Valjevo households got up to 90%. [[44a04a0c85da]] [[92fbccc46743]]\nSerbia: a BuildUp panel named grid capacity and financing as the limits for data centres and large projects. [[81ef81d0b2a1]]\nSwitzerland: tenants won rent cuts after a building lost its Minergie label over ventilation that did not meet the requirements. [[05ee8a9eb75f]]\n\nOTHER EUROPEAN COUNTRIES\n\nGermany dropped the 65% renewable rule for new heating systems. [[eaa5b6fb43d2]]\nUK: London's draft plan caps upfront embodied carbon, and the UK net zero carbon buildings standard has moved to verification. [[4570374a50e6]] [[fd5edf7e36f3]]\n\nCERTIFICATIONS\n\nUSGBC's October LEED updates cover new guidance, priorities and ACPs; read the full update. [[be873261ca8b]]\nUSGBC launched TRUE v2 and published guidance on running LEED v5 projects. [[a64b24a7b24e]] [[23729176f35e]]\nA UK lender now cuts fees for verified BREEAM Excellent and Outstanding performance. [[49f8204cfeac]]\nDGNB and the Cradle to Cradle institute launched joint training on circularity. [[afbf08bc7010]]\n\nENGINEERING AND DATA CENTRES\n\nThe EU data centre rating expected in 2027 will look at efficiency and waste heat reuse. [[60612bef6be7]]\nCooling electricity demand is expected to rise 80% in 15 years. [[e1b238b2be9e]]\n\nFOR MARIJA\n\nItaly CSRD exemption, Omnibus I deadline, ESMA priorities, EFRAG consultation, VSME template, October LEED updates, TRUE v2. [[7a8feb2e3a5e]] [[2195ff5e9ac2]] [[5aa5fd21d92d]] [[880cbe99de34]] [[be873261ca8b]] [[a64b24a7b24e]]\n\nFOR DANILO\n\nNew Italian minimum requirements and the DOCET stop, Conto Termico changes, Minergie rent case, Swiss funding programme, data centre rating and Serbian grid limits. [[bb1ccadab8cc]] [[ff6d43a246af]] [[d495298ecdc0]] [[05ee8a9eb75f]] [[13367f3c4a52]] [[60612bef6be7]] [[81ef81d0b2a1]]\n\nCONTENT IDEAS\n\nLinkedIn: when a green label is withdrawn, the Minergie rent case and why commissioning matters. [[05ee8a9eb75f]]\nNewsletter (IT): what the 2027 budget and Conto Termico changes mean for owners and public buildings. [[90d9eb1a0cc8]]\nLinkedIn: Italy's CSRD exemption and why lenders will still ask for ESG data. [[7a8feb2e3a5e]]\nWebsite: what Italy's new minimum requirements change for envelope, thermal bridges and BACS. [[bb1ccadab8cc]]\nLinkedIn: a lender pricing verified BREEAM performance into loan terms. [[49f8204cfeac]]"}, {"id": "2026-11-09", "date": "2026-11-09", "kind": "weekly", "title": "Energo Intelligence: week of 9 November 2026", "item_ids": ["e6ef6a0daa3f4b33929e459b6bbcc3d9288e4de0", "8cb4f31c80510849f3a35eb3260181822813e41d", "bddf36713a58fdf209e82fb53a53a60ec6860b70", "991f78f26f3254f878fff4d44fe43e67f7bd95ee", "a3b8cb63c739732c86636860e61cedb1c7936ffb", "a88b912ea77b9d3da6d2202f24a3c09e6dd6aaa4", "5e1bd52a80f33a64a22242555ec81a3587f95c72", "89e40b4520197fc0c7a1f84326edbbfe80592bf3", "78d11872992e7c43aee51ef0c4360a0db67d4328", "344f496248a7344f38c524595bb19c951a494db9", "fa27c54e30c7918fe3ff6e3a720622dd7695cae9", "e9412662dcf7310fb84af2574cfbc975372e9e15", "3bdcbd865b03e36bb879b016e2c6296ac0d97279", "a4eff6b3c97507f1f8216d82623df1a2352d4697", "3e68cacb9268223e277f637cd228137c7ba29589", "0f101d70b96722e895c1403b11e963f34fa106b3", "9180206218b5a3e6ba6b1f5bf7324a33dc49d599", "0c0601bc0db71ef9a9ac99caa0f0c5bdf2b7dac0", "06bbca6a6cb121d67ae8d3487a9e63f3d2c60cba", "a0127741f458d037ec411d5600a69c51bb8208a0", "2754aea2137fa608c92cb7602e655c561cf1412c", "48b9c0d715ace16e58ef21f181c30cc4ca583e80", "e7b017305b8a68da6ab1ebf6c8443e944224d68b", "4f1c519654cc13c99d18f6b0246c9be52b34c59a", "8f19b20dafd816f4bee22e37c4d92a196c2bd77e", "e51fec434bd0856dd0cf07b4bc7e972f08ad2e68", "a7d9bab0236b55246a5a48b1c4a56ff9eeca6ae5", "ec8705e7a7f4e98b185ddb48deed44816bc669e6", "9ed05bc48da1894cfde78f773c46fb5f1ece896e", "dc297e3ab38b13250c38f13d16d2efa811cbba71", "887e630617beca28d7db09dfa85e9aab1f46dc8c", "9ff19b1a19b1b45a2c1099a567205c1bb771ce2e", "662402a1006068246da1ec41f84729c986f9971d", "6ea42d5650a5a567d669a59102152e5d2fd16b36", "13367f3c4a5242496a42478b00180617281e6add", "5aa5fd21d92d5567af3d04460501f8c24cb9128e", "3b6db2e3cd2f7414dcd6a13e6a50902b31b0b3d0", "8149337600b9abf3e8c1d6ff0de01d0fdb6b14f6"], "text": "TOP 5 THIS WEEK\n\n- GRESB publishes the key changes for its 2028 Standards (GRESB)\n  GRESB published the key changes for its 2028 Standards, which move toward performance-based scoring on energy and GHG emissions, assessing the 2027 reporting year.\n  Why it matters: Investor clients will be scored more on measured energy and emissions performance from the 2027 data year, so the data and the engineering behind it start now.\n  Source: https://www.gresb.com/news-and-updates/\n- Whole-life carbon: national GWP roadmaps due by 1 January 2027 (Construction Industry Federation)\n  Member States must publish roadmaps for national life-cycle GWP limits for new buildings by 1 January 2027; disclosure on EPCs starts in 2028 for new buildings over 1,000 m².\n  Why it matters: Whole-life carbon becomes a regulated number on every larger new building from 2028, which turns LCA from an optional study into a permit-stage deliverable. A natural place for Energo to have a clear view.\n  Source: https://cif.ie/2026/02/12/epbd-current-state-of-play/\n- Germany: first parts of the building modernisation law apply from 1 January 2027 (Nexvyra)\n  Germany's building modernisation law brings minimum standards for existing non-residential buildings and A to G classes from 1 January 2027, and mandatory LCA for new buildings over 1,000 m² from 2028.\n  Why it matters: Germany is making LCA mandatory for larger new buildings and setting minimum standards for existing non-residential stock, a preview of what EPBD transposition brings elsewhere.\n  Source: https://nexvyra.de/news/2026-10-03-frist-gmodg-90-tage-inkrafttreten-01-01-2027.html\n- ETS2: compensation rules for fuel consumers published in the Official Journal (FASI.eu)\n  FASI reports that the ETS2 rules on compensation for fuel consumers are now in the Official Journal (headline only).\n  Why it matters: ETS2 will put a carbon price on building heating fuels; the support rules affect how fast owners switch to heat pumps.\n  Source: https://fasi.eu/en/articles/news/30959-ets2-rules-on-compensation-for-fuel-consumers-published-in-the-official-journal-of-the-eu.html\n- Parksmart pauses precertification and moves market engagement to IPMI (Parksmart)\n  Parksmart precertification is paused from July 2026; IPMI now leads market engagement while GBCI keeps certification and reviews.\n  Why it matters: Changes how we advise Parksmart clients on timing, since precertification is no longer an option, and who the programme contact is.\n  Source: https://parksmart.parking-mobility.org/certification/\n\nDEADLINES AND OPEN CONSULTATIONS (NEXT 6 MONTHS)\n\n- 23 Nov 2026: Tender deadline. Galliate public lighting energy upgrade tender\n- 1 Jan 2027: National whole-life carbon roadmaps due. Whole-life carbon: national GWP roadmaps due by 1 January 2027\n- 1 Jan 2027: Germany: first GModG requirements apply. Germany: first parts of the building modernisation law apply from 1 January 2027\n- 15 Jan 2027: Award applications close. Energy Efficiency Award: applications open until 15 January 2027\n- 11 Feb 2027: Swiss renovation funding: consultation closes. Switzerland proposes one renovation funding programme paid from the CO2 levy\n- 15 Feb 2027: EFRAG agenda consultation closes. EFRAG consults on its 2027 to 2029 sustainability reporting agenda\n- 19 Mar 2027: Omnibus I CSRD amendments: transposition deadline. Omnibus I: less than five months left to transpose the CSRD amendments\n- 24 Mar 2027: UK Future Homes Standard applies. UK Future Homes Standard: heat pumps and on-site renewables from 2027\n\nEU REGULATION AND ESG REPORTING\n\n- EU Taxonomy review: new criteria proposed for building activities (Nordea)\n  The Commission proposes new Taxonomy criteria for buildings: existing buildings qualify after a 60% cut in primary energy demand within ten years, new buildings are measured against zero emission buildings, and acquisition needs at least EPC class D.\n  Why it matters: Changes what investors and lenders can label as green real estate, and gives deep renovations a clearer route to alignment, which ties directly to due diligence and energy modelling work.\n  Source: https://www.nordea.com/en/news/eu-taxonomy-flash-update-on-the-2026-review-and-changes-to-the-climate-delegated-act\n- SFDR 2.0: three fund categories replace Articles 8 and 9 (Arthur Cox)\n  SFDR 2.0 proposes replacing Article 8 and Article 9 with three voluntary categories: Transition, ESG Basics and Sustainable.\n  Why it matters: The transition category fits funds that retrofit existing buildings, and funds will need evidence of improvement, which is where measured performance, certification and CRREM pathways come in.\n  Source: https://www.arthurcox.com/knowledge/sfdr-2-0-update/\n- Construction Products Regulation: environmental data and product passports for building products (Kiwa)\n  The revised Construction Products Regulation (EU) 2024/3110 applies from 8 January 2026.\n  Why it matters: Manufacturers will need verified EPDs and product LCA data, a direct opening for Energo's product LCA and EPD work and for education aimed at vendors.\n  Source: https://www.kiwa.com/en/news/construction-products-regulation-cpr-kiwa-and-vincotte-in-the-final-stages-of-becoming-a-notified-body/\n- Squire Patton Boggs: what the Omnibus reform means for ESG reporting and due diligence (Squire Patton Boggs)\n  The Omnibus reform, adopted as Directive (EU) 2026/470, narrows the scope of the CSRD and the CSDDD, so many companies will report later or not at all.\n  Why it matters: Companies dropping out of the CSRD will still get ESG data requests from lenders and clients, which keeps demand for voluntary reporting such as VSME.\n  Source: https://www.squirepattonboggs.com/insights/publications/esg-disclosure-and-corporate-due-diligence-obligations-under-the-omnibus-reform\n- Carbon price on building heating delayed to 2028 (Euronews)\n  EU lawmakers agreed to delay ETS2, the carbon price on fuels for buildings and road transport, until 2028, one year later than planned.\n  Why it matters: Fossil heating gets a carbon price from 2028, a timing argument for owners weighing heat pumps and efficiency upgrades now.\n  Source: https://www.euronews.com/2025/12/10/carbon-tax-on-buildings-and-transport-delayed-to-2028-under-eu-climate-deal\n- Poland wants ETS2 added to the ETS reform talks (UA.NEWS)\n  Poland asked to add ETS2 to the ETS1 reform negotiations, which it believes could open the way to delaying ETS2 to at least 2030 or making it voluntary.\n  Why it matters: Any further delay to ETS2 changes the business case for heating upgrades in buildings.\n  Source: https://ua.news/en/dovkolo-svitu/polshcha-domagaietsia-vkliuchennia-ets2-do-peregovoriv-pro-reformu-ets-rmf24\n  Thread, ETS2: carbon price on building heating: Carbon price on heating fuels starts in 2028; compensation rules are now in the Official Journal, and Poland is pushing for a further delay.\n  Thread, CSRD after Omnibus I: Omnibus I was adopted as Directive (EU) 2026/470; transposition is due by 19 March 2027.\n\nITALY, SERBIA, SWITZERLAND\n\n- Thermal bridges under Italy's new minimum energy requirements (Ingenio)\n  Ingenio explains how the D.M. 28 October 2025 changes the way thermal bridge limit values are calculated in legal checks for new and existing buildings.\n  Why it matters: Directly changes envelope calculations on Italian projects and APEs.\n  Source: https://www.ingenio-web.it/articoli/ponti-termici-requisiti-minimi-2025-verifiche-trasmittanza\n- MASE guidance on applying Italy's new minimum energy requirements (Certifico)\n  On 18 June 2026 MASE issued guidance to practitioners on how to apply the minimum energy performance requirements in the decree of 28 October 2025, which updates the 2015 decree.\n  Why it matters: Official clarification on when and how the new requirements apply, needed for every Italian design, APE and energy report.\n  Source: https://www.certifico.com/id/26502\n- Lombardy updates its building energy efficiency rules (Regione Lombardia)\n  Regione Lombardia updated its building energy efficiency provisions with decree 6437 of 15 May 2026, replacing decree 18546 of 2019.\n  Why it matters: Lombardy, which includes Milan, sets its own rules on energy performance and certificates, so projects there follow the regional decree.\n  Source: https://www.regione.lombardia.it/ambiente-e-territorio/energia/impianti-termici-edilizia-sostenibile-e-certificazione-energeti/disposizioni-per-efficienza-energetica-degli-edifici\n- Case Green: indoor air quality becomes a building requirement (greencity.it)\n  The article notes that Article 13 of the EPBD (2024/1275) requires Member States to set indoor air quality requirements.\n  Why it matters: IAQ requirements will tie renovation projects to ventilation design and testing, which Energo offers.\n  Source: https://www.greencity.it/casa/19102/direttiva-case-green-non-basta-isolare-la-qualita-dellaria-interna-entra-tra-i-requisiti-obbligatori-degli-edifici.html\n- Superbonus: 2027 budget spreads the last share of 2023 credits over ten years (Edilportale)\n  Edilportale reports that the 2027 budget spreads the final instalment of Superbonus credits from 2023 over ten years.\n  Why it matters: Affects cash flow for owners and firms holding Superbonus credits.\n  Source: https://www.edilportale.com/news/2026/11/normativa/superbonus-2027-crediti-2023-in-10-rate-fino-al-2036_112615_15.html\n- Umbria: incentives to replace stoves and fireplaces with biomass or heat pumps (ACCA software)\n  ACCA reports that Umbria offers incentives to replace stoves and fireplaces with biomass generators and heat pumps.\n  Why it matters: Regional heating incentive in Italy.\n  Source: https://biblus.acca.it/notizie/umbria-incentivi-per-sostituire-stufe-e-camini-con-generatori-a-biomassa-e-pompe-di-calore\n- Serbia's EU talks: building renovation action plan needed for Chapter 15 (EU Info Centar)\n  Serbia has opened Cluster 4, which includes negotiating Chapter 15 on energy.\n  Why it matters: EU accession is what will bring EPBD-style requirements to Serbia, so the renovation action plan is the signal to watch for Serbian clients.\n  Source: https://euinfo.rs/plac3/vesti/novi-ciklus-radionica-zapocet-temom-energetske-efikasnosti-zgrada\n- Serbia amends the Law on Planning and Construction: solar for own use, construction waste plans (Paragraf)\n  The amendment of 31 August 2026 eases rules for solar plants up to 1 MW built for own use within an industrial or business complex, with conditions from the infrastructure manager inside protective zones.\n  Why it matters: On-site solar for industrial clients gets simpler in Serbia, and construction waste plans enter the permit process, which links to circularity credits in LEED, BREEAM and DGNB.\n  Source: https://www.paragraf.rs/izmene_i_dopune/31082026-zakon-o-izmenama-i-dopunama-zakona-o-planiranju-i-izgradnji.html\n- New EU directives and the future of building renovation in Serbia (Energetski portal)\n  Energetski portal compares the EPBD's push for 2 to 3% yearly renovation of the building stock with Serbia's first subsidy and loan programmes.\n  Why it matters: Frames the renovation market Energo serves in Serbia and where EU rules will push it.\n  Source: https://energetskiportal.rs/nove-direktive-evropske-unije-i-buducnost-energetske-sanacije-zgrada-u-srbiji\n- Novi Sad: city energy efficiency plan (eKapija)\n  eKapija lists an investment entry for an energy efficiency plan for the City of Novi Sad.\n  Why it matters: A possible opportunity for energy planning and audit work in Serbia.\n  Source: https://ba.ekapija.com/browse/investment/24324/plan-energetske-efikasnosti-grada-novi-sad\n- University of Belgrade Faculty of Mechanical Engineering: energy renovation of a building (eKapija)\n  eKapija lists an investment for the energy renovation and adaptation of an existing building of the Faculty of Mechanical Engineering in Belgrade.\n  Why it matters: A possible MEP and energy renovation opportunity in Belgrade.\n  Source: https://www.ekapija.com/browse/investment/24453/masinski-fakultet-beograd-energetska-sanacija-i-adaptacija-postojece-zgrade\n- Switzerland: transition solution for building funding in 2027 (Swiss Federal Council)\n  The Federal Council opened the consultation on 28 October on revising the Energy Ordinance to set out the new building funding model, as part of the 2027 federal budget relief package.\n  Why it matters: Swiss owners keep today's funding rules through 2027; the bigger change comes with the new programme planned for 2028.\n  Source: https://www.admin.ch/de/newnsb/AH-xcGzxaLqA\n  Thread, Italian building incentives for 2027: The budget bill keeps 50% and 36%, drops the 65% ecobonus, would set an overall ecobonus cap of 96,000 euro per unit, puts 1.6 billion euro into a 100% Conto Termico for public buildings over 2028 to 2030 and spreads the last 2023 Superbonus credits over ten years.\n  Thread, Serbia and the region: aligning building energy rules with the EU: Serbia needs a renovation action plan to progress in Chapter 15 and amended its planning law in August.\n\nOTHER EUROPEAN COUNTRIES\n\n- Spain multiplies energy savings credits for replacing boilers with heat pumps (Demócrata)\n  Spain's ecological transition ministry published a scheme in the official gazette that multiplies the energy savings certificates (CAE) recognised for replacing fossil boilers with electric heat pumps, by 2 to 4 depending on building and heating system type.\n  Why it matters: Another European example of incentives shifting heating to heat pumps.\n  Source: https://www.democrata.es/it/economia/il-governo-spinge-affinche-le-comunita-sostituiscano-le-caldaie-con-pompe-di-calore-elettriche/amp\n- France's tertiary decree: what to prepare for in 2027 (L'Energeek)\n  L'Energeek explains the 2027 obligations under France's Décret tertiaire for buildings with 1,000 m² or more of tertiary space: annual consumption declarations on OPERAT and tracking against targets of -40% by 2030, -50% by 2040 and -60% by 2050.\n  Why it matters: Useful reference for clients with French office or retail assets and a model for performance-based rules elsewhere.\n  Source: https://lenergeek.com/2026/11/06/decret-tertiaire-2027-comment-anticiper-les-prochaines-echeances-reglementaires\n- Scotland's Passivhaus-equivalent standard criticised by housing bodies (Housing Today)\n  Scottish housing bodies say a proposed Passivhaus-equivalent energy standard would add cost for a small carbon gain.\n  Why it matters: Another European energy code moving toward very low energy new buildings.\n  Source: https://www.housingtoday.co.uk/news/scottish-governments-proposals-for-passivhaus-equivalent-energy-standard-criticised-by-housing-bodies/5144817.article\n  Thread, Heating rules across Europe: Spain joins the countries pushing heat pumps through incentives, while Germany has dropped its 65% renewable rule.\n\nCERTIFICATIONS\n\n- INREV builds the CRREM misalignment year into real estate valuation (EVORA Global)\n  According to EVORA's January to May 2026 brief, INREV has formally incorporated the CRREM Misalignment Year into real estate underwriting, linking transition risk directly to DCF assumptions and exit values.\n  Why it matters: When a building's CRREM stranding year changes its valuation, measured energy performance and retrofit plans become a finance topic, which is where Energo's engineering and GRESB work meet.\n  Source: https://evoraglobal.com/app/uploads/2026/06/EVORA-Sustainability-Brief-Jan-May-2026-1.pdf\n\nENGINEERING AND DATA CENTRES\n\n- German data centres are not publishing energy and water data required by law (www.mojkraj.hr)\n  Germany's Energy Efficiency Act requires larger data centres to publish electricity and water use, but more than half of the 30 largest operators appear not to comply, according to queries by broadcaster ARD.\n  Why it matters: Shows that EU-driven data centre reporting duties are being enforced and questioned; operators Energo works with will need reliable metering and reporting.\n  Source: https://www.mojkraj.hr/en/business/german-data-centres-hide-energy-and-water-consumption-data\n- Portugal drafts rules requiring data centres to run on renewable energy (Portugal Resident)\n  Portugal Resident reports that the government is preparing rules requiring data centres to use renewable energy.\n  Why it matters: Another national rule shaping data centre energy design in Europe.\n  Source: https://www.portugalresident.com/de/Die-Regierung-erarbeitet-neue-Regeln--die-vorschreiben--dass-Rechenzentren-mit-erneuerbarer-Energie-betrieben-werden-m%C3%BCssen.\n- Data centre opposition reaches Switzerland (Blick)\n  Greenpeace protested at a data centre site in Beringen (SH) and is calling for national planning rules or a moratorium.\n  Why it matters: Rules on energy and transparency for Swiss data centres would affect design and reporting on projects Energo could support.\n  Source: https://www.blick.ch/schweiz/beringen-greenpeace-aktion-gegen-rechenzentren/nb5g8t2\n- Green plans a new data centre campus in Birr, Aargau (Computerworld.ch)\n  Data centre operator Green bought the Grossacher and Grändel site in Birr from ABB to build a data centre campus step by step.\n  Why it matters: A Swiss data centre project where cooling and waste heat design matter.\n  Source: https://www.computerworld.ch/themen/cloud-und-infrastruktur/green-plant-neuen-datacenter-campus-in-birr\n- Kragujevac state data centre prepares space for a third supercomputer (Naslovi.net)\n  The state data centre in Kragujevac runs two supercomputers and is preparing a space with water cooling for a third, more powerful one arriving from France by the end of the year, according to RTS.\n  Why it matters: Liquid cooling for HPC in Serbia is directly in Energo's data centre MEP field.\n  Source: https://naslovi.net/2026-10-28/pressek/data-centar-u-kragujevcu-sprema-prostor-za-novi-superkompjuter/42537796\n- ASHRAE 62.1 IAQ procedure can cut HVAC energy by 20% (Facilities Dive)\n  Facilities Dive reports that the indoor air quality procedure in ASHRAE 62.1, rarely used because the calculations are slow, can cut HVAC energy use by 20% according to ex
