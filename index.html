 owners should study early when planning heat reuse.\n  Carousel outline:\n   - Slide 1: hook, 'This data centre will heat a Swiss town.'\n   - Slide 2: 2.5 MW IT, 170 racks, Bulle, canton of Fribourg.\n   - Slide 3: heat pumps feed server heat into district heating: about 28 GWh a year.\n   - Slide 4: up to 7,500 t CO2 a year avoided compared with heating oil.\n   - Slide 5: closed liquid cooling: no cooling towers, no water withdrawal.\n   - Slide 6: operation planned for 2028.\n   - Slide 7: call to action: planning a data centre? Talk to us about heat reuse from day one.\n\n* Pančevo: former Azotara plant sold to a Dubai-linked firm, plan allows a data centre campus of up to 650 MW\n  Angle: A 650 MW data centre plan in Pančevo: the questions on water, power and heat that any Serbian data centre must answer.\n  Channel: LinkedIn\n  Article outline:\n   - Report the ownership change: Azotara Pančevo sold to Mileva Data Technologies, owned by Mileva FZCO from Dubai.\n   - Explain the planning frame: a first phase up to 69 MW on the existing substation and a second phase up to 650 MW needing a new one.\n   - Cover the local concerns raised about water, electricity, heating and environmental impact.\n   - Note what is not yet known: construction start, financing and grid infrastructure are not confirmed.\n   - Close with Energo's view, written as a section: the energy and cooling questions a project of this size must answer early.\n  Carousel outline:\n   - Slide 1: hook, 'A 650 MW data centre could rise on the Azotara site.'\n   - Slide 2: the plant now belongs to a Dubai-linked company.\n   - Slide 3: phase one: up to 69 MW on the existing substation.\n   - Slide 4: phase two: up to 650 MW with a new substation.\n   - Slide 5: open questions: water, power, heat and environment.\n   - Slide 6: call to action: building a data centre in Serbia? Start with the energy concept.\n\n* ASHRAE separates energy efficiency from operational carbon in Standard 90.1\n  Angle: ASHRAE 90.1 splits efficiency from carbon: what it could mean for energy modelling.\n  Channel: LinkedIn\n  Article outline:\n   - The change: ASHRAE is separating energy efficiency requirements from operational carbon goals.\n   - Standard 90.1 keeps the efficiency role; a separate aligned publication will address operational emissions.\n   - The practical levers named: controls integration, occupancy-based operation and grid-responsive energy use.\n   - Benchmarking, sub-metering and data-driven maintenance as tools to find waste.\n   - What project teams should ask: how the split may affect their energy modelling; Energo's modelling view can be added as a section.\n\nUS, AFRICA AND GLOBAL\n\n- Harvard study: 403 large US data centres emitted more than Denmark in a year; COP31 adopts a data centre pledge (Danas)\n  A Harvard study in Nature Sustainability estimates that the 403 largest US data centres produced about 25.7 million tonnes of CO2 between May 2024 and April 2025, more than Denmark's annual emissions.\n  Why it matters: Pressure for transparent energy and water reporting on data centres keeps growing, which supports demand for metering, efficiency studies and heat reuse in Energo's data centre work.\n  Source: https://www.danas.rs/vesti/klimatske-promene/najveci-ai-data-centri-proizvedu-za-godinu-dana-vise-gasova-staklene-baste-nego-cela-danska\n"}, {"id": "2026-11-26", "date": "2026-11-26", "kind": "mid-week", "title": "Energo Intelligence: mid-week update, 26 November 2026", "item_ids": ["dd7e3e971b2e0e9ca2a96f338447d0e09fc2baa1", "113b776fc5976c0e16c2de39d4966c221422339f", "dacd3d2b0d40cfcba26068dd6b6a8688220b78af", "e222779fd6e130c767e68d984179cde49a939dc8", "122283ec8f033d97a48e4d438992ccc289eaee4a", "86ea874225771d36c7360cea98392f0b382c950e", "92155a1a17ea5caf3eeb6a511e1e12d6ff70b124", "bb5f036d19d39ba0163c9b66001f8bf097eee8a8", "17f905bbddfa89c69f1ce71eb18fef8b77d33c0b", "45c186316114eba588e8b6b46116d51ddef27c28", "171b5f809be6278daf2bd1fc65c040a0ee4864eb", "b05465ed01a7f85869da045c98564ec52ae0afa4", "8d7ae04b7698e1792783479a23cf477f306acf8a", "b91d7d115ac9fb2df2ccd8f97d845c4b1c7b50cb", "46b5d1fc14930af59a4698e282335b48a3e22649", "9674870de0fdebdc34987d98f016515ddaeb663d", "7eae4eb360c76ab9f635948eac77e156356127db", "05061ace3055836f4d857c94ef8ba822cd19e9f9", "5858175653ed39ef25cc1ed9c7d7a2c197950b46", "2855e7c873e5d1dffcc75ef54ea79caf8d786452", "fae813373d30755411ceb1c39a7af424e171d5e1", "8189a14884c7d6527fbe18c9f19d055c37303464", "34d0141618a33f6ffe972ab1c1db8620e771dd5a", "edd2ff8fdaaab52a90a313e05ea2a9342debe0c2", "aa815b875070ace0ca8deb4d67bb78162907fc05", "0cad0e2bc4f6e54c3dd703acf0bcc33d4e222b5d", "7a6f0d9bc7935a4802588fd6b95b13ee83e514bf"], "text": "Energo Intelligence: mid-week update, 26 November 2026\n\n151 new items read on Thursday, 53 kept, 27 with relevance 2 or 3, 4 to act on. Titles open the item on the Energo Intelligence page.\nNote: the last five digests (9 to 23 November) were saved on the page but not emailed, because the Gmail connection lacked send permission.\n\nTOP 5 THIS WEEK\n- Ecobonus 2027: heat pumps risk losing eligibility under the new income tax code (Edilportale)\n  Stand-alone replacement of heating with high-efficiency heat pumps and low-enthalpy geothermal systems may drop out of the Ecobonus from 2027.\n  Why it matters: Clients planning heat pump retrofits in Italy for 2027 face uncertainty on the tax deduction; HVAC design and incentive advice should flag this until Parliament decides.\n  Source: https://www.edilportale.com/news/2026/11/normativa/ecobonus-2027-rischio-esclusione-per-le-pompe-di-calore_112899_15.html\n- Case Green: Italian government gives no date for transposing the directive (Edilportale)\n  Answering a question in the Chamber on 18 November, Undersecretary Claudio Barbaro said the government cannot yet give a date for transposing the EPBD, because the legislative decree depends on the 2026 EU Delegation Law still before Parliament.\n  Why it matters: Italian clients still have no national rules for zero emission buildings, minimum requirements or updated APEs; plans should be built on the directive text and kept flexible.\n  Source: https://www.edilportale.com/news/2026/11/normativa/case-green-recepimento-senza-data-la-risposta-del-governo_112876_15.html\n- EFRAG invites companies outside CSRD scope to join work on the voluntary standard, by 15 December (EFRAG news)\n  EFRAG asks EU companies that are not SMEs but have fewer than 1,000 employees or turnover under 450 million euro, plus auditors, lenders and other users, to email VRcontactlist@efrag.org by 15 December 2026 to join engagement on the Voluntary Standard.\n  Why it matters: Many Energo clients fell out of CSRD scope but still get data requests from banks and partners; this is a chance to shape the support for voluntary reporting.\n  Source: https://www.efrag.org/en/news-and-calendar/news/reminder-efrag-invites-nonsme-companies-outside-the-scope-of-the-csrd-to-express-their-interest-in\n- CasaClima: send complete documents by 30 November to get a certificate within 2026 (Agenzia CasaClima)\n  Agenzia CasaClima asks anyone who needs a CasaClima certificate by 23 December 2026 for a project already submitted to send all required documents, complete, by 30 November 2026.\n  Why it matters: Any Energo project in South Tyrol or elsewhere that needs a CasaClima certificate this year must have its file complete by 30 November.\n  Source: https://www.agenziacasaclima.it/it/certificato-energetico-2026-inviare-la-documentazione-entro-il-30-novembre--9-3199.html\n- AMF: simplified ESRS in force since 10 November 2026 (Autorité des marchés financiers (AMF))\n  The French market authority AMF notes that the revised, simplified ESRS entered into force on 10 November 2026.\n  Why it matters: Clients still in CSRD scope can choose the lighter ESRS for their 2026 reports; Energo's ESG reporting service should plan the switch with them.\n  Source: https://www.amf-france.org/en/news-publications/news/corporate-sustainability-reporting-entry-force-simplified-esrs\n\nDEADLINES AND OPEN CONSULTATIONS (NEXT 6 MONTHS)\n- 2026-11-28: UNI 11337-7 revision on BIM roles in final public inquiry until 28 November (UNI 11337-7 public inquiry closes)\n- 2026-11-30: EU prepares to recognise guarantees of origin from Energy Community countries (Energy Community Ministerial Council)\n- 2026-11-30: CasaClima: send complete documents by 30 November to get a certificate within 2026 (CasaClima documents for 2026 certificate)\n- 2026-12-01: Germany's Building Modernisation Law: what applies to heating replacements (Germany: green gas and heating oil quota bill due)\n- 2026-12-01: EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition (Italy's two months to answer the reasoned opinions end)\n- 2026-12-01: Polish MEPs propose delaying ETS2 to 2031 or scrapping it (ENVI committee vote on the ETS reform)\n- 2026-12-02: France: housing minister refuses to scrap the DPE after Assembly vote on rental ban (Joint committee on housing bill)\n- 2026-12-15: EFRAG invites companies outside CSRD scope to join work on the voluntary standard, by 15 December (EFRAG expressions of interest close)\n- 2026-12-16: GSE opens voluntary early exit from the Conto Energia for PV plants over 20 kW (Conto Energia early exit: expressions of interest close)\n- 2026-12-23: Tender: high energy performance buildings at the Caserma Caretto in Naples, 22.6 million euro (Tender deadline)\n- 2026-12-31: Italy has weeks left to send the EU its building renovation plan (Italy final national building renovation plan due)\n- 2027-01-01: Serbia: household solar plants cut power bills by 44 to 76%; net metering ends for new prosumers on 1 January (Net billing for new prosumers)\n- 2027-01-01: Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027 (Remote reading of heat meters required)\n- 2027-01-01: Whole-life carbon: national GWP roadmaps due by 1 January 2027 (National whole-life carbon roadmaps due)\n- 2027-01-01: VSME becomes law: Delegated Regulation (EU) 2026/1560 caps value chain data requests (VSME value chain cap applies (financial years from))\n- 2027-01-01: Germany: first parts of the building modernisation law apply from 1 January 2027 (Germany: first GModG requirements apply)\n- 2027-01-01: Ecobonus 2027: heat pumps risk losing eligibility under the new income tax code (New income tax code applies)\n- 2027-01-18: Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027 (Consultation on the CSRD assurance standard closes)\n- 2027-01-19: EFRAG consults on its draft comment letter on the ISSB nature-related disclosures statement (EFRAG consultation closes)\n- 2027-02-11: Switzerland proposes one renovation funding programme paid from the CO2 levy (Swiss renovation funding: consultation closes)\n- 2027-02-15: EFRAG SME Forum on 2 December and consultation on its 2027 to 2029 reporting agenda (EFRAG 2027 to 2029 agenda consultation closes)\n- 2027-02-15: EFRAG consults on its 2027 to 2029 sustainability reporting agenda (EFRAG agenda consultation closes)\n- 2027-03-19: Omnibus I: less than five months left to transpose the CSRD amendments (Omnibus I CSRD amendments: transposition deadline)\n- 2027-03-24: UK Future Homes Standard: heat pumps and on-site renewables from 2027 (UK Future Homes Standard applies)\n- 2027-04-26: Graubünden opens first tender for industrial high-temperature heat pumps, up to 800,000 francs per project (Graubünden heat pump tender deadline)\n\nEU REGULATION AND ESG REPORTING\n- EFRAG webinar on 7 December launches its 2027 to 2029 agenda consultation (EFRAG news)\n  EFRAG holds an online launch webinar for its 2027 to 2029 sustainability reporting agenda consultation on 7 December 2026, 10:00 to 12:00 CET.\n  Why it matters: A quick way for Marija to see where EFRAG support for ESRS and voluntary reporting is heading before the consultation closes.\n  Source: https://www.efrag.org/en/news-and-calendar/news/save-the-date-webinar-join-efrag-to-discuss-its-sustainability-reporting-priorities-for-20272029-7\n- Visegrad leaders ask the Commission to delay ETS2 to 2030 (Euronews.com)\n  In a letter to Commission President von der Leyen on 23 November, the leaders of Poland, Hungary, Slovakia and the Czech Republic say ETS2 could cost households and businesses tens of billions of euros from 2028 and ask to rethink it, with a delay to 2030.\n  Why it matters: The start date of the carbon price on heating fuels drives the business case for heat pumps and fabric upgrades in client portfolios.\n  Source: https://www.euronews.com/2026/11/24/visegrad-leaders-demand-delay-to-ets2-piling-pressure-on-eus-carbon-market\n- Eight EU countries ask the Commission to keep the ETS2 design and timetable (RUSSPAIN.com)\n  Spain, Germany, Denmark, Finland, Luxembourg, the Netherlands, Portugal and Sweden wrote to Climate Commissioner Wopke Hoekstra asking to keep ETS2 as designed, fully operational in 2028.\n  Why it matters: Shows the 2028 start is contested but has strong backing; clients should not assume a further delay when planning heating upgrades.\n  Source: https://russpain.com/news/eight-eu-states-defend-the-ets2-timetable-123739\n- SFDR 2.0: EU fund assets in sustainability categories could halve (Responsible Investor)\n  Headline only: Responsible Investor reports that EU fund assets in the sustainability categories could halve under SFDR 2.0.\n  Why it matters: If fewer funds qualify, real estate funds will need stronger, verified building data to stay in the sustainable or transition categories.\n  Source: https://www.responsible-investor.com/eu-fund-assets-in-sustainability-categories-could-halve-under-sfdr-2-0\nWhere it stands (CSRD after Omnibus I): The simplified ESRS are in force since 10 November (mandatory from FY2027, optional for 2026), and EFRAG wants companies outside CSRD scope to sign up by 15 December for work on the Voluntary Standard.\nWhere it stands (ETS2): The 2028 start is contested: the Visegrad four want 2030, eight other countries want the timetable kept, ahead of the 26 and 27 November European Council and the 1 December committee vote.\n\nITALY, SERBIA, SWITZERLAND\n- Case Green: Pichetto Fratin says Italy will decide the timing and methods for upgrading buildings (Build News)\n  Headline only: Environment and Energy Minister Gilberto Pichetto Fratin says Italy will decide the timing and the methods for adapting its buildings under the Case Green directive.\n  Why it matters: Signals a national approach to EPBD obligations that may differ in pace from other countries; worth tracking for client renovation plans.\n  Source: https://news.google.com/rss/articles/CBMivwFBVV95cUxPazBPVWJvb1VVcU5iUjBOTERiZVBZY0VFX0QxSU9jWHZqVGxud2d5MWV2WGJUeUJ5MzV3SzdKeGlSX09FaVNITXE4SVJ4X3JiUnZoN1cxc1Y2SmpJeHhtNzVYVzNNVU1JbFRDWWtvY2wwSXFvc0pQa1daajJjTFhfSVZmcGdMOTZES2JKMS1EMDdJbWR3YUg3c2xDdmVlLTlyWFhwZi1uX2dpQ3pDdzRHY0NvaktsV2VNUzF1UGZVTQ?oc=5\n- Case Green at local level: one-stop shops lack clear owners and funding (GreenPlanner Magazine)\n  At a meeting at the Joint Research Centre in Ispra with the municipality of Travedona, speakers said the EPBD falls largely on local authorities.\n  Why it matters: One-stop shops will be a channel to reach homeowners and municipalities; Energo can position its energy audit and design services toward them.\n  Source: https://www.greenplanner.it/2026/11/23/efficientamento-energetico-edifici-jrc\n- Sicily plans a 25 million euro revolving fund so schools can use the Conto Termico 3.0 (| Regione Siciliana)\n  Sicily's draft stability law, approved by the regional government on 10 November and now in the regional assembly committees, creates a 25 million euro revolving fund for energy upgrades of public schools.\n  Why it matters: Opens a pipeline of school retrofit projects in Sicily that need energy audits, HVAC design and Conto Termico paperwork.\n  Source: https://www.regione.sicilia.it/la-regione-informa/scuola-turano-fondo-25-milioni-l-efficientamento-energetico-istituti\n- MASE issues new 2026 instructions for company energy audits (Ingenio)\n  Headline only: Ingenio reports new MASE instructions for 2026 on mandatory energy audits for companies.\n  Why it matters: Mandatory company energy audits are a regular service line; check the new instructions before the next audit cycle.\n  Source: https://news.google.com/rss/articles/CBMinAFBVV95cUxQZ0I0VHE2VU1KX2FEb2N5V0N0VDU0Y082Q1kxTDVPUkZ5SFNMT3NMS1lhYjQ4c2U2SDJEU0ViTS1helJDbmQ5YzBYYXhCb2RSWnhBUjJ2VnZKVFBuQXBrclZ4em5WTXBxRU01c3c1WWtYMm16Sl9qM3JVbHVIWmhHRThSMU9nZ1lTUTF4WXdvT2RQbWFLS1Z2bUV6MUw?oc=5\n- CAM 2025: how to write the CAM report for small extraordinary maintenance works (Ingenio)\n  Ingenio explains how to justify in the CAM report which criteria of D.M. 24 November 2025 do not apply to small public extraordinary maintenance works.\n  Why it matters: Useful template for Energo's public sector design work, where CAM documentation is mandatory under the procurement code.\n  Source: https://www.ingenio-web.it/articoli/cam-edilizia-2025-relazione-cam-manutenzione-straordinaria\n- Italy: three new funding calls worth over 653 million euro for company energy investments (QualEnergia)\n  Three calls open this week, one national and two regional in Lombardy and Lazio, with a total of more than 653 million euro to support company investments in the energy transition.\n  Why it matters: Industrial and commercial clients in Lombardy and Lazio may fund efficiency projects that Energo designs.\n  Source: https://www.qualenergia.it/pro/articoli-pro/innovazione-energetica-aprono-bandi-imprese-nazionale-lombardia-lazio\n- Tender: high energy performance buildings at the Caserma Caretto in Naples, 22.6 million euro (QualEnergia)\n  The Carabinieri General Command has tendered design and construction of high energy performance buildings at the Caserma Caretto in Naples, worth 22,602,616 euro, with a deadline of 23 December 2026.\n  Why it matters: A design and build tender where MEP design and energy modelling partners will be needed.\n  Source: https://www.qualenergia.it/pro/documenti/realizzazione-di-edifici-ad-alta-prestazione-energetica-presso-la-caserma-caretto-di-napoli\n- LCA position paper compares steel and reinforced concrete structures (Ingenio)\n  Fondazione Promozione Acciaio, with ATI Project and the University of Brescia, published a position paper comparing steel and reinforced concrete load-bearing structures through LCA, using the North Tower in Pisa as a case study.\n  Why it matters: Structural choices drive embodied carbon; Energo's LCA work will face these comparisons as GWP disclosure starts in 2028.\n  Source: https://www.ingenio-web.it/articoli/analisi-lca-edifici-strutture-acciaio-calcestruzzo-armato-decarbonizzazione\n- Niš gets a 5 million euro grant to convert four heavy oil boiler houses (eKapija)\n  Niš district heating company Gradska toplana received a 5 million euro grant, signed with the Ministry of Environmental Protection and the city, to convert four boiler houses that burn heavy fuel oil or heating oil to gas or renewable sources.\n  Why it matters: Serbian district heating upgrades create work for MEP design and energy studies in Energo's home market.\n  Source: https://www.ekapija.com/news/5741662/cetiri-kotlarnice-u-nisu-prelaze-na-gas-ili-na-obnovljive-izvore-energije\n- Serbia: household solar plants cut power bills by 44 to 76%; net metering ends for new prosumers on 1 January (Energetski portal)\n  An analysis by the Centre for Environmental Improvement of four prosumer households with 5.4 to 11.04 kWp systems found yearly savings of 44.3% to 76.4% and payback of three years five months to eight years ten months.\n  Why it matters: A deadline and payback data Energo can use in solar PV advice for Serbian clients.\n  Source: https://energetskiportal.rs/solarne-elektrane-u-srbiji-ustede-do-76-odsto-investicija-se-vraca-za-nekoliko-godina\n- Beringen (Schaffhausen): petition against two large data centres (Blick)\n  Two data centres are planned in Beringen: one by Stack Infrastructure under construction since 2023 and due to open soon, and one by the Turkish group Enka that could run from 2028.\n  Why it matters: Swiss local resistance makes heat reuse and efficient cooling a condition for approval, an area where Energo's MEP and CFD work fits.\n  Source: https://www.blick.ch/schweiz/schaffhausen/beringen-sh-urs-koegl-68-kaempft-gegen-rechenzentren/tqmzyk0\n- Swiss CombiSound study: suspended ceilings with water pipes cut noise and heat and cool old flats (admin.ch)\n  The CombiSound study by OST, Empa and FHNW shows that suspended ceilings with integrated water pipes can greatly improve sound insulation between flats while heating and cooling them.\n  Why it matters: Gives Energo a retrofit argument that joins acoustics, radiant heating and cooling and embodied carbon in Swiss residential projects.\n  Source: https://www.admin.ch/fr/newnsb/QHaUq9fxNXRU\n- SNBS Infrastructure on the Clusette tunnel: 50% less operating energy and 1.5 million francs saved (NNBS (SNBS))\n  The client's representative for the renovation of the Tunnel de la Clusette in Neuchâtel says the SNBS Infrastructure standard improved the project, not just rated it.\n  Why it matters: A concrete Swiss case that sustainability certification pays for itself, useful when selling SNBS or other certification support.\n  Source: https://nnbs.ch/der-snbs-infrastruktur-macht-projekte-besser\nWhere it stands (Case Green in Italy): No transposition date yet; the decree waits for the 2026 EU Delegation Law, and MASE is drafting the renovation plan in parallel.\nWhere it stands (Italian incentives 2027): Heat pumps may drop out of the Ecobonus under the new tax code unless budget amendments restore them; regions such as Sicily are building on the Conto Termico 3.0.\nWhere it stands (Data centres): Local pushback is reaching Switzerland and Wales, while heat reuse projects show the route to acceptance.\n\nOTHER EUROPEAN COUNTRIES\n- France: housing minister refuses to scrap the DPE after Assembly vote on rental ban (Dosya Haber)\n  Housing Minister Vincent Jeanbrun ruled out removing the energy performance diagnosis (DPE) after the National Assembly voted to lift the ban on renting very energy-hungry homes.\n  Why it matters: French rental rules tied to energy class are a test case for how hard EPBD-style minimum standards will bite elsewhere.\n  Source: https://dosyahaber.com/post/passoires-thermiques-jeanbrun-defend-le-dpe-et-des-travaux-17537384581894\n- Scotland plans to accept Passivhaus certification as a deemed-to-satisfy route for building standards (Project Scotland)\n  The Scottish Government's Stage 2 consultation on energy and environmental standards proposes that Passivhaus certification becomes a deemed-to-satisfy route to comply with Scottish Building Standards, by amending standard 6.1 on energy demand.\n  Why it matters: An example of certification being written into building codes as a compliance route, a pattern Energo can point to in other markets.\n  Source: https://projectscot.com/2026/11/passivhaus-trust-says-proposed-scottish-changes-represent-positive-direction-of-travel\n- Wales: Future Generations Commissioner calls for a pause on new AI data centres (edie)\n  The Future Generations Commissioner for Wales wants approvals for new AI data centres paused until national guidance addresses their impact on water, energy, the environment and local communities.\n  Why it matters: Another sign that data centre approvals will depend on proven water and energy performance, which raises demand for design and modelling work.\n  Source: https://www.edie.net/welsh-commissioner-calls-for-halt-on-new-ai-data-centres-over-environmental-concerns\n\nCERTIFICATIONS\n- GRESB Foundation webinars on the 2028 Standards on 1 and 2 December (GRESB)\n  After publishing the 2028 GRESB Real Estate and Infrastructure Standards this month, the GRESB Foundation holds webinars on 1 and 2 December to explain the key changes, and GRESB will outline transition support for the next 18 to 24 months.\n  Why it matters: Energo is a GRESB partner; clients will need help moving from policy checklists to measured energy and emissions performance.\n  Source: https://www.gresb.com/insights/gresb-november-update-2028-gresb-standards-foundation-webinars\n- USGBC members ratify LEED v5 for Cities (USGBC)\n  Headline only: USGBC announces that its members have ratified LEED v5 for Cities.\n  Why it matters: Completes the LEED v5 family; relevant for municipal clients and for Marija's LEED training content.\n  Source: https://www.usgbc.org/articles/leed-v5-cities-ratified-usgbc-members\n\nCONTENT IDEAS\n- Ecobonus 2027: heat pumps risk losing eligibility under the new income tax code\n  Angle: Heat pumps may fall out of Italy's Ecobonus in 2027 because of a gap in the new tax code: what owners should check now.\n  Channel: LinkedIn\n  Article outline:\n    * The issue: the new income tax code (D.Lgs. 117/2026) applies from 1 January 2027 and does not restate the Law 244/2007 extension of the Ecobonus to heat pumps.\n    * Which systems are affected: high-efficiency heat pumps and low-enthalpy geothermal systems as stand-alone works; hybrid units and heat pump water heaters are still named explicitly.\n    * What the budget bill does and does not do: rates of 50% and 36% proposed, no explicit fix for heat pumps.\n    * Proposed amendments: put heat pumps back in, with a 65% deduction for 2027 under conditions; all still subject to Parliament.\n    * What clients should do: check timing of planned heat pump works, compare with the Conto Termico 3.0, and ask Energo for a project-specific incentive check.\n  Carousel outline:\n    * Slide 1: hook: Will heat pumps lose Italy's Ecobonus in 2027?\n    * Slide 2: the new tax code applies from 1 January 2027\n    * Slide 3: it does not restate the heat pump extension from Law 244/2007\n    * Slide 4: affected: stand-alone heat pumps and low-enthalpy geothermal\n    * Slide 5: amendments propose a 65% deduction for 2027\n    * Slide 6: nothing is final until Parliament votes the budget\n    * Slide 7: planning a heat pump retrofit? Talk to us about incentive timing\n- Case Green: Italian government gives no date for transposing the directive\n  Angle: Six months after the deadline Italy still has no date for Case Green: what owners and designers can prepare now.\n  Channel: newsletter\n  Article outline:\n    * Where things stand: on 18 November the government said it cannot give a transposition date.\n    * Why: the legislative decree depends on the 2026 EU Delegation Law, still in Parliament; the deadline passed on 29 May 2026.\n    * What MASE is doing meanwhile: drafting the national renovation plan and a support system combining deductions, Conto Termico and credit tools.\n    * What the transposition will cover: residential energy use cuts, minimum requirements for non-residential buildings, zero emission buildings, updated APEs.\n    * What owners and designers can do now: section for Energo's view on preparing projects against the directive text.\n- EFRAG invites companies outside CSRD scope to join work on the voluntary standard, by 15 December\n  Angle: Out of CSRD scope after Omnibus I? EFRAG wants to hear from you by 15 December.\n  Channel: LinkedIn\n  Article outline:\n    * Who is affected: companies that are not SMEs but have fewer than 1,000 employees or turnover under 450 million euro.\n    * Why they still report: banks, investors and partners keep asking for data; the Voluntary Standard was adopted as a Delegated Act in September 2026.\n    * What EFRAG asks: expressions of interest by 15 December 2026 to join webinars, surveys and interviews.\n    * The 14 December webinar on implementation support needs.\n    * What to do: sign up, and talk to Energo about a voluntary report that answers lender requests.\n  Carousel outline:\n    * Slide 1: hook: out of CSRD scope but still asked for ESG data?\n    * Slide 2: the Voluntary Standard is now a Delegated Act\n    * Slide 3: EFRAG wants input from mid-sized companies\n    * Slide 4: threshold: under 1,000 staff or 450 million euro turnover\n    * Slide 5: deadline to sign up: 15 December 2026\n    * Slide 6: webinar on support needs: 14 December\n    * Slide 7: need a voluntary report? Contact Energo\n- AMF: simplified ESRS in force since 10 November 2026\n  Angle: The simplified ESRS are in force: almost 60% fewer mandatory datapoints, and you can use them already for 2026.\n  Channel: LinkedIn\n  Article outline:\n    * What happened: the revised ESRS entered into force on 10 November 2026.\n    * When they apply: mandatory from financial year 2027, voluntary for financial year 2026.\n    * What changed: almost 60% fewer mandatory datapoints, shorter standards, new structure.\n    * How this fits the Omnibus steps: quick-fix in 2025, Omnibus I in February 2026, full simplified set in September 2026.\n    * What companies should decide now: whether to apply the new set early; section for Energo's advice.\n  Carousel outline:\n    * Slide 1: hook: the simplified ESRS are now in force\n    * Slide 2: in force since 10 November 2026\n    * Slide 3: mandatory from FY2027, optional for FY2026\n    * Slide 4: almost 60% fewer mandatory datapoints\n    * Slide 5: shorter standards, new structure\n    * Slide 6: decide now whether to switch early\n    * Slide 7: need help with your next report? Talk to Energo\n- Swiss CombiSound study: suspended ceilings with water pipes cut noise and heat and cool old flats\n  Angle: Noise is a reason to demolish old flats; a Swiss study shows one ceiling can fix noise, heating and cooling.\n  Channel: website\n  Article outline:\n    * The problem: many Swiss apartment blocks from 1900 to 1980 are noisy and inefficient, and noise is used to justify demolition.\n    * The CombiSound study by OST, Empa and FHNW: suspended ceilings with integrated water pipes.\n    * Results reported: much better sound insulation, plus heating and cooling of the flats.\n    * Why it matters: avoiding demolition saves embodied emissions and prepares buildings for hotter summers.\n    * What owners should consider: a section for Energo's view on radiant ceiling retrofits and when to ask for a feasibility check.\n- SNBS Infrastructure on the Clusette tunnel: 50% less operating energy and 1.5 million francs saved\n  Angle: 80,000 francs of sustainability advice, 1.5 million saved: what SNBS did for a Swiss tunnel.\n  Channel: LinkedIn\n  Article outline:\n    * The project: renovation of the Tunnel de la Clusette in Neuchâtel using SNBS Infrastructure.\n    * The client's view: SNBS as a tool to improve the project, not only to rate it.\n    * The results: 50% lower operating energy, large CO2 cut, safety gallery opened to slow traffic.\n    * The money: about 1.5 million francs saved against 80,000 francs in fees.\n    * What owners should take away: section for Energo's view on using certification early in design.\n  Carousel outline:\n    * Slide 1: hook: 80,000 francs in, 1.5 million saved\n    * Slide 2: the Clusette tunnel renovation in Neuchâtel\n    * Slide 3: SNBS Infrastructure used to improve the design\n    * Slide 4: 50% less operating energy\n    * Slide 5: a safety gallery opened to slow traffic\n    * Slide 6: certification as a design tool, not a label\n    * Slide 7: planning a project in Switzerland? Talk to Energo\n- Serbia: household solar plants cut power bills by 44 to 76%; net metering ends for new prosumers on 1 January\n  Angle: Serbian rooftop solar pays back in 3 to 9 years, and net metering ends for newcomers on 1 January.\n  Channel: LinkedIn\n  Article outline:\n    * The data: four prosumer households,     var rel = (t ? inThread(t.id) : []).filter(function (y) { return y !== x; }).slice(0, 5);

    var cur = st(x), i = S.ctx.indexOf(s), n = S.ctx.length;

      '<div class="peek-body"><div><div class="pills" style="margin-bottom:10px">' + relPill(x.relevance) + (x.type ? '<span class="pill">' + esc(TYPE[x.type]) + "</span>" : "") + flagsOf(x).map(function (f) { return '<span class="pill flag">' + FLAGS[f] + "</span>"; }).join("") + (cur !== "new" ? '<span class="pill">' + STATUS[cur] + "</span>" : "") + '</div><h2 class="t">' + esc(x.title_en) + '</h2><p class="t-src" style="margin:8px 0 0">' + esc(x.source_name) + " · " + fd(x.published_at, true) + " · " + esc(String(x.language || "").toUpperCase()) + "</p></div>" +
      (x.why_it_matters ? '<div class="callout"><h3>For Energo</h3><p>' + esc(x.why_it_matters) + "</p></div>" : "") +

      '<dl class="props">' + (x.deadline ? '<dt>Date</dt><dd class="num" style="color:var(--watch);font-weight:600">' + fd(x.deadline, true) + (x.deadline_label ? ", " + esc(x.deadline_label) : "") + "</dd>" : "") +
      (arr(x.regions).length ? "<dt>Region</dt><dd>" + esc(regionText(x)) + "</dd>" : "") + (arr(x.services).length ? "<dt>Services</dt><dd>" + arr(x.services).map(function (v) { return '<a data-filter="service:' + v + '">' + esc(SVC[v] || v) + "</a>"; }).join(", ") + "</dd>" : "") +
      (arr(x.certifications).length ? "<dt>Frameworks</dt><dd>" + arr(x.certifications).map(function (c) { return '<a data-filter="cert:' + c + '">' + esc(CERT[c] || c) + "</a>"; }).join(", ") + "</dd>" : "") +
      (t ? '<dt>Thread</dt><dd><a data-thread="' + esc(t.id) + '">' + esc(t.title) + "</a></dd>" : "") + "</dl>" +
      (x.content_angle ? '<div class="block"><h3>Content angle</h3><p>' + esc(x.content_angle) + "</p></div>" : "") + outlineBlocks(x) +
      (arr(x.also_at).length ? '<div class="block"><h3>Also reported by</h3><p style="font-size:14px">' + arr(x.also_at).map(function (u) { var host = u.replace(/^https?:\/\/(www\.)?/, "").split("/")[0]; return '<a href="' + esc(u) + '" target="_blank" rel="noopener" style="text-decoration:underline">' + esc(host) + "</a>"; }).join(", ") + "</p></div>" : "") +
      (rel.length ? '<div class="block"><h3>' + (t ? "More in this thread" : "Related") + "</h3>" + miniItems(rel) + "</div>" : "") + "</div>" +
      '<div class="peek-foot"><a class="btn primary" href="' + esc(x.url) + '" target="_blank" rel="noopener">Open source</a>' +
      (S.canWrite ? [["saved", "Save", "S"], ["used", "Mark used", "U"], ["dismissed", "Dismiss", "X"]].map(function (v) { return '<button class="btn" data-set="' + (cur === v[0] ? "new" : v[0]) + '" aria-pressed="' + (cur === v[0]) + '" title="' + v[1] + " (" + v[2] + ')">' + (cur === v[0] ? STATUS[v[0]] : v[1]) + "</button>"; }).join("") : "") +
      '<span class="sp"></span>' + (S.sample ? '<button class="btn" data-askitem="' + s + '">Ask</button>' : "") + "</div>";
    show(p);
    document.querySelectorAll("tbody tr").forEach(function (r) { r.classList.toggle("sel", r.dataset.item === s); });
    if (location.hash !== "#item-" + s) history.replaceState(null, "", "#item-" + s);
  }
  function show(p) { p.classList.add("open"); p.setAttribute("aria-hidden", "false"); $("scrim").classList.add("open"); }

    $("scrim").classList.remove("open"); $("side").classList.remove("open");
    if (S.peek) { S.peek = null; document.querySelectorAll("tbody tr.sel").forEach(function (r) { r.classList.remove("sel"); }); if (/^#item-/.test(location.hash)) history.replaceState(null, "", "#" + (S.route || "overview")); }
  }

  // Router
  function go(route) { S.pop = null; location.hash = "#" + route; }
  function render() {
    var h = (location.hash || "#overview").slice(1);
    if (h.indexOf("item-") === 0) { if (!S.route) S.route = "items"; h = S.route; } else S.route = h;

    document.querySelectorAll(".nav[data-view]").forEach(function (n) { if (base === "items" && S.view === n.dataset.view) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current"); });
    var crumb = { overview: "This week", coverage: "Coverage", items: S.view ? VIEWS[S.view].name : "All items", threads: "Threads", deadlines: "Dates", digests: "Digests" }[base] || "This week";
    var html;

    else if (base === "items") html = renderItems();

    else if (base === "deadlines") html = renderDates();
    else if (base === "digests") html = renderDigests();

    var m = /^#item-([0-9a-f]+)/.exec(location.hash); if (m && S.loaded) openPeek(m[1]);
  }
  function counts() {
    var L = live(); Object.keys(ADDED).forEach(function (k) { delete ADDED[k]; }); S.items.forEach(function (x) { if (added(x)) ADDED[added(x)] = fd(added(x), true); });
    $("ctAll").textContent = S.items.length || ""; $("ctThreads").textContent = S.threads.length || ""; $("ctDates").textContent = dates().length || ""; $("ctDigests").textContent = S.digests.length || "";
    $("vAct").textContent = L.filter(function (x) { return x.relevance === 3; }).length || ""; $("vMar").textContent = L.filter(function (x) { return x.for_marija; }).length || "";
    $("vDan").textContent = L.filter(function (x) { return x.for_danilo; }).length || ""; $("vCon").textContent = L.filter(function (x) { return x.content_worthy; }).length || "";
    $("vSav").textContent = S.items.filter(function (x) { return st(x) === "saved"; }).length || "";
    $("foot").textContent = S.runs[0] ? "Last processed " + fd(S.runs[0].date, true) : "";
  }
  window.addEventListener("hashchange", function () { if (!/^#item-/.test(location.hash)) { closePanels(); $("main").scrollTop = 0; } render(); });

  function setView(v) { S.view = v; S.f = blankF(); for (var k in VIEWS[v].f) S.f[k] = VIEWS[v].f[k].slice(); if (v === "saved") S.f.status = ["saved"]; if (location.hash === "#items") render(); else go("items"); }
  function setFilter(spec) { var p = spec.split(":"); S.view = null; S.f = blankF(); S.f[p[0]] = [p[1]]; closePanels(); if (location.hash === "#items") render(); else go("items"); }

  // Events
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-view],[data-item],[data-thread],[data-filter],[data-heat],[data-kpi],[data-pop],[data-sort],[data-set],[data-close],[data-askitem],[data-askthread],[data-step],#clr,#menuBtn,#askBtn,#qBtn,#scrim");
    if (!t) { if (S.pop && !e.target.closest(".pop")) { S.pop = null; render(); } return; }
    var ds = t.dataset;
    if (t.id === "menuBtn") { $("side").classList.add("open"); $("scrim").classList.add("open"); return; }
    if (t.id === "scrim" || ds.close !== undefined && t.hasAttribute("data-close")) { closePanels(); return; }
    if (t.id === "askBtn") { openAsk(null); return; }
    if (t.id === "qBtn") { if ($("bar").classList.toggle("searching")) $("q").focus(); return; }
    if (ds.step) { var nx = S.ctx[S.ctx.indexOf(S.peek) + Number(ds.step)]; if (nx) openPeek(nx); return; }
    if (t.id === "clr") { S.f = blankF(); S.view = null; render(); return; }
    if (ds.go) { S.view = null; $("side").classList.remove("open"); $("scrim").classList.remove("open"); go(ds.go); return; }
    if (ds.view) { $("side").classList.remove("open"); $("scrim").classList.remove("open"); setView(ds.view); return; }
    if (ds.item) { var box = t.closest("[data-list]") || (t.closest("#peek") ? null : V); if (box) { S.ctx = []; box.querySelectorAll("[data-item]").forEach(function (e2) { if (S.ctx.indexOf(e2.dataset.item) < 0) S.ctx.push(e2.dataset.item); }); } openPeek(ds.item); return; }
    if (ds.thread) { closePanels(); go("thread-" + ds.thread); return; }
    if (ds.filter) { setFilter(ds.filter); return; }
    if (ds.heat) { var hp = ds.heat.split("|"); S.view = null; S.f = blankF(); S.f.region = [hp[0]]; S.f.service = [hp[1]]; go("items"); return; }
    if (ds.kpi) { if (ds.kpi === "dates") go("deadlines"); else if (ds.kpi === "fresh") { S.view = null; S.f = blankF(); S.f.added = [latestDay()]; S.sort = { k: "relevance", d: -1 }; if (location.hash === "#items") render(); else go("items"); } else setView(ds.kpi === "content" ? "content" : "act"); return; }
    if (ds.pop) { S.pop = S.pop === ds.pop ? null : ds.pop; render(); return; }
    if (ds.sort) { S.sort = S.sort.k === ds.sort ? { k: ds.sort, d: -S.sort.d } : { k: ds.sort, d: ds.sort === "title" || ds.sort === "type" || ds.sort === "region" ? 1 : -1 }; render(); return; }
    if (ds.set) { setStatus(S.peek, ds.set); return; }
    if (ds.askitem) { openAsk({ k: "item", id: ds.askitem }); return; }
    if (ds.askthread) { openAsk({ k: "thread", id: ds.askthread }); return; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (S.pop) { S.pop = null; render(); } else closePanels(); }
    if (e.key === "Enter" && e.target.matches("[data-item][role=button]")) openPeek(e.target.dataset.item);
    if (e.key === "/" && !e.target.matches("input,textarea")) { e.preventDefault(); $("bar").classList.add("searching"); $("q").focus(); }
    if (S.peek && $("peek").classList.contains("open") && !e.target.matches("input,textarea,select") && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var key = e.key.toLowerCase(), stp = key === "j" ? 1 : key === "k" ? -1 : 0, to = { s: "saved", u: "used", x: "dismissed" }[key];
      if (stp) { var nx = S.ctx[S.ctx.indexOf(S.peek) + stp]; if (nx) openPeek(nx); }
      else if (to && S.canWrite && S.db) { var it = byId(S.peek); setStatus(S.peek, it && st(it) === to ? "new" : to); }
    }
  });
  V.addEventListener("change", function (e) {
    var t = e.target; if (t.id === "sortSel") { var sp = t.value.split(":"); S.sort = { k: sp[0], d: Number(sp[1]) }; render(); return; } if (!t.dataset.f) return;
    var l = S.f[t.dataset.f], i = l.indexOf(t.value); if (t.checked && i < 0) l.push(t.value); if (!t.checked && i >= 0) l.splice(i, 1);
    S.view = null; render();
  });
  var qt; $("q").addEventListener("input", function (e) { clearTimeout(qt); qt = setTimeout(function () { S.q = e.target.value.trim(); if (location.hash !== "#items") go("items"); else render(); }, 180); });

  // Status with undo
  var tt, undo;
  function toast(m, u) { $("toastT").textContent = m; undo = u; $("toastU").style.display = u ? "" : "none"; $("toast").classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { $("toast").classList.remove("show"); }, 6000); }
  $("toastU").addEventListener("click", function () { $("toast").classList.remove("show"); if (undo) undo(); });
  var busy = {};
  function setStatus(s, v, silent) {
    var x = byId(s); if (!x || !S.db || busy[x.id]) return; var prev = st(x); if (prev === v) return;
    x.status = v; busy[x.id] = true; openPeek(s); render();
    S.db.doc("items/" + x.id).update({ status: v, status_at: new Date().toISOString() }).then(function () {
      busy[x.id] = false; if (!silent) toast(v === "new" ? "Moved back to New" : STATUS[v], function () { setStatus(s, prev, true); });
    }).catch(function (err) {
      busy[x.id] = false; x.status = prev; openPeek(s); render();
      if (err && err.code === "invalid_argument") S.canWrite = false;
      toast("Not saved. " + (err && err.message ? err.message : "Try again."), null);
    });
  }

  // Ask
  var ctx = null, ac = null;
  var SUG = ["What should Marija post about this week?", "What changes for Italian clients in 2027?", "What should Danilo know about data centres?", "Which dates matter most for our clients?"];
  $("sugs").innerHTML = SUG.map(function (s) { return "<button type=\"button\">" + esc(s) + "</button>"; }).join("");
  $("sugs").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { $("askIn").value = b.textContent; $("askIn").focus(); } });
  function openAsk(c) { ctx = c; $("peek").classList.remove("open"); show($("ask")); setTimeout(function () { $("askIn").focus(); }, 60); }
  function scope() {
    var all = $("askScope").value === "all", l;
    if (ctx && ctx.k === "item") { var x = byId(ctx.id); l = x ? [x].concat(x.thread ? inThread(x.thread).filter(function (y) { return y !== x; }) : []) : []; }
    else if (ctx && ctx.k === "thread") l = inThread(ctx.id);
    else if ((location.hash || "").indexOf("#items") === 0) l = list();
    else if ((location.hash || "").indexOf("#thread-") === 0) l = inThread(location.hash.slice(8));
    else l = live();
    if (all) l = l.concat(live().filter(function (y) { return l.indexOf(y) < 0; }));
    return l.filter(function (y) { return st(y) !== "dismissed"; }).sort(byRel).slice(0, 150);
  }
  function compact(x) {
    var t = x.thread ? thread(x.thread) : null;
    return "[" + sid(x.id) + "] " + x.title_en + " | " + x.source_name + ", " + fd(x.published_at, true) + " | " + regionText(x) + " | relevance " + (x.relevance || 1) +
      (x.deadline ? " | date " + x.deadline + (x.deadline_label ? " (" + x.deadline_label + ")" : "") : "") + "\nSummary: " + x.summary + "\nFor Energo: " + (x.why_it_matters || "") +
      (x.for_marija ? "\nFlag: Marija" : "") + (x.for_danilo ? "\nFlag: Danilo" : "") + (x.content_angle ? "\nContent angle: " + x.content_angle : "") + (x.content_outline ? ["article", "carousel"].map(function (k) { var p = arr((x.content_outline || {})[k]); return p.length ? "\n" + (k === "article" ? "Article outline" : "Carousel outline") + ": " + p.join(" / ") : ""; }).join("") : "") + (t ? "\nThread: " + t.title : "") + (x.text_basis === "headline" ? "\nNote: headline only" : "");
  }
  var SYS = "You help the Energo Group team (Lav, communications; Marija; Danilo) understand news that matters to their work. Energo Group: MEP design, performance testing, simulations and CFD, LCA, ESG reporting and green building certification (LEED, BREEAM, WELL, DGNB, Parksmart; GRESB partner), offices in Belgrade and Bellinzona, working in Serbia, Italy, Switzerland and wider Europe. Marija Golubović: co-founder, LEED Fellow, lead instructor of Energo Academy. Danilo Franchi: co-founder, MEP and CFD lead, BREEAM assessor.\n\nAnswer only from the ITEMS. Never add facts that are not in them; if they do not answer the question, say so and say what is missing.\nCite each item you use as [[id]] right after the sentence that uses it.\nPlain, direct English, short paragraphs or a short list. No em dashes, no hype, no emojis. Connect the dots between items and say what it means for Energo.";
  $("askForm").addEventListener("submit", function (e) {
    e.preventDefault(); var q = $("askIn").value.trim(); if (!q || !S.sample) return;
    var l = scope(), box = document.createElement("div"); box.className = "qa";

      .then(function (r) { out.innerHTML = linkify(esc(r.text || "")) + (r.truncated ? '<p class="note">Cut short. Ask a narrower question for the rest.</p>' : ""); $("askIn").value = ""; })

      }).then(function () { go2.disabled = false; });
  });
  function linkify(h) { return h.replace(/\[\[([0-9a-f]{6,40})\]\]/g, function (m, id) { var x = byId(id.slice(0, 12)); return x ? '<a data-item="' + sid(x.id) + '" title="' + esc(x.title_en) + '">[' + esc(x.source_name) + "]</a>" : ""; }); }

  // Data
  function sub(db) {
    var timer = setTimeout(function () { if (!S.loaded) { S.stale = true; render(); } }, 10000), got = {};
    function ok(k, snap) { got[k] = 1; if (snap && !snap.metadata.fromCache) { clearTimeout(timer); S.stale = false; } if (got.items && got.threads) S.loaded = true; render(); }
    function rows(snap) { return snap.docs.map(function (x) { var o = Object.assign({}, x.data()); o.id = x.id; return o; }); }
    db.collection("items").onSnapshot(function (s) { S.items = rows(s); ok("items", s); }, function (e) { clearTimeout(timer); S.err = e && e.message || "unknown error"; render(); });
    db.collection("threads").onSnapshot(function (s) { S.threads = rows(s); ok("threads", s); }, function () { ok("threads", null); });
    db.collection("digests").onSnapshot(function (s) { S.digests = rows(s); counts(); if (location.hash === "#digests") render(); }, function () {});
    db.collection("runs").orderBy("date", "desc").limit(1).onSnapshot(function (s) { S.runs = rows(s); counts(); }, function () {});
  }
  var SNAP = JSON.parse(document.getElementById("snapshot").textContent);
  S.items = SNAP.items; S.threads = SNAP.threads; S.digests = SNAP.digests; S.runs = SNAP.runs;
  S.loaded = true; S.canWrite = false; S.sample = null;
  render(); counts();
})();
