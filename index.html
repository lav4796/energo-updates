perts, and new software speeds up the calculations.\n  Why it matters: Performance-based ventilation design is a concrete lever for Energo's MEP and IAQ work.\n  Source: https://www.facilitiesdive.com/news/little-used-iaq-procedure-can-lower-energy-use-by-20-experts-say/872875\n  Thread, Data centres: energy, cooling and the grid: Pressure is moving from energy to transparency and local consent: German operators are not publishing required data, Portugal drafts a renewables rule, and protests have reached Switzerland.\n\nUS, AFRICA AND GLOBAL\n\n- IEA: buildings could be at least 25% more energy efficient by 2035 (Biznis.rs)\n  An IEA analysis prepared for the COP31 presidency looks at a proposed global goal to improve the energy intensity of buildings by at least 25% by 2035.\n  Why it matters: Gives a global reference point for envelope upgrades, heat pumps and efficient equipment, which are the core of Energo's MEP and renovation work.\n  Source: https://biznis.rs/vesti/srbija/energetska-efikasnost-zgrada-mogla-bi-da-se-poboljsa-za-najmanje-25-odsto-do-2035-godine\n\nFOR MARIJA\n\n- GRESB publishes the key changes for its 2028 Standards\n- Parksmart pauses precertification and moves market engagement to IPMI\n- INREV builds the CRREM misalignment year into real estate valuation\n- EU Taxonomy review: new criteria proposed for building activities\n- SFDR 2.0: three fund categories replace Articles 8 and 9\n- Squire Patton Boggs: what the Omnibus reform means for ESG reporting and due diligence\n\nFOR DANILO\n\n- Germany: first parts of the building modernisation law apply from 1 January 2027\n- Whole-life carbon: national GWP roadmaps due by 1 January 2027\n- Thermal bridges under Italy's new minimum energy requirements\n- Case Green: indoor air quality becomes a building requirement\n- ASHRAE 62.1 IAQ procedure can cut HVAC energy by 20%\n- Kragujevac state data centre prepares space for a third supercomputer\n- German data centres are not publishing energy and water data required by law\n- Green plans a new data centre campus in Birr, Aargau\n- Spain multiplies energy savings credits for replacing boilers with heat pumps\n\nCONTENT IDEAS\n\n- GRESB publishes the key changes for its 2028 Standards\n  Angle: GRESB moves from scoring management to scoring performance: what owners need in place by the 2027 reporting year.\n  Channel: LinkedIn\n- Whole-life carbon: national GWP roadmaps due by 1 January 2027\n  Angle: From 2028, carbon has a number on the certificate: what developers in Italy and Serbia should prepare now.\n  Channel: Website\n- Germany: first parts of the building modernisation law apply from 1 January 2027\n  Angle: Germany makes LCA mandatory for new buildings over 1,000 m² from 2028: what that signals for Italy, Switzerland and Serbia.\n  Channel: Newsletter\n- INREV builds the CRREM misalignment year into real estate valuation\n  Angle: When the stranding year enters the valuation: what owners can measure and fix.\n  Channel: LinkedIn\n- Serbia amends the Law on Planning and Construction: solar for own use, construction waste plans\n  Angle: Serbia makes rooftop and on-site solar for factories easier: what owners should check before they build.\n  Channel: LinkedIn\n- German data centres are not publishing energy and water data required by law\n  Angle: Data centre energy and water reporting is now a legal duty in Germany; what operators in Serbia and Italy should prepare before similar checks.\n  Channel: LinkedIn\n- Thermal bridges under Italy's new minimum energy requirements\n  Angle: Thermal bridges under the new Italian minimum requirements: what changes in design checks.\n  Channel: Website\n- Case Green: indoor air quality becomes a building requirement\n  Angle: Insulate and ventilate: why the EPBD adds indoor air quality to renovation, and how to test it.\n  Channel: Newsletter\n- ASHRAE 62.1 IAQ procedure can cut HVAC energy by 20%\n  Angle: Ventilation by air quality, not only by rate: the ASHRAE 62.1 IAQ procedure and its energy savings.\n  Channel: Newsletter\n- IEA: buildings could be at least 25% more energy efficient by 2035\n  Angle: What a 25% global building efficiency goal means for owners in Serbia, Italy and Switzerland, and which measures get there.\n  Channel: LinkedIn"}, {"id": "2026-11-12", "date": "2026-11-12", "kind": "mid-week", "title": "Energo Intelligence: mid-week update, 12 November 2026", "item_ids": ["06bad73a6b3a0aa8a8195dc7a99353a26c56cd87", "13367f3c4a5242496a42478b00180617281e6add", "263a8d4f734c08ff02c13ff55f0408d565b7f947", "3613ae1597bd6743e03088c529347129bbff042f", "3b6db2e3cd2f7414dcd6a13e6a50902b31b0b3d0", "4ccfd1099fe9b03ad01895288f8a7827105d0023", "5aa5fd21d92d5567af3d04460501f8c24cb9128e", "5b44b709a6e8f29e50723121e1c67b5f60774984", "6489eff8a72d4ccfab4206ea88130ea3a86fa605", "702ffb01498c25015b8fc47ef04cd822dd2b3a4e", "7238fc6319ec15aa1535642e0cdc77b8fa6a8f6f", "7596bd60d06ff7329796f363f4eda1ce6cd5f498", "8149337600b9abf3e8c1d6ff0de01d0fdb6b14f6", "8166023c6706d9408df1b162bf64abb1792583e8", "862f4478836ce787368bad9796c05048a10208a1", "8cb4f31c80510849f3a35eb3260181822813e41d", "8d7165290f7c7de392bbda9a4f4128307a78eaab", "b5c2e13d2b95e2eab539620c53479291bc489b45", "bd1446371c5889c827b9b5caa9a0634369ffda1d", "bddf36713a58fdf209e82fb53a53a60ec6860b70", "d5eebd39233a2e1b5d90fa056978ef9592096001", "dcddbbc79d54ac823e9a95d28f62f6f91129812c", "f2ca52ebec66136971573f330513ed65c8ddcad0", "f8b3d451f421043f2c3c7458258b0c81a850a974", "ff08be9cf95bf354b4d84baff8d8bfa40d75d5ae"], "text": "Mid-week update: 148 items read on 12 November, 56 kept, 19 at relevance 2 or 3. Monday's weekly digest was saved on the page but not emailed, because Gmail sending failed that day.\n\nTOP 5 THIS WEEK\n\n- Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027 (Sky TG24)\n  Under Article 9(5-bis) of Legislative Decree 102/2014, meters, sub-meters and heat cost allocators in condominiums and mixed-use buildings served by central heating, cooling or district networks must be remotely readable by 1 January 2027. Devices installed after 25 October 2020 must already comply; older ones must be upgraded or replaced. The aim is billing based on actual, more frequent consumption data.\n  Why it matters: Building managers and condominium clients in Italy need a device check before the deadline, which is a short and concrete MEP task.\n  Source: https://tg24.sky.it/economia/2026/09/28/riscaldamento-contatori-condomini-novita-telelettura\n- EU exemption for F-gases in certain indoor monoblock heat pumps (EUR-Lex)\n  The Commission adopted Implementing Regulation (EU) 2026/2486 on 10 November 2026, authorising an exemption under the F-gas Regulation (EU) 2024/573 for placing fluorinated greenhouse gases on the market in certain types of indoor-installed monoblock heat pumps. Only the act's title was available; the scope and conditions are in the text.\n  Why it matters: Affects which refrigerants can be used in indoor monoblock heat pumps on EU projects, so it matters for heating system selection in MEP design.\n  Source: https://eur-lex.europa.eu/legal-content/EN/TXT?uri=CELEX%3A32026R2486\n- Cortexa survey: most Italian designers see the Case Green delay as a missed opportunity (Edilportale)\n  A Cortexa survey of more than 1,300 designers across three editions (2024 to 2026) found over 67% see Italy's failure to transpose the Case Green directive as a lost opportunity, over 63% cite the lack of long-term tax incentives and 59% ask for clear, stable rules. Cortexa also says the Italian external insulation market has halved compared with 2023, and criticises the budget for not raising the ecobonus to 65% and for spreading Superbonus credits over ten years.\n  Why it matters: Shows where Italian designers and clients stand while EPBD transposition is stalled, useful context for advising on renovation timing.\n  Source: https://www.edilportale.com/news/2026/11/risparmio-energetico/case-green-cortexa-e-progettisti-chiedono-regole-stabili_112702_27.html\n- Engineers and architects ask to drop the ten-year spread of Superbonus credits (Edilportale)\n  CNI, CNAPPC, Fondazione Inarcassa, Inarcassa and OICE jointly oppose Article 37 of the 2027 budget bill, which would spread over ten years the share of Superbonus credits for 2023 spending usable in 2027. They say it would hurt the liquidity of professionals, engineering firms and contractors, and ask the government and Parliament to remove it. CNI also asked in a hearing to extend the Sismabonus to 2030.\n  Why it matters: Engineering firms holding Superbonus credits, Energo's peers and clients included, may face cash flow pressure if the rule stays.\n  Source: https://www.edilportale.com/news/2026/11/professione/superbonus-2027-professionisti-contro-le-10-rate-dei-crediti_112666_33.html\n- Frankfurt data centre waste heat to supply 1,100 homes by 2040 (Presseportal)\n  ABG Frankfurt Holding, Mainova and Telehouse will supply the roughly 1,100 flats of the Friedrich-Ebert-Siedlung with server waste heat from the neighbouring data centre, switching about 80 flats a year. First heat delivery is planned for autumn 2027, saving about 650 tonnes of CO2 a year compared with gas, including heat pump electricity.\n  Why it matters: A worked example of data centre heat reuse with heat pumps, the kind of system Energo designs and models.\n  Source: https://www.presseportal.de/pm/17051/6388587\n\nDEADLINES AND OPEN CONSULTATIONS (NEXT 6 MONTHS)\n\n- 1 January 2027: Remote reading of heat meters required. Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027\n- 1 January 2027: National whole-life carbon roadmaps due. Whole-life carbon: national GWP roadmaps due by 1 January 2027\n- 1 January 2027: Germany: first GModG requirements apply. Germany: first parts of the building modernisation law apply from 1 January 2027\n- 11 February 2027: Swiss renovation funding: consultation closes. Switzerland proposes one renovation funding programme paid from the CO2 levy\n- 15 February 2027: EFRAG agenda consultation closes. EFRAG consults on its 2027 to 2029 sustainability reporting agenda\n- 19 March 2027: Omnibus I CSRD amendments: transposition deadline. Omnibus I: less than five months left to transpose the CSRD amendments\n- 24 March 2027: UK Future Homes Standard applies. UK Future Homes Standard: heat pumps and on-site renewables from 2027\n\nEU REGULATION AND ESG REPORTING\n\nWhere it stands, CSRD after Omnibus I: The Omnibus I amendments were adopted as Directive (EU) 2026/470, and Member States have until 19 March 2027 to transpose them; Finland, Croatia and Slovenia are ahead and most others are still drafting, while Italy has exempted companies up to 450 million euro revenue for 2026 and 2027. EFRAG is consulting until 15 February 2027 on a 2027 to 2029 agenda with no new standards. Advisers note that companies leaving CSRD scope still face ESG data requests from banks and customers.\n\n- Freshfields: Omnibus I transposition uneven across Member States (Freshfields)\n  Freshfields' November update says Member States are past the halfway point of the 12-month window to transpose Omnibus I, with Finland, Croatia and Slovenia ahead and most others still drafting. It also notes a provisional deal on 16 October letting the ETS Market Stability Reserve hold up to 700 million allowances, and a proposed one-year delay of importer obligations under the Methane Regulation.\n  Why it matters: CSRD obligations for clients will differ by country for a while, so advice has to follow national transposition.\n  Source: https://www.freshfields.com/en/our-thinking/blogs/sustainability/esg-insights-november-2026-102o8nh\n- Fewer CSRD obligations, but more requests for ESG data (Materia Rinnovabile | Renewable Matter)\n  Ollum's founders say the narrower CSRD scope reduces the number of companies that must publish sustainability reports but not the data they are asked for: banks, customers and supply chain partners keep requesting ESG information, including from companies outside the CSRD.\n  Why it matters: Supports Energo's case for ESG data services to companies that are no longer in CSRD scope.\n  Source: https://www.renewablematter.eu/meno-obblighi-ma-la-richiesta-di-dati-aumenta-esg-secondo-ollum\n\nITALY, SERBIA, SWITZERLAND\n\nWhere it stands, Italy's transposition of the EPBD (Case Green): MASE has sent Parliament draft principles for transposing the EPBD through the 2026 EU Delegation Law, and the Commission has issued a reasoned opinion over Italy's missing national renovation plan. Pressure is building: a Cortexa survey of over 1,300 designers finds most see the delay as a missed opportunity and want long-term incentives and stable rules, and Amici della Terra have sent the government a draft amendment to put the transposition into the Delegation Law, to be discussed in Rome on 26 November.\n\nWhere it stands, Italian building incentives for 2027: The 2027 budget bill keeps the 50% and 36% rates for one more year, drops the return of the ecobonus to 65% and would replace separate ecobonus limits with an overall cap of 96,000 euro per unit; it also includes 650 million euro for school energy renovation. Engineers', architects' and engineering firms' bodies have asked Parliament to drop Article 37, which spreads the last 2023 Superbonus credits over ten years. The Conto Termico 3.0 is oversubscribed, and its BACS class requirements now shape controls design.\n\n- Amici della Terra ask the government to put Case Green transposition into the 2026 EU Delegation Law (Canale Energia)\n  Amici della Terra sent an open letter to Prime Minister Meloni and ministers Pichetto Fratin and Foti with a proposed amendment to the 2026 EU Delegation Law that would set principles for transposing the EPBD (Directive 2024/1275). The association calls for a path that is technically feasible, affordable and socially fair, and will present it at its national energy efficiency conference in Rome on 25 and 26 November.\n  Why it matters: Another push to get the EPBD into the Delegation Law, which is the step the Italian transposition depends on.\n  Source: https://www.canaleenergia.com/rubriche/efficienza-energetica/direttiva-case-green-appello-degli-amici-della-terra-al-governo\n- Assoclima: school air conditioning plan should also cover ventilation (Edilportale)\n  Assoclima welcomes the 650 million euro in the 2027 budget bill for energy renovation of public school buildings and asks the government to combine cooling with ventilation and air exchange, improving both thermal comfort and indoor air quality.\n  Why it matters: A large public school programme in Italy is taking shape, with HVAC and indoor air quality design at its centre.\n  Source: https://www.edilportale.com/news/2026/11/impianti/climatizzazione-scuole-assoclima-chiede-piu-ventilazione_112616_25.html\n- Conto Termico 3.0 and BACS class B: what to check before choosing products (Ingenio)\n  In an Ingenio interview, Airzone Italia says Conto Termico 3.0 incentives for building automation require starting from the building's functions, use profiles and system, then checking consistency with UNI EN ISO 52120-1 and the required BACS class. It covers zoning and supervision choices.\n  Why it matters: BACS class requirements now decide incentive eligibility, which ties controls design directly to funding for Italian clients.\n  Source: https://www.ingenio-web.it/articoli/conto-termico-3-0-e-soluzioni-airzone-prodotti-funzioni-e-requisiti-bacs\n- Designing envelopes and facades under Italy's new minimum requirements (Ingenio)\n  Ingenio links the thermal bridge checks under Italy's new Requisiti Minimi to material choices and facade node design, with case studies on window installation, external insulation, ventilated facades and finishes.\n  Why it matters: The new minimum requirements change envelope checks, which affects energy calculations and APE work on Italian projects.\n  Source: https://www.ingenio-web.it/articoli/progetto-facciate-involucro-ponti-termici-serramenti-isolamento-finiture\n- MASE prepares 230 million euro in calls for hard-to-abate industry and positive energy districts (QualEnergia)\n  Italy's environment and energy ministry is preparing two calls: 180 million euro for decarbonising hard-to-abate industry and 50 million euro for positive energy districts. It has scheduled meetings with operators and stakeholders to define some aspects.\n  Why it matters: Positive energy districts need energy modelling and MEP design, a possible opening for Italian clients.\n  Source: https://www.qualenergia.it/pro/articoli-pro/industria-hard-to-abate-arrivo-bando-mase-180-milioni\n- Italy widens where solar PV can be built in UNESCO protection zones (QualEnergia)\n  Law no. 202 of 6 November 2026, in force from 10 November, widens the options for PV plants in UNESCO site protection zones, including medium and large installations on industrial areas, disused quarries and landfills.\n  Why it matters: Opens PV options for some Italian sites that were blocked before.\n  Source: https://www.qualenergia.it/pro/articoli-pro/fotovoltaico-zone-unesco-quali-impianti-si-potranno-realizzare\n\nOTHER EUROPEAN COUNTRIES\n\n- UK FCA publishes final rules for ESG ratings providers (Global Regulation Tomorrow)\n  On 3 November 2026 the FCA published Policy Statement 26/22 with final rules and guidance for ESG ratings providers, completing the UK regime that makes providing an ESG rating a regulated activity. Requirements cover transparency, governance, systems and controls, conflicts of interest and engagement with users and rated entities.\n  Why it matters: ESG ratings used by investors in Energo's clients will now be regulated in the UK, which may change how ratings are produced and challenged.\n  Source: https://www.regulationtomorrow.com/2026/11/financial-services-regulatory-esg-updater-8\n\nCERTIFICATIONS\n\nWhere it stands, Embodied carbon and LCA: London's draft plan caps upfront embodied carbon and requires whole-life carbon reporting, and LCA tools are being marketed around LEED v5. BRE, USGBC, DGNB and other rating bodies have started a 12-month collaboration on how BREEAM, LEED, DGNB, EDGE and Green Star recognise responsible timber construction.\n\n- BRE, USGBC, DGNB and others start work on rewarding responsible timber construction (BRE (BREEAM))\n  BRE announced at COP31 a proposed 12-month collaboration with Built by Nature, USGBC, GBCA, DGNB and other rating system bodies. It will examine how the Principles for Responsible Timber Construction are recognised in BREEAM, DGNB, EDGE, Green Star and LEED, and how rating systems can speed up adoption.\n  Why it matters: Timber credits may become more aligned across BREEAM, LEED and DGNB, which affects how projects score materials and embodied carbon.\n  Source: https://bregroup.com/news/international-collaboration-launched-to-advance-responsible-timber-construction\n- Study: LEED office used 31.7% less energy than a non-LEED office, but certification is not net zero (Bioengineer.org)\n  A study in Discover Civil Engineering compared a year of metered data from two Indian offices: a LEED-certified office in Noida had an energy use intensity of 185.02 kWh/m2 per year against 271.03 for a non-LEED office in Delhi. The authors conclude that LEED and IGBC, in their current form, are not designed to deliver net-zero buildings.\n  Why it matters: Gives measured evidence on certified building performance and its limits, useful when advising clients on going beyond a label.\n  Source: https://bioengineer.org/green-building-certifications-cut-energy-use-but-fall-short-of-net-zero\n\nENGINEERING AND DATA CENTRES\n\nWhere it stands, Data centres: energy, cooling and the grid: EU rules are moving from measuring data centre energy and water use toward a rating scheme, with first labels expected in 2027, while grid access is becoming the main constraint: Norway has paused grid bookings for new data centres pending a permit system. Heat reuse is moving into projects, with Frankfurt planning to heat 1,100 homes from a Telehouse data centre from 2027 and Vienna planning a 48 MW data centre with heat for local households. Public opposition keeps growing in Germany, Switzerland and the US.\n\nWhere it stands, Heating rules across Europe: Germany dropped its 65% renewable rule for new heating systems, Liechtenstein is easing heat pump permits and France is ending five renovation aid programmes. Spain multiplies energy savings credits for replacing boilers with heat pumps, and the UK Future Homes Standard moves new homes to heat pumps from March 2027. The EU has authorised an F-gas exemption for certain indoor monoblock heat pumps (Implementing Regulation 2026/2486).\n\n- Vienna plans a 48 MW data centre whose heat could warm thousands of homes (Dunav.at)\n  STRABAG Real Estate and the Vienna Business Agency are planning a modular data centre in Seestadt Aspern with up to 48 MW grid connection, built in phases, and estimated by EcoAustria to trigger about 350 million euro of investment. Server heat could heat about 12,700 households, according to the headline. EcoAustria puts Austrian data centre demand at about 419 MW against 80 to 100 MW of supply.\n  Why it matters: Another European project designing heat reuse in from the start, close to Energo's markets.\n  Source: https://dunav.at/bec-planira-data-centar-od-48-megavata-toplota-iz-servera-mogla-bi-grijati-12-700-domacinstava\n- Norway to limit data centre growth with a permit system (Ekspres.net)\n  Norway's government plans to limit the growth of energy-intensive data centres, and grid operator Statnett has paused grid connection bookings for new data centres until a permit system is in place. Priority will go to data centres serving defence, police, health and other critical infrastructure; new ones must cover the grid costs they cause. Statnett has received 26,000 MW of connection requests this year, 75% from data centres.\n  Why it matters: Grid access is becoming the limiting factor for data centres in Europe, which pushes efficiency and on-site energy into the design brief.\n  Source: https://www.ekspres.net/biznis/norveska-planira-ogranicavanje-data-centara-povezanih-sa-ai-11-11-2026\n- Cooling AI data centres: efficiency and continuity (Ingenio)\n  An MCE webinar reported by Ingenio covered cooling for AI data centres with dense, variable loads: choosing between air, direct-to-chip and immersion, using PUE and WUE together, and assessing free cooling and heat recovery against climate, temperatures and local demand.\n  Why it matters: Sets out the design questions Energo's data centre MEP and CFD work answers.\n  Source: https://www.ingenio-web.it/articoli/raffreddamento-data-center-ai-progettazione-efficienza-energetica\n\nCONTENT IDEAS\n\n- Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027\n  Angle: Seven weeks to the remote reading deadline: what Italian condominiums must check on their heat meters.\n  Channel: LinkedIn\n  Article outline:\n    1. State the rule: from 1 January 2027, meters and heat cost allocators in centrally heated multi-unit buildings in Italy must be remotely readable (Article 9(5-bis), D.Lgs. 102/2014).\n    2. Explain who is covered: condominiums and mixed-use buildings with central heating, cooling, hot water or district networks; devices installed after 25 October 2020 should already comply.\n    3. Set out the choice for older devices: upgrade where possible, otherwise replace.\n    4. Explain why the rule exists: billing based on actual and more frequent consumption data.\n    5. Close with what an administrator should do now: list the devices, check the remote reading capability and plan the work before year end.\n  Carousel outline:\n    1. Slide 1: hook, '1 January 2027: your heat meters must read themselves.'\n    2. Slide 2: the rule, Article 9(5-bis) of D.Lgs. 102/2014.\n    3. Slide 3: who it covers: centrally heated condominiums and mixed-use buildings.\n    4. Slide 4: devices installed after 25 October 2020 should already comply.\n    5. Slide 5: older devices: upgrade or replace.\n    6. Slide 6: call to action: check your building's devices now.\n- Frankfurt data centre waste heat to supply 1,100 homes by 2040\n  Angle: From servers to radiators: how a Frankfurt data centre will heat 1,100 homes.\n  Channel: LinkedIn\n  Article outline:\n    1. Open with the project: Telehouse server waste heat to supply about 1,100 flats in Frankfurt's Friedrich-Ebert-Siedlung by 2040.\n    2. Explain the partners and pace: ABG, Mainova and Telehouse, about 80 flats a year, first delivery autumn 2027.\n    3. Give the result claimed: about 650 tonnes of CO2 saved a year against gas, counting heat pump electricity.\n    4. Section for Energo's view on what heat reuse design involves (to be written from Energo's experience).\n    5. Close with the question for data centre owners: who next door could use your heat?\n  Carousel outline:\n    1. Slide 1: hook, 'A data centre will heat 1,100 homes.'\n    2. Slide 2: where: Friedrich-Ebert-Siedlung, Frankfurt.\n    3. Slide 3: who: ABG, Mainova and Telehouse.\n    4. Slide 4: pace: about 80 flats a year, first heat in autumn 2027.\n    5. Slide 5: result: about 650 tonnes of CO2 a year saved.\n    6. Slide 6: call to action: plan heat reuse at design stage.\n- Study: LEED office used 31.7% less energy than a non-LEED office, but certification is not net zero\n  Angle: A certified office used about a third less energy, and still was not net zero.\n  Channel: LinkedIn\n  Article outline:\n    1. Open with the result: a LEED office in Noida at 185.02 kWh/m2 a year against 271.03 for a non-LEED office in Delhi, a 31.7% difference.\n    2. Explain the method: twelve months of metered electricity from facility management logs.\n    3. Present the authors' conclusion that LEED and IGBC, as they stand, are not designed to deliver net zero.\n    4. Section for Energo's view on measuring performance after certification (to be written from Energo's experience).\n    5. Close with the question for owners: what does your building use after the plaque goes up?\n  Carousel outline:\n    1. Slide 1: hook, '31.7% less energy. Still not net zero.'\n    2. Slide 2: the comparison: 185.02 vs 271.03 kWh/m2 per year.\n    3. Slide 3: based on a full year of metered data.\n    4. Slide 4: the conclusion: certification lowers energy use but is not built for net zero.\n    5. Slide 5: what closes the gap: measuring and managing performance in use.\n    6. Slide 6: call to action: know what your building uses after certification.\n- Fewer CSRD obligations, but more requests for ESG data\n  Angle: Out of CSRD scope does not mean out of ESG data requests: banks and customers still ask.\n  Channel: LinkedIn\n  Article outline:\n    1. Open with the paradox: the CSRD scope has narrowed, but requests for ESG data have not.\n    2. Explain who keeps asking: banks, customers and supply chain partners, as described by Ollum.\n    3. Explain what this means for companies now outside CSRD scope.\n    4. Section for Energo's view on structured data collection for buildings and assets (to be written from Energo's experience).\n    5. Close with what a company should ask itself: who will request our data next, and is it ready?\n  Carousel outline:\n    1. Slide 1: hook, 'Out of CSRD scope? Your bank still wants your ESG data.'\n    2. Slide 2: the CSRD scope has narrowed after Omnibus I.\n    3. Slide 3: the requests come from banks, customers and supply chain partners.\n    4. Slide 4: fewer reports, not fewer questions.\n    5. Slide 5: structured data collection is the answer.\n    6. Slide 6: call to action: map who asks for your data.\n- BRE, USGBC, DGNB and others start work on rewarding responsible timber construction\n  Angle: BREEAM, LEED and DGNB look at timber together: what it could mean for projects.\n  Channel: Newsletter\n  Article outline:\n    1. Open with the announcement: BRE and partners including USGBC and DGNB start a 12-month collaboration announced at COP31.\n    2. Explain the Principles for Responsible Timber Construction, developed by Built by Nature and backed by nearly 400 endorsers.\n    3. List the rating systems in scope: BREEAM, DGNB, EDGE, Green Star and LEED.\n    4. Section for Energo's view on how timber is assessed today in the schemes Energo works with (to be written from Energo's experience).\n    5. Close with what developers should ask now when planning a timber project for certification."}, {"id": "2026-11-16", "date": "2026-11-16", "kind": "weekly", "title": "Energo Intelligence: week of 16 November 2026", "item_ids": ["d87355a94adf90618a980dc0e8c45391a832629b", "7ef19c2720a172915527561d7dfbe66d0c771e77", "862f4478836ce787368bad9796c05048a10208a1", "263a8d4f734c08ff02c13ff55f0408d565b7f947", "991f78f26f3254f878fff4d44fe43e67f7bd95ee", "2bb9ec18e29adf0d263a3ce226c56185b0836a27", "0f101d70b96722e895c1403b11e963f34fa106b3", "9180206218b5a3e6ba6b1f5bf7324a33dc49d599", "56e9a91304e8e3916939834462ba53f7b471d2bf", "08e4014f1ae8c3bbca88cd3abf5d6d8179977289", "7238fc6319ec15aa1535642e0cdc77b8fa6a8f6f", "d5eebd39233a2e1b5d90fa056978ef9592096001", "abaccc676407c8a38fe2d90c296a244cc0fadde1", "dcddbbc79d54ac823e9a95d28f62f6f91129812c", "ec8705e7a7f4e98b185ddb48deed44816bc669e6", "4f1c519654cc13c99d18f6b0246c9be52b34c59a", "9ed05bc48da1894cfde78f773c46fb5f1ece896e", "7596bd60d06ff7329796f363f4eda1ce6cd5f498", "78d11872992e7c43aee51ef0c4360a0db67d4328", "9ff19b1a19b1b45a2c1099a567205c1bb771ce2e", "662402a1006068246da1ec41f84729c986f9971d", "87f36c76b375de70153f189d4182722540c466d9", "06bad73a6b3a0aa8a8195dc7a99353a26c56cd87", "a0127741f458d037ec411d5600a69c51bb8208a0", "8c42f65ec74909c0b1b27f43ebf39ad72abf661b", "6ea42d5650a5a567d669a59102152e5d2fd16b36", "559bba23d3d145f4882f902ec38423afb4ff3e61", "3613ae1597bd6743e03088c529347129bbff042f", "208cad7b648b42baff2688157e2d289559077adb", "4ccfd1099fe9b03ad01895288f8a7827105d0023", "bac02cac5e06c7d894d129ee8d305576a8ea0938", "e9412662dcf7310fb84af2574cfbc975372e9e15", "18dacf7909ebd8f117429aac37817fae061319c8", "fa27c54e30c7918fe3ff6e3a720622dd7695cae9", "f8ed3219831ad9f1cd95a4dead6d82382ac0b0d5", "6489eff8a72d4ccfab4206ea88130ea3a86fa605", "702ffb01498c25015b8fc47ef04cd822dd2b3a4e", "dc297e3ab38b13250c38f13d16d2efa811cbba71", "8f19b20dafd816f4bee22e37c4d92a196c2bd77e", "5b44b709a6e8f29e50723121e1c67b5f60774984", "f8b3d451f421043f2c3c7458258b0c81a850a974", "2754aea2137fa608c92cb7602e655c561cf1412c", "f2ca52ebec66136971573f330513ed65c8ddcad0", "e51fec434bd0856dd0cf07b4bc7e972f08ad2e68", "b5c2e13d2b95e2eab539620c53479291bc489b45", "3e68cacb9268223e277f637cd228137c7ba29589", "ff08be9cf95bf354b4d84baff8d8bfa40d75d5ae", "bd1446371c5889c827b9b5caa9a0634369ffda1d", "8d7165290f7c7de392bbda9a4f4128307a78eaab", "887e630617beca28d7db09dfa85e9aab1f46dc8c", "48b9c0d715ace16e58ef21f181c30cc4ca583e80", "8166023c6706d9408df1b162bf64abb1792583e8"], "text": "This week: 127 new items read today, 50 kept. This digest covers the 52 items at relevance 2 or 3 processed since 9 November (5 to act on), because the 9 and 12 November digests were saved on the page but could not be emailed.\n\nTOP 5 THIS WEEK\n\n- EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition (éNordEst)\n  On 1 October 2026 the Commission sent Italy a reasoned opinion for not submitting the draft national building renovation plan required by Article 3 of the EPBD (Directive 2024/1275), and a second one for only partly transposing the Energy Efficiency Directive. Italy has two months to respond; otherwise the Commission can refer the cases to the EU Court of Justice. Deputy Prime Minister Salvini has said the Case Green rules will not be applied in Italy.\n  Why it matters: The renovation plan sets Italy's 2030, 2040 and 2050 targets and funding routes, so the delay keeps clients without a clear renovation trajectory while EU pressure grows.\n  Source: https://www.enordest.it/2026/11/15/case-green-leuropa-mette-in-mora-due-volte-litalia\n- Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027 (ESG Today)\n  The Commission has opened a consultation on draft standards for limited assurance of sustainability reporting under the CSRD, prepared with technical advice from CEAOB and based on ISSA 5000 with EU adaptations. The draft treats ESRS and the EU Taxonomy, including eligibility and alignment checks and digital tagging, as assurance criteria, and asks when the standard should become mandatory: 2027, 2028 or later. Omnibus I confirmed limited assurance and removed the option of moving to reasonable assurance; the consultation is open until 18 January 2027.\n  Why it matters: Clients reporting under CSRD will be assured against these rules, so the evidence trail for Energo's ESG and Taxonomy work has to meet them.\n  Source: https://www.esgtoday.com/eu-commission-releases-draft-sustainability-reporting-assurance-standards\n- Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027 (Sky TG24)\n  Under Article 9(5-bis) of Legislative Decree 102/2014, meters, sub-meters and heat cost allocators in condominiums and mixed-use buildings served by central heating, cooling or district networks must be remotely readable by 1 January 2027. Devices installed after 25 October 2020 must already comply; older ones must be upgraded or replaced. The aim is billing based on actual, more frequent consumption data.\n  Why it matters: Building managers and condominium clients in Italy need a device check before the deadline, which is a short and concrete MEP task.\n  Source: https://tg24.sky.it/economia/2026/09/28/riscaldamento-contatori-condomini-novita-telelettura\n- EU exemption for F-gases in certain indoor monoblock heat pumps (EUR-Lex)\n  The Commission adopted Implementing Regulation (EU) 2026/2486 on 10 November 2026, authorising an exemption under the F-gas Regulation (EU) 2024/573 for placing fluorinated greenhouse gases on the market in certain types of indoor-installed monoblock heat pumps. Only the act's title was available; the scope and conditions are in the text.\n  Why it matters: Affects which refrigerants can be used in indoor monoblock heat pumps on EU projects, so it matters for heating system selection in MEP design.\n  Source: https://eur-lex.europa.eu/legal-content/EN/TXT?uri=CELEX%3A32026R2486\n- ETS2: compensation rules for fuel consumers published in the Official Journal (FASI.eu)\n  FASI reports that rules on compensation for fuel consumers under ETS2 have been published in the Official Journal of the EU. Only the headline is available.\n  Why it matters: ETS2 will put a carbon price on building heating fuels; the support rules affect how fast owners switch to heat pumps.\n  Source: https://fasi.eu/en/articles/news/30959-ets2-rules-on-compensation-for-fuel-consumers-published-in-the-official-journal-of-the-eu.html\n\nDEADLINES AND OPEN CONSULTATIONS (NEXT 6 MONTHS)\n\n- 16 November 2026: Tender closes. Tender: PV design update and site supervision in Bussero (MI)\n- 23 November 2026: Tender deadline. Galliate public lighting energy upgrade tender\n- 1 December 2026: Italy's two months to answer the reasoned opinions end. EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition\n- 1 December 2026: ENVI committee vote on the ETS reform. Polish MEPs propose delaying ETS2 to 2031 or scrapping it\n- 1 January 2027: Remote reading of heat meters required. Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027\n- 1 January 2027: National whole-life carbon roadmaps due. Whole-life carbon: national GWP roadmaps due by 1 January 2027\n- 1 January 2027: Germany: first GModG requirements apply. Germany: first parts of the building modernisation law apply from 1 January 2027\n- 15 January 2027: Award applications close. Energy Efficiency Award: applications open until 15 January 2027\n- 18 January 2027: Consultation on the CSRD assurance standard closes. Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027\n- 11 February 2027: Swiss renovation funding: consultation closes. Switzerland proposes one renovation funding programme paid from the CO2 levy\n- 15 February 2027: EFRAG agenda consultation closes. EFRAG consults on its 2027 to 2029 sustainability reporting agenda\n- 19 March 2027: Omnibus I CSRD amendments: transposition deadline. Omnibus I: less than five months left to transpose the CSRD amendments\n- 24 March 2027: UK Future Homes Standard applies. UK Future Homes Standard: heat pumps and on-site renewables from 2027\n- 26 April 2027: Graubünden heat pump tender deadline. Graubünden opens first tender for industrial high-temperature heat pumps, up to 800,000 francs per project\n\nEU REGULATION AND ESG REPORTING\n\n  Thread, CSRD after Omnibus I: The Omnibus I amendments were adopted as Directive (EU) 2026/470, with transposition due by 19 March 2027; Italy has exempted companies up to 450 million euro revenue for 2026 and 2027. The Commission is consulting until 18 January 2027 on a draft EU limited assurance standard based on ISSA 5000, with ESRS and the Taxonomy as criteria and a start date of 2027, 2028 or later. Companies outside scope still face ESG data requests, and some, such as bremenports, are moving to the voluntary VSME standard.\n  Thread, ETS2: carbon price on building heating: The carbon price on fuels for building heating and road transport starts in 2028 instead of 2027, and compensation rules for fuel consumers are in the Official Journal. Polish MEPs have now tabled amendments to delay ETS2 to 2031 or scrap it, claiming support from 11 EPP delegations; the environment committee votes on the ETS reform on 1 December.\n- Squire Patton Boggs: what the Omnibus reform means for ESG reporting and due diligence (Squire Patton Boggs)\n  The Omnibus reform, adopted as Directive (EU) 2026/470, narrows the scope of the CSRD and the CSDDD, so many companies will report later or not at all.\n  Why it matters: Companies dropping out of the CSRD will still get ESG data requests from lenders and clients, which keeps demand for voluntary reporting such as VSME.\n  Source: https://www.squirepattonboggs.com/insights/publications/esg-disclosure-and-corporate-due-diligence-obligations-under-the-omnibus-reform\n- Poland wants ETS2 added to the ETS reform talks (UA.NEWS)\n  Poland asked to add ETS2 to the ETS1 reform negotiations, which it believes could open the way to delaying ETS2 to at least 2030 or making it voluntary.\n  Why it matters: Any further delay to ETS2 changes the business case for heating upgrades in buildings.\n  Source: https://ua.news/en/dovkolo-svitu/polshcha-domagaietsia-vkliuchennia-ets2-do-peregovoriv-pro-reformu-ets-rmf24\n- Freshfields: Omnibus I transposition uneven across Member States (Freshfields)\n  Freshfields' November update says Member States are past the halfway point of the 12-month window to transpose Omnibus I, with Finland, Croatia and Slovenia ahead and most others still drafting.\n  Why it matters: CSRD obligations for clients will differ by country for a while, so advice has to follow national transposition.\n  Source: https://www.freshfields.com/en/our-thinking/blogs/sustainability/esg-insights-november-2026-102o8nh\n- Polish MEPs propose delaying ETS2 to 2031 or scrapping it (UA.NEWS)\n  Polish MEPs have tabled amendments to the EU emissions trading reform to delay ETS2, which covers building heating and road transport fuels, from 2028 to 2031 or remove it.\n  Why it matters: A further ETS2 delay would change the heating cost outlook clients use to justify building decarbonisation.\n  Source: https://ua.news/en/world/pols-ki-ievrodeputati-zaproponuvali-vidklasti-ets2-do-2031-roku-rmf24\n\nITALY, SERBIA, SWITZERLAND\n\n  Thread, Italy's transposition of the EPBD (Case Green): On 1 October 2026 the Commission sent Italy two reasoned opinions, one for the missing draft national building renovation plan under the EPBD and one for partial transposition of the Energy Efficiency Directive; Italy has two months to respond before a possible Court referral. MASE has sent Parliament draft transposition principles for the 2026 EU Delegation Law, while designers, insulation makers and Amici della Terra press for faster transposition and Deputy Prime Minister Salvini says Case Green will not apply in Italy.\n  Thread, Italian building incentives for 2027: The 2027 budget bill keeps the 50% and 36% rates for one more year, drops the return of the ecobonus to 65% and replaces separate ecobonus limits with an overall cap of 96,000 euro per unit. Ance, engineers and architects ask Parliament to soften Article 37, which spreads the last 2023 Superbonus credits over ten years, and Ance also wants the ecobonus limits revised for condominiums. The Conto Termico 3.0 is oversubscribed, and FIRE reports that PNRR funds for ESCo renovation of public housing ran out with 147 applications unexamined.\n- Green plans a new data centre campus in Birr, Aargau (Computerworld.ch)\n  Data centre operator Green bought the Grossacher and Grändel site in Birr from ABB to build a data centre campus step by step.\n  Why it matters: A Swiss data centre project where cooling and waste heat design matter.\n  Source: https://www.computerworld.ch/themen/cloud-und-infrastruktur/green-plant-neuen-datacenter-campus-in-birr\n- Kragujevac state data centre prepares space for a third supercomputer (Naslovi.net)\n  The state data centre in Kragujevac runs two supercomputers and is preparing a space with water cooling for a third, more powerful one arriving from France by the end of the year, according to RTS.\n  Why it matters: Liquid cooling for HPC in Serbia is directly in Energo's data centre MEP field.\n  Source: https://naslovi.net/2026-10-28/pressek/data-centar-u-kragujevcu-sprema-prostor-za-novi-superkompjuter/42537796\n- Umbria: incentives to replace stoves and fireplaces with biomass or heat pumps (ACCA software)\n  ACCA reports that Umbria offers incentives to replace stoves and fireplaces with biomass generators and heat pumps.\n  Why it matters: Regional heating incentive in Italy.\n  Source: https://biblus.acca.it/notizie/umbria-incentivi-per-sostituire-stufe-e-camini-con-generatori-a-biomassa-e-pompe-di-calore\n- Thermal bridges under Italy's new minimum energy requirements (Ingenio)\n  Ingenio explains how the D.M. 28 October 2025 changes the way limit values for thermal bridges are calculated in legal checks for new and existing buildings, with worked examples.\n  Why it matters: Directly changes envelope calculations on Italian projects and APEs.\n  Source: https://www.ingenio-web.it/articoli/ponti-termici-requisiti-minimi-2025-verifiche-trasmittanza\n- Case Green: indoor air quality becomes a building requirement (greencity.it)\n  The article notes that Article 13 of the EPBD (2024/1275) requires Member States to set indoor air quality requirements.\n  Why it matters: IAQ requirements will tie renovation projects to ventilation design and testing, which Energo offers.\n  Source: https://www.greencity.it/casa/19102/direttiva-case-green-non-basta-isolare-la-qualita-dellaria-interna-entra-tra-i-requisiti-obbligatori-degli-edifici.html\n- University of Belgrade Faculty of Mechanical Engineering: energy renovation of a building (eKapija)\n  eKapija lists an investment for the energy renovation and adaptation of an existing building of the Faculty of Mechanical Engineering in Belgrade.\n  Why it matters: A possible MEP and energy renovation opportunity in Belgrade.\n  Source: https://www.ekapija.com/browse/investment/24453/masinski-fakultet-beograd-energetska-sanacija-i-adaptacija-postojece-zgrade\n- Superbonus: 2027 budget spreads the last share of 2023 credits over ten years (Edilportale)\n  Edilportale reports that the 2027 budget spreads the final instalment of Superbonus credits from 2023 over ten years.\n  Why it matters: Affects cash flow for owners and firms holding Superbonus credits.\n  Source: https://www.edilportale.com/news/2026/11/normativa/superbonus-2027-crediti-2023-in-10-rate-fino-al-2036_112615_15.html\n- Assoclima: school air conditioning plan should also cover ventilation (Edilportale)\n  Assoclima welcomes the 650 million euro in the 2027 budget bill for energy renovation of public school buildings and asks the government to combine cooling with ventilation and air exchange, improving both thermal comfort and indoor air quality.\n  Why it matters: A large public school programme in Italy is taking shape, with HVAC and indoor air quality design at its centre.\n  Source: https://www.edilportale.com/news/2026/11/impianti/climatizzazione-scuole-assoclima-chiede-piu-ventilazione_112616_25.html\n- Novi Sad: city energy efficiency plan (eKapija)\n  eKapija lists an investment entry for an energy efficiency plan for the City of Novi Sad.\n  Why it matters: A possible opportunity for energy planning and audit work in Serbia.\n  Source: https://ba.ekapija.com/browse/investment/24324/plan-energetske-efikasnosti-grada-novi-sad\n- Fewer CSRD obligations, but more requests for ESG data (Materia Rinnovabile | Renewable Matter)\n  Ollum's founders say the narrower CSRD scope reduces the number of companies that must publish sustainability reports but not the data they are asked for: banks, customers and supply chain partners keep requesting ESG information, including from companies outside the CSRD.\n  Why it matters: Supports Energo's case for ESG data services to companies that are no longer in CSRD scope.\n  Source: https://www.renewablematter.eu/meno-obblighi-ma-la-richiesta-di-dati-aumenta-esg-secondo-ollum\n- New EU directives and the future of building renovation in Serbia (Energetski portal)\n  Energetski portal compares the EPBD's push for 2 to 3% yearly renovation of the building stock with Serbia's first subsidy and loan programmes.\n  Why it matters: Frames the renovation market Energo serves in Serbia and where EU rules will push it.\n  Source: https://energetskiportal.rs/nove-direktive-evropske-unije-i-buducnost-energetske-sanacije-zgrada-u-srbiji\n- Data centre opposition reaches Switzerland (Blick)\n  Greenpeace protested at a data centre site in Beringen (SH) and is calling for national planning rules or a moratorium.\n  Why it matters: Rules on energy and transparency for Swiss data centres would affect design and reporting on projects Energo could support.\n  Source: https://www.blick.ch/schweiz/beringen-greenpeace-aktion-gegen-rechenzentren/nb5g8t2\n- Conto Termico 3.0 and BACS class B: what to check before choosing products (Ingenio)\n  In an Ingenio interview, Airzone Italia says Conto Termico 3.0 incentives for building automation require starting from the building's functions, use profiles and system, then checking consistency with UNI EN ISO 52120-1 and the required BACS class.\n  Why it matters: BACS class requirements now decide incentive eligibility, which ties controls design directly to funding for Italian clients.\n  Source: https://www.ingenio-web.it/articoli/conto-termico-3-0-e-soluzioni-airzone-prodotti-funzioni-e-requisiti-bacs\n- FIRE: PNRR funds for ESCo renovation of Italian public housing ran out before most applications were examined (PMI.it)\n  According to FIRE's analysis of GSE data, PNRR measure M7-I17 for public housing admitted 124 of 286 applications, worth 1.57 billion euro in incentives, and left 147 unexamined because funds ran out.\n  Why it matters: Shows that demand for energy service contracts in Italy outstrips funding, and that measurement and verification of savings is a recurring barrier.\n  Source: https://www.pmi.it/economia/green-economy/502381/contratti-epc-servizi-energetici-pa.html\n- MASE prepares 230 million euro in calls for hard-to-abate industry and positive energy districts (QualEnergia)\n  Italy's environment and energy ministry is preparing two calls: 180 million euro for decarbonising hard-to-abate industry and 50 million euro for positive energy districts.\n  Why it matters: Positive energy districts need energy modelling and MEP design, a possible opening for Italian clients.\n  Source: https://www.qualenergia.it/pro/articoli-pro/industria-hard-to-abate-arrivo-bando-mase-180-milioni\n- Engineers and architects ask to drop the ten-year spread of Superbonus credits (Edilportale)\n  CNI, CNAPPC, Fondazione Inarcassa, Inarcassa and OICE jointly oppose Article 37 of the 2027 budget bill, which would spread over ten years the share of Superbonus credits for 2023 spending usable in 2027.\n  Why it matters: Engineering firms holding Superbonus credits, Energo's peers and clients included, may face cash flow pressure if the rule stays.\n  Source: https://www.edilportale.com/news/2026/11/professione/superbonus-2027-professionisti-contro-le-10-rate-dei-crediti_112666_33.html\n- Italy widens where solar PV can be built in UNESCO protection zones (QualEnergia)\n  Law no. 202 of 6 November 2026, in force from 10 November, widens the options for PV plants in UNESCO site protection zones, including medium and large installations on industrial areas, disused quarries and landfills.\n  Why it matters: Opens PV options for some Italian sites that were blocked before.\n  Source: https://www.qualenergia.it/pro/articoli-pro/fotovoltaico-zone-unesco-quali-impianti-si-potranno-realizzare\n- Cortexa survey: most Italian designers see the Case Green delay as a missed opportunity (Edilportale)\n  A Cortexa survey of more than 1,300 designers across three editions (2024 to 2026) found over 67% see Italy's failure to transpose the Case Green directive as a lost opportunity, over 63% cite the lack of long-term tax incentives and 59% ask for clear, stable rules.\n  Why it matters: Shows where Italian designers and clients stand while EPBD transposition is stalled, useful context for advising on renovation timing.\n  Source: https://www.edilportale.com/news/2026/11/risparmio-energetico/case-green-cortexa-e-progettisti-chiedono-regole-stabili_112702_27.html\n- Cooling AI data centres: efficiency and continuity (Ingenio)\n  An MCE webinar reported by Ingenio covered cooling for AI data centres with dense, variable loads: choosing between air, direct-to-chip and immersion, using PUE and WUE together, and assessing free cooling and heat recovery against climate, temperatures and local demand.\n  Why it matters: Sets out the design questions Energo's data centre MEP and CFD work answers.\n  Source: https://www.ingenio-web.it/articoli/raffreddamento-data-center-ai-progettazione-efficienza-energetica\n- Amici della Terra ask the government to put Case Green transposition into the 2026 EU Delegation Law (Canale Energia)\n  Amici della Terra sent an open letter to Prime Minister Meloni and ministers Pichetto Fratin and Foti with a proposed amendment to the 2026 EU Delegation Law that would set principles for transposing the EPBD (Directive 2024/1275).\n  Why it matters: Another push to get the EPBD into the Delegation Law, which is the step the Italian transposition depends on.\n  Source: https://www.canaleenergia.com/rubriche/efficienza-energetica/direttiva-case-green-appello-degli-amici-della-terra-al-governo\n- Designing envelopes and facades under Italy's new minimum requirements (Ingenio)\n  Ingenio links the thermal bridge checks under Italy's new Requisiti Minimi to material choices and facade node design, with case studies on window installation, external insulation, ventilated facades and finishes.\n  Why it matters: The new minimum requirements change envelope checks, which affects energy calculations and APE work on Italian projects.\n  Source: https://www.ingenio-web.it/articoli/progetto-facciate-involucro-ponti-termici-serramenti-isolamento-finiture\n- Ance asks Parliament to soften Superbonus credit spreading and the new ecobonus limits (Edilportale)\n  In a hearing on the 2027 budget bill, builders' association Ance welcomed the extension of the 50% and 36% rates but contested two measures.\n  Why it matters: The final ecobonus limits will decide how much deep renovation in Italian condominiums is worth to clients in 2027.\n  Source: https://www.edilportale.com/news/2026/11/normativa/manovra-2027-le-richieste-ance-su-superbonus-ed-ecobonus_112727_15.html\n- Graubünden opens first tender for industrial high-temperature heat pumps, up to 800,000 francs per project (Nau)\n  The canton of Graubünden has opened its first competitive tender under its climate protection and innovation law for industrial high-temperature heat pumps producing process heat.\n  Why it matters: A Swiss funding route for industrial heat pump projects that need feasibility and MEP design work.\n  Source: https://www.nau.ch/ort/chur/kanton-graubunden-kanton-fordert-warmepumpen-mit-bis-zu-800000-franken-67201338\n- Pančevo: former Azotara plant sold to a Dubai-linked firm, plan allows a data centre campus of up to 650 MW (Vojvođanski reporter)\n  HIP Azotara in Pančevo now belongs to Mileva Data Technologies, founded in July 2026 and owned by Mileva FZCO from Dubai; the change was registered on 11 August.\n  Why it matters: A potentially very large data centre in Serbia would need MEP, cooling and energy design, and the open questions on water and heat are where Energo's expertise fits.\n  Source: https://vojvodjanskireporter.rs/od-fabrike-djubriva-do-data-centra-azotara-prodata-kompaniji-povezanoj-sa-emiratima\n- Infomaniak and Gruyère Energie plan a 2.5 MW data centre in Bulle feeding district heating (Baublatt)\n  Infomaniak and Gruyère Energie have put a building application on public display for a data centre in Bulle (FR) with 2.5 MW of IT power and 170 racks on about 1,200 m2.\n  Why it matters: A Swiss reference for heat reuse and waterless cooling in data centre design, the kind of MEP and energy concept Energo can deliver.\n  Source: https://www.baublatt.ch/baubranche/infomaniak-plant-rechenzentrum-mit-abwaermenutzung-in-bulle-39891\n- Italy: MASE decree sets technical rules for small open-loop geothermal systems (Ingenio)\n  MASE has published decree no. 364 of 11 November 2026, which sets requirements for small local open-loop geothermal systems under 2 MW, including groundwater heat exchange for building heating and cooling.\n  Why it matters: Clarifies the permitting and design rules for groundwater heat pump systems in Italy, which affects HVAC concepts on projects that consider them.\n  Source: https://www.ingenio-web.it/articoli/geotermia-circuito-aperto-decreto-mase-pozzi-monitoraggio\n- Data centre heat for homes: Serbian outlet points to Kragujevac as a local example (Biznis Kurir)\n  Biznis Kurir explains how server heat can be captured by heat exchangers and raised by heat pumps to heat water or feed district heating, a model already in use in Denmark and the UK, including a London household device from Heata.\n  Why it matters: Shows heat reuse entering the Serbian conversation, a service angle for Energo's MEP and energy work on data centres.\n  Source: https://biznis.kurir.rs/info-biz/10157538/kako-serveri-mogu-grejati-domove-u-srbiji\n\nOTHER EUROPEAN COUNTRIES\n\n  Thread, Heating rules across Europe: Germany dropped its 65% renewable rule for new heating systems, Liechtenstein is easing heat pump permits and France is ending five renovation aid programmes while shifting support toward energy savings certificates. Spain multiplies savings credits for heat pumps, the UK Future Homes Standard moves new homes to heat pumps from March 2027, the EU authorised an F-gas exemption for some indoor monoblock heat pumps, and Graubünden has opened a tender for industrial high-temperature heat pumps until 26 April 2027.\n  Thread, France's tertiary decree (Décret tertiaire): Owners and tenants of tertiary buildings with 1,000 m² or more must declare consumption every year on OPERAT and cut final energy use by 40% by 2030, 50% by 2040 and 60% by 2050. Guidance for 2027 focuses on data quality and tracking the trajectory.\n- Scotland's Passivhaus-equivalent standard criticised by housing bodies (Housing Today)\n  Scottish housing bodies say a proposed Passivhaus-equivalent energy standard would add cost for a small carbon gain.\n  Why it matters: Another European energy code moving toward very low energy new buildings.\n  Source: https://www.housingtoday.co.uk/news/scottish-governments-proposals-for-passivhaus-equivalent-energy-standard-criticised-by-housing-bodies/5144817.article\n- France's tertiary decree: what to prepare for in 2027 (L'Energeek)\n  L'Energeek explains the 2027 obligations under France's Décret tertiaire for buildings with 1,000 m² or more of tertiary space: annual consumption declarations on OPERAT and tracking against targets of -40% by 2030, -50% by 2040 and -60% by 2050.\n  Why it matters: Useful reference for clients with French office or retail assets and a model for performance-based rules elsewhere.\n  Source: https://lenergeek.com/2026/11/06/decret-tertiaire-2027-comment-anticiper-les-prochaines-echeances-reglementaires\n- Spain multiplies energy savings credits for replacing boilers with heat pumps (Demócrata)\n  Spain's ecological transition ministry published a scheme in the official gazette that multiplies the energy savings certificates (CAE) recognised for replacing fossil boilers with electric heat pumps, by 2 to 4 depending on building and heating system type.\n  Why it matters: Another European example of incentives shifting heating to heat pumps.\n  Source: https://www.democrata.es/it/economia/il-governo-spinge-affinche-le-comunita-sostituiscano-le-caldaie-con-pompe-di-calore-elettriche/amp\n- UK FCA publishes final rules for ESG ratings providers (Global Regulation Tomorrow)\n  On 3 November 2026 the FCA published Policy Statement 26/22 with final rules and guidance for ESG ratings providers, completing the UK regime that makes providing an ESG rating a regulated activity.\n  Why it matters: ESG ratings used by investors in Energo's clients will now be regulated in the UK, which may change how ratings are produced and challenged.\n  Source: https://www.regulationtomorrow.com/2026/11/financial-services-regulatory-esg-updater-8\n- bremenports publishes its first sustainability report under the VSME standard (American Journal of Transportation)\n  Port company bremenports has published its 2026 sustainability report, covering 2024 and 2025, for the first time under the EU Voluntary Sustainability Reporting Standard for SMEs (VSME).\n  Why it matters: A real example of a public-sector company switching to VSME, useful when advising SMEs and suppliers that face ESG data requests from banks and customers.\n  Source: https://www.ajot.com/news/bremenports-publishes-new-sustainability-report-for-the-first-time-in-accordance-with-the-european-vsme-standard\n\nCERTIFICATIONS\n\n  Thread, Embodied carbon and LCA: London's draft plan caps upfront embodied carbon and requires whole-life carbon reporting, and LCA tools are being marketed around LEED v5. BRE, USGBC, DGNB and other rating bodies have started a 12-month collaboration on how BREEAM, LEED, DGNB, EDGE and Green Star recognise responsible timber construction.\n- Study: LEED office used 31.7% less energy than a non-LEED office, but certification is not net zero (Bioengineer.org)\n  A study in Discover Civil Engineering compared a year of metered data from two Indian offices: a LEED-certified office in Noida had an energy use intensity of 185.02 kWh/m2 per year against 271.03 for a non-LEED office in Delhi.\n  Why it matters: Gives measured evidence on certified building performance and its limits, useful when advising clients on going beyond a label.\n  Source: https://bioengineer.org/green-building-certifications-cut-energy-use-but-fall-short-of-net-zero\n- DGNB presents its new 2026 system for existing districts (myDGNB)\n  DGNB has released a 2026 version of its certification system for existing districts, aimed at owners, companies, municipalities and redevelopment bodies assessing and transforming existing quarters.\n  Why it matters: A new DGNB scheme for existing districts is relevant for Energo's DGNB work on large existing sites.\n  Source: https://my.dgnb.de/de/events/einblick-das-neue-dgnb-system-fuer-quartiere-mit-stimmen-aus-der-praxis-1\n- BRE, USGBC, DGNB and others start work on rewarding responsible timber construction (BRE (BREEAM))\n  BRE announced at COP31 a proposed 12-month collaboration with Built by Nature, USGBC, GBCA, DGNB and other rating system bodies.\n  Why it matters: Timber credits may become more aligned across BREEAM, LEED and DGNB, which affects how projects score materials and embodied carbon.\n  Source: https://bregroup.com/news/international-collaboration-launched-to-advance-responsible-timber-construction\n\nENGINEERING AND DATA CENTRES\n\n  Thread, Data centres: energy, cooling and the grid: EU rules are moving from measuring data centre energy and water use toward a rating scheme, while countries add their own conditions: Greece now requires at least 60% renewable power and payments of 20,000 euro per MW a year to host communities, and Norway has paused grid bookings. Heat reuse is spreading, with Infomaniak planning a 2.5 MW data centre in Bulle feeding about 28 GWh a year into district heating from 2028. In Serbia, the former Azotara site in Pančevo has been sold to a Dubai-linked firm and planned for a data centre of up to 650 MW, with local questions on water, power and heat.\n- Portugal drafts rules requiring data centres to run on renewable energy (Portugal Resident)\n  Portugal Resident reports that the government is preparing rules requiring data centres to use renewable energy.\n  Why it matters: Another national rule shaping data centre energy design in Europe.\n  Source: https://www.portugalresident.com/de/Die-Regierung-erarbeitet-neue-Regeln--die-vorschreiben--dass-Rechenzentren-mit-erneuerbarer-Energie-betrieben-werden-m%C3%BCssen.\n- German data centres are not publishing energy and water data required by law (www.mojkraj.hr)\n  Germany's Energy Efficiency Act requires larger data centres to publish electricity and water use, but more than half of the 30 largest operators appear not to comply, according to queries by broadcaster ARD. Legal experts reject trade secrecy as a reason, and only about one in four facilities appears in the national data centre register published in August.\n  Why it matters: Shows that EU-driven data centre reporting duties are being enforced and questioned; operators Energo works with will need reliable metering and reporting.\n  Source: https://www.mojkraj.hr/en/business/german-data-centres-hide-energy-and-water-consumption-data\n- Norway to limit data centre growth with a permit system (Ekspres.net)\n  Norway's government plans to limit the growth of energy-intensive data centres, and grid operator Statnett has paused grid connection bookings for new data centres until a permit system is in place.\n  Why it matters: Grid access is becoming the limiting factor for data centres in Europe, which pushes efficiency and on-site energy into the design brief.\n  Source: https://www.ekspres.net/biznis/norveska-planira-ogranicavanje-data-centara-povezanih-sa-ai-11-11-2026\n- Frankfurt data centre waste heat to supply 1,100 homes by 2040 (Presseportal)\n  ABG Frankfurt Holding, Mainova and Telehouse will supply the roughly 1,100 flats of the Friedrich-Ebert-Siedlung with server waste heat from the neighbouring data centre, switching about 80 flats a year.\n  Why it matters: A worked example of data centre heat reuse with heat pumps, the kind of system Energo designs and models.\n  Source: https://www.presseportal.de/pm/17051/6388587\n- Vienna plans a 48 MW data centre whose heat could warm thousands of homes (Dunav.at)\n  STRABAG Real Estate and the Vienna Business Agency are planning a modular data centre in Seestadt Aspern with up to 48 MW grid connection, built in phases, and estimated by EcoAustria to trigger about 350 million euro of investment.\n  Why it matters: Another European project designing heat reuse in from the start, close to Energo's markets.\n  Source: https://dunav.at/bec-planira-data-centar-od-48-megavata-toplota-iz-servera-mogla-bi-grijati-12-700-domacinstava\n- Greece: new law requires data centres to use at least 60% renewables and pay host communities (Balkan Green Energy News)\n  A Greek law on the electricity market and data centres is now in force.\n  Why it matters: Another EU country setting energy conditions for data centres, adding to the rules clients must design for across Europe.\n  Source: https://balkangreenenergynews.com/greece-introduces-obligatory-payments-to-communities-hosting-data-centers\n\nFOR MARIJA\n\n- Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027\n- Study: LEED office used 31.7% less energy than a non-LEED office, but certification is not net zero\n- Squire Patton Boggs: what the Omnibus reform means for ESG reporting and due diligence\n- Fewer CSRD obligations, but more requests for ESG data\n- Freshfields: Omnibus I transposition uneven across Member States\n- BRE, USGBC, DGNB and others start work on rewarding responsible timber construction\n- UK FCA publishes final rules for ESG ratings providers\n- bremenports publishes its first sustainability report under the VSME standard\n\nFOR DANILO\n\n- Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027\n- ETS2: compensation rules for fuel consumers published in the Official Journal\n- EU exemption for F-gases in certain indoor monoblock heat pumps\n- EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition\n- Scotland's Passivhaus-equivalent standard criticised by housing bodies\n- Green plans a new data centre campus in Birr, Aargau\n- ASHRAE 62.1 IAQ procedure can cut HVAC energy by 20%\n- Kragujevac state data centre prepares space for a third supercomputer\n- Umbria: incentives to replace stoves and fireplaces with biomass or heat pumps\n- Thermal bridges under Italy's new minimum energy requirements\n- Portugal drafts rules requiring data centres to run on renewable energy\n- Case Green: indoor air quality becomes a building requirement\n- University of Belgrade Faculty of Mechanical Engineering: energy renovation of a building\n- Assoclima: school air conditioning plan should also cover ventilation\n- Poland wants ETS2 added to the ETS reform talks\n- France's tertiary decree: what to prepare for in 2027\n- Novi Sad: city energy efficiency plan\n- Spain multiplies energy savings credits for replacing boilers with heat pumps\n- New EU directives and the future of building renovation in Serbia\n- Data centre opposition reaches Switzerland\n- German data centres are not publishing energy and water data required by law\n- IEA: buildings could be at least 25% more energy efficient by 2035\n- Conto Termico 3.0 and BACS class B: what to check before choosing products\n- BRE, USGBC, DGNB and others start work on rewarding responsible timber construction\n- FIRE: PNRR funds for ESCo renovation of Italian public housing ran out before most applications were examined\n- Cortexa survey: most Italian designers see the Case Green delay as a missed opportunity\n- Cooling AI data centres: efficiency and continuity\n- Norway to limit data centre growth with a permit system\n- Frankfurt data centre waste heat to supply 1,100 homes by 2040\n- Designing envelopes and facades under Italy's new minimum requirements\n- Vienna plans a 48 MW data centre whose heat could warm thousands of homes\n- Graubünden opens first tender for industrial high-temperature heat pumps, up to 800,000 francs per project\n- Pančevo: former Azotara plant sold to a Dubai-linked firm, plan allows a data centre campus of up to 650 MW\n- Infomaniak and Gruyère Energie plan a 2.5 MW data centre in Bulle feeding district heating\n- Greece: new law requires data centres to use at least 60% renewables and pay host communities\n- Italy: MASE decree sets technical rules for small open-loop geothermal systems\n- Data centre heat for homes: Serbian outlet points to Kragujevac as a local example\n- Polish MEPs propose delaying ETS2 to 2031 or scrapping it\n\nCONTENT IDEAS\n\n- Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027\n  Angle: Seven weeks to the remote reading deadline: what Italian condominiums must check on their heat meters.\n  Channel: LinkedIn\n- Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027\n  Angle: CSRD reports will be checked against one EU assurance standard: what auditors will ask for, and how to have the data ready.\n  Channel: LinkedIn\n  Article outline:\n    * Introduce the consultation launched on 12 November on the draft EU standard for limited assurance of sustainability reporting.\n    * Explain the basis: CEAOB technical advice built on ISSA 5000, adapted to the EU legal framework, and limited assurance confirmed by Omnibus I.\n    * Cover what assurers would check: ESRS and EU Taxonomy as criteria, Taxonomy eligibility and alignment, digital tagging and third-party verification reports.\n    * Note the open question on timing (2027, 2028 or later) and the 18 January 2027 deadline for comments.\n    * End with what reporting companies should ask their advisers now about evidence and data trails, with Energo's view as a separate section.\n  Carousel outline:\n    * Slide 1: hook, 'Your CSRD report will be assured against one EU standard.'\n    * Slide 2: the Commission opened a consultation on the draft limited assurance standard.\n    * Slide 3: it is based on ISSA 5000, adapted by CEAOB for EU law.\n    * Slide 4: ESRS and the EU Taxonomy become the criteria assurers check.\n    * Slide 5: open question: mandatory from 2027, 2028 or later.\n    * Slide 6: comments close on 18 January 2027.\n    * Slide 7: call to action: check your Taxonomy evidence before the auditor does.\n- EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition\n  Angle: Italy has two months to answer Brussels on Case Green and the EED: what the renovation plan would set and what owners can do meanwhile.\n  Channel: LinkedIn\n  Article outline:\n    * Explain the two reasoned opinions sent on 1 October 2026: the missing draft building renovation plan under EPBD Article 3 and the partial transposition of the Energy Efficiency Directive.\n    * Set out the next step: Italy has two months to respond, after which the Commission can refer the cases to the EU Court of Justice.\n    * Recall what the plan must contain: the building stock, 2030, 2040 and 2050 renovation targets, policies and funding sources.\n    * Summarise the directive targets cited in the article: residential primary energy down 16% by 2030 and 20 to 22% by 2035, and minimum performance standards for the worst non-residential buildings.\n    * Close with Energo's view, written as a section: what owners and designers can prepare now regardless of the political dispute.\n  Carousel outline:\n    * Slide 1: hook, 'Brussels has given Italy two months on Case Green.'\n    * Slide 2: two reasoned opinions sent on 1 October 2026: EPBD renovation plan and EED transposition.\n    * Slide 3: what happens next: a reply within two months or a possible referral to the EU Court of Justice.\n    * Slide 4: what the national renovation plan has to set: targets for 2030, 2040, 2050 and funding.\n    * Slide 5: the residential target: minus 16% average primary energy by 2030.\n    * Slide 6: non-residential: minimum performance standards for the worst-performing buildings.\n    * Slide 7: call to action: ask us where your building stands before the rules land.\n- ASHRAE 62.1 IAQ procedure can cut HVAC energy by 20%\n  Angle: Ventilation by air quality, not only by rate: the ASHRAE 62.1 IAQ procedure and its energy savings.\n  Channel: newsletter\n- Study: LEED office used 31.7% less energy than a non-LEED office, but certification is not net zero\n  Angle: A certified office used about a third less energy, and still was not net zero.\n  Channel: newsletter\n- Thermal bridges under Italy's new minimum energy requirements\n  Angle: Thermal bridges under the new Italian minimum requirements: what changes in design checks.\n  Channel: LinkedIn\n- Case Green: indoor air quality becomes a building requirement\n  Angle: Insulate and ventilate: why the EPBD adds indoor air quality to renovation, and how to test it.\n  Channel: LinkedIn\n- Fewer CSRD obligations, but more requests for ESG data\n  Angle: Out of CSRD scope does not mean out of ESG data requests: banks and customers still ask.\n  Channel: LinkedIn\n- German data centres are not publishing energy and water data required by law\n  Angle: Data centre energy and water reporting is now a legal duty in Germany; what operators in Serbia and Italy should prepare before similar checks.\n  Channel: LinkedIn\n- IEA: buildings could be at least 25% more energy efficient by 2035\n  Angle: What a 25% global building efficiency goal means for owners in Serbia, Italy and Switzerland, and which measures get there.\n  Channel: newsletter\n- BRE, USGBC, DGNB and others start work on rewarding responsible timber construction\n  Angle: BREEAM, LEED and DGNB look at timber together: what it could mean for projects.\n  Channel: newsletter\n- Frankfurt data centre waste heat to supply 1,100 homes by 2040\n  Angle: From servers to radiators: how a Frankfurt data centre will heat 1,100 homes.\n  Channel: newsletter\n- bremenports publishes its first sustainability report under the VSME standard\n  Angle: A German port reports under VSME for the first time: what the voluntary SME standard looks like in practice.\n  Channel: newsletter\n  Article outline:\n    * Introduce bremenports' 2026 report, its tenth, and the switch to VSME.\n    * Explain the two modules it used, Basic and Comprehensive, and the period covered (2024 and 2025).\n    * Place VSME in context: the voluntary standard for SMEs that stay outside CSRD but still get ESG data requests.\n    * Close with Energo's view, written as a section: when an SME should start with the Basic Module.\n- Pančevo: former Azotara plant sold to a Dubai-linked firm, plan allows a data centre campus of up to 650 MW\n  Angle: A 650 MW data centre plan in Pančevo: the questions on water, power and heat that any Serbian data centre must answer.\n  Channel: LinkedIn\n  Article outline:\n    * Report the ownership change: Azotara Pančevo sold to Mileva Data Technologies, owned by Mileva FZCO from Dubai.\n    * Explain the planning frame: a first phase up to 69 MW on the existing substation and a second phase up to 650 MW needing a new one.\n    * Cover the local concerns raised about water, electricity, heating and environmental impact.\n    * Note what is not yet known: construction start, financing and grid infrastructure are not confirmed.\n    * Close with Energo's view, written as a section: the energy and cooling questions a project of this size must answer early.\n  Carousel outline:\n    * Slide 1: hook, 'A 650 MW data centre could rise on the Azotara site.'\n    * Slide 2: the plant now belongs to a Dubai-linked company.\n    * Slide 3: phase one: up to 69 MW on the existing substation.\n    * Slide 4: phase two: up to 650 MW with a new substation.\n    * Slide 5: open questions: water, power, heat and environment.\n    * Slide 6: call to action: building a data centre in Serbia? Start with the energy concept.\n- Infomaniak and Gruyère Energie plan a 2.5 MW data centre in Bulle feeding district heating\n  Angle: A Swiss data centre designed to heat a town: how heat reuse and waterless liquid cooling fit together.\n  Channel: LinkedIn\n  Article outline:\n    * Present the project: Infomaniak and Gruyère Energie, 2.5 MW IT power, 170 racks, about 1,200 m2 in Bulle.\n    * Explain the heat path: server heat raised by heat pumps into district heating, about 28 GWh a year, up to 7,500 t CO2 avoided against oil.\n    * Describe the cooling choice: a closed liquid system with no cooling towers, evaporation or extra water withdrawal.\n    * Give the timeline: permit display from 13 November, construction in the first half of 2027, operation in 2028.\n    * Close with Energo's view, written as a section: what owners should study early when planning heat reuse.\n  Carousel outline:\n    * Slide 1: hook, 'This data centre will heat a Swiss town.'\n    * Slide 2: 2.5 MW IT, 170 racks, Bulle, canton of Fribourg.\n    * Slide 3: heat pumps feed server heat into district heating: about 28 GWh a year.\n    * Slide 4: up to 7,500 t CO2 a year avoided compared with heating oil.\n    * Slide 5: closed liquid cooling: no cooling towers, no water withdrawal.\n    * Slide 6: operation planned for 2028.\n    * Slide 7: call to action: planning a data centre? Talk to us about heat reuse from day one.\n- Italy: MASE decree sets technical rules for small open-loop geothermal systems\n  Angle: Groundwater heat pumps in Italy finally have national rules: what designers must now document.\n  Channel: LinkedIn\n  Article outline:\n    * Introduce decree no. 364 of 11 November 2026 on small open-loop geothermal systems under 2 MW.\n    * List the technical requirements: well design, hydrogeological surveys, water quality protection and temperature monitoring.\n    * Explain the digital register and the technical working group that will set thresholds for simplified procedures.\n    * Link it to the April 2026 decree on closed-loop systems.\n    * Close with Energo's view, written as a section: when open-loop geothermal makes sense on a building project.\n  Carousel outline:\n    * Slide 1: hook, 'Italy now has rules for groundwater heat pumps.'\n    * Slide 2: decree no. 364 of 11 November 2026, systems under 2 MW.\n    * Slide 3: wells, hydrogeology and water quality must be documented.\n    * Slide 4: temperatures are monitored and systems recorded in a register.\n    * Slide 5: simplified procedures still to be set by a working group.\n    * Slide 6: call to action: considering geothermal? Ask us for a feasibility check.\n\nUS, AFRICA AND GLOBAL (SHORT)\n\n- ASHRAE 62.1 IAQ procedure can cut HVAC energy by 20%\n- IEA: buildings could be at least 25% more energy efficient by 2035"}, {"id": "2026-11-19", "date": "2026-11-19", "kind": "mid-week", "title": "Energo Intelligence: mid-week update, 19 November 2026", "item_ids": ["a4b51be1285c360d8ee295aad7811280a9654afa", "70ba60da12a0a6a870813ddb146d2432a1ec9c25", "b66b7ef00c1435126181cd374674d791c85d6978", "9c3ec2c4401e8c642b49e86b6fcb5a91a575c607", "0bc55058b68cd3de5fa4a6ba9dc617d69f043aaa", "774d3ac6a02b62559867f93ddd6b4dd97223260d", "c3ff8e545ed7fc8e5a098d48acbb545ff5ae3aef", "74f8caae205596293196a1e5a1ee6a19426faf2e", "d87355a94adf90618a980dc0e8c45391a832629b", "f8ed3219831ad9f1cd95a4dead6d82382ac0b0d5", "862f4478836ce787368bad9796c05048a10208a1", "8cb4f31c80510849f3a35eb3260181822813e41d", "bddf36713a58fdf209e82fb53a53a60ec6860b70", "7ef19c2720a172915527561d7dfbe66d0c771e77", "13367f3c4a5242496a42478b00180617281e6add", "0d463c4ca5712d250eda8fda9311df924c12d743", "5aa5fd21d92d5567af3d04460501f8c24cb9128e", "3b6db2e3cd2f7414dcd6a13e6a50902b31b0b3d0", "8149337600b9abf3e8c1d6ff0de01d0fdb6b14f6", "18dacf7909ebd8f117429aac37817fae061319c8", "0d463c4ca5712d250eda8fda9311df924c12
