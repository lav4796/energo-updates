d743", "b368b7d51b34aa72a4f2e84e41f6d0199385f694", "a64d5d733414d9d3e0e1a7cee50b4263f42088f1", "93ef1d3b44acf06f014269b83ba9e31cf134b6ea", "c3ff8e545ed7fc8e5a098d48acbb545ff5ae3aef", "8a4f13778bfb1c290b577ed295f137b0aeeb8f0b", "752c3a887f5ac22d0376cd3578b5f54455f5d309", "74f8caae205596293196a1e5a1ee6a19426faf2e", "c15848fa3fff7bb0cb7eb57cb22b48fb99679931", "774d3ac6a02b62559867f93ddd6b4dd97223260d", "d7a23be6b4e2c69c1774ef96e22c7e26b5ce5379", "52b15b25c5d82c9cf5d290482773f16ad1f21808"], "text": "Mid-week update: 135 items read on 19 November, 46 kept, 17 at relevance 2 or 3. Note: the weekly digest of 16 November and the mid-week update of 12 November were saved on the page but not emailed, because Gmail sending failed on those days.\n\nTOP 5 THIS WEEK\n- Italy has weeks left to send the EU its building renovation plan (QdS)\n  Italy has not sent the draft national building renovation plan required by Directive (EU) 2024/1275, which was due by 31 December 2025, and the final plan is due by 31 December 2026. The reasoned opinion of 1 October gave Italy two months, so the deadline falls in early December, after which the Commission can refer the case to the EU Court of Justice. Italy has also not completed transposition of the directive, which was due by 29 May 2026.\n  Why it matters: The renovation plan will set obligations, incentives and priorities for Italian buildings in the coming years; clients should expect rules to move quickly once it is filed.\n  Source: https://qds.it/case-green-inerzia-infrazioni-italia-arranca-un-mese-inviare-ue-piano-ristrutturazione\n- Italy: MASE issues new operating instructions for mandatory energy audits (ENEA - efficienza energetica)\n  Directorial Decree no. 293 of 5 November 2026 updates the operating instructions for energy audits under Legislative Decree 102/2014 and replaces earlier ministry clarifications and FAQs. It covers multi-site companies, sampling and clustering, identification of efficiency measures, performance indicators and the audits required of energy-intensive and gas-intensive companies. ENEA is to prepare guidelines for companies and auditors.\n  Why it matters: Changes how mandatory energy audits for Italian companies must be prepared; a service opening for Energo's engineering and testing teams.\n  Source: https://www.efficienzaenergetica.enea.it/vi-segnaliamo/diagnosi-energetiche-dal-mase-nuove-istruzioni-operative-per-le-imprese.html\n- VSME becomes law: Delegated Regulation (EU) 2026/1560 caps value chain data requests (Wall Street Italia)\n  Delegated Regulation (EU) 2026/1560, in force since 24 September 2026, sets the voluntary sustainability reporting standard for companies outside the CSRD. From financial years starting on or after 1 January 2027, companies under the CSRD may not ask value chain suppliers with up to 1,000 employees for more than the voluntary standard covers, and requests to micro companies with up to 10 employees are narrower still.\n  Why it matters: Defines what Energo's SME clients will be asked for by large customers and gives a clear scope for VSME reporting services.\n  Source: https://www.wallstreetitalia.com/esg-nuove-regole-ue-per-le-pmi-cosi-si-semplifica-la-sostenibilita-delle-imprese\n- GSE opens voluntary early exit from the Conto Energia for PV plants over 20 kW (Ingenio)\n  GSE has published the operating rules and public notice for a voluntary early exit from the Conto Energia. Owners of incentivised PV plants above 20 kW can give up the remaining incentives from 2028 in exchange for a ten-year payment, and must fully repower the plant by 2030. Non-binding expressions of interest run from 16 November to 16 December 2026 through the GSE customer portal, followed by a separate confirmation.\n  Why it matters: Owners of older PV plants on commercial and industrial buildings need a quick technical and economic check of repowering before 16 December; Energo can support the yield and module assessment.\n  Source: https://www.ingenio-web.it/articoli/fuoriuscita-anticipata-conto-energia-regole-gse\n- Case Green: MASE now waits for Parliament to move first on transposition (Staffetta Quotidiana)\n  Staffetta Quotidiana reports that the government, which had seemed ready to start transposing the Case Green directive, now appears to want Parliament to make the first move. The Commission has opened an infringement procedure against Italy.\n  Why it matters: Transposition in Italy is stalling again, so clients face longer uncertainty on future EPC and renovation obligations.\n  Source: https://www.staffettaonline.com/articolo.aspx?id=409191\n\nDEADLINES AND OPEN CONSULTATIONS (NEXT 6 MONTHS)\n- 2026-11-26: GBC Italia online seminar. GBC Italia online seminar on AI, BIM, digital twins and sustainability certification, 26 November\n- 2026-11-28: UNI 11337-7 public inquiry closes. UNI 11337-7 revision on BIM roles in final public inquiry until 28 November\n- 2026-12-01: Germany: green gas and heating oil quota bill due. Germany's Building Modernisation Law: what applies to heating replacements\n- 2026-12-01: Italy's two months to answer the reasoned opinions end. EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition\n- 2026-12-01: ENVI committee vote on the ETS reform. Polish MEPs propose delaying ETS2 to 2031 or scrapping it\n- 2026-12-16: Conto Energia early exit: expressions of interest close. GSE opens voluntary early exit from the Conto Energia for PV plants over 20 kW\n- 2026-12-31: Italy final national building renovation plan due. Italy has weeks left to send the EU its building renovation plan\n- 2027-01-01: Remote reading of heat meters required. Italy: remote reading required for heat meters and cost allocators in multi-unit buildings from 1 January 2027\n- 2027-01-01: National whole-life carbon roadmaps due. Whole-life carbon: national GWP roadmaps due by 1 January 2027\n- 2027-01-01: VSME value chain cap applies (financial years from). VSME becomes law: Delegated Regulation (EU) 2026/1560 caps value chain data requests\n- 2027-01-01: Germany: first GModG requirements apply. Germany: first parts of the building modernisation law apply from 1 January 2027\n- 2027-01-18: Consultation on the CSRD assurance standard closes. Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027\n- 2027-02-11: Swiss renovation funding: consultation closes. Switzerland proposes one renovation funding programme paid from the CO2 levy\n- 2027-02-15: EFRAG 2027 to 2029 agenda consultation closes. EFRAG SME Forum on 2 December and consultation on its 2027 to 2029 reporting agenda\n- 2027-02-15: EFRAG agenda consultation closes. EFRAG consults on its 2027 to 2029 sustainability reporting agenda\n- 2027-03-19: Omnibus I CSRD amendments: transposition deadline. Omnibus I: less than five months left to transpose the CSRD amendments\n- 2027-03-24: UK Future Homes Standard applies. UK Future Homes Standard: heat pumps and on-site renewables from 2027\n- 2027-04-26: Graubünden heat pump tender deadline. Graubünden opens first tender for industrial high-temperature heat pumps, up to 800,000 francs per project\n\nEU REGULATION AND ESG REPORTING\n- EFRAG SME Forum on 2 December and consultation on its 2027 to 2029 reporting agenda (EFRAG news)\n  EFRAG's third SME Forum of 2026 takes place online on 2 December, 13:30 to 14:25 CET, covering new translations of Voluntary Standard guidance and the digital template updated for Delegated Regulation (EU) 2026/1560. EFRAG will also present its Sustainability Reporting Agenda Consultation for 2027 to 2029, which is open until 15 February 2027.\n  Why it matters: A direct chance to follow and comment on the SME standard that Energo's smaller ESG reporting clients are likely to use.\n  Source: https://www.efrag.org/en/news-and-calendar/news/join-the-third-sme-forum-meeting-of-2026-2-december\n- EU authorises an F-gas exemption for commercial laundry equipment with heat pumps (EUR-Lex)\n  Commission Implementing Regulation (EU) 2026/2520 of 13 November 2026 authorises an exemption under the F-gas Regulation (EU) 2024/573 for the use of fluorinated greenhouse gases in certain commercial laundry equipment with heat pumps.\n  Why it matters: Another targeted F-gas exemption for heat pump equipment; relevant when specifying refrigerants in commercial projects.\n  Source: https://eur-lex.europa.eu/legal-content/EN/TXT?uri=CELEX%3A32026R2520\n  Thread, CSRD after Omnibus I: The VSME is now Delegated Regulation (EU) 2026/1560, with a value chain cap from financial years starting 1 January 2027; EFRAG consults on its 2027 to 2029 agenda until 15 February 2027.\n\nITALY, SERBIA, SWITZERLAND\n- Building bonuses 2027: rules already in law versus budget bill proposals (Edilizia.com)\n  The 2027 budget bill, A.C. 3174-bis, is before the Chamber's Budget Committee. Rules already in force set 30% for 2027, rising to 36% for a main home, while the bill proposes 36% as standard and 50% for owners of a main home. A spending cap of 96,000 euro at 50% equals a total deduction of 48,000 euro.\n  Why it matters: Clients planning 2027 renovations should budget with both scenarios until the bill passes.\n  Source: https://www.edilizia.com/guide/bonus-edilizi-2027\n- Emilia-Romagna opens a 7.63 million euro call for SME investment including energy efficiency (QualEnergia)\n  The Emilia-Romagna region's EuReCa Sviluppo Imprese call, with 7,630,000 euro, supports SME investments in development, digitalisation and diversification, while also promoting energy efficiency in companies and the regional energy supply chain.\n  Why it matters: A regional funding route for industrial clients' efficiency projects in Italy; check the call for eligible measures and dates.\n  Source: https://www.qualenergia.it/pro/articoli-pro/emilia-romagna-agevolazioni-imprese-efficienza-energetica-innovazione\n- UNI 11337-7 revision on BIM roles in final public inquiry until 28 November (Edilportale)\n  UNI has put the revision of UNI 11337-7, which defines professional roles in BIM, into final public inquiry, open to comments until 28 November 2026. It will replace UNI 11337-7:2018 and UNI/PdR 78:2020, raise the roles from four to six by adding BIM Tendering and BIMGIS Specialist, and rewrite access requirements and certification rules.\n  Why it matters: BIM role certification is used in Italian public tenders, so the change can affect how Energo's team qualifies for public projects.\n  Source: https://www.edilportale.com/news/2026/11/bim-news/uni-11337-7-le-nuove-figure-bim-in-inchiesta-pubblica_112765_75.html\n- Serbia: 41% of homes on district heating now pay by consumption, target 70% this season (Blic)\n  The Serbian district heating association says 41% of housing units have moved to billing by consumption, with a target of 70% during this heating season. In older buildings without individual meters, consumption is measured at the substation and split by each flat's heated area, and the main obstacle is old installations without individual metering.\n  Why it matters: Opens work on metering, heat cost allocation and renovation of building heating systems in Serbia.\n  Source: https://www.blic.rs/biznis/privreda/menja-se-obracun-grejanja-sta-naplata-po-potrosnji-znaci-za-stanare-starih-zgrada/5ls7ygz\n- SVIT Ostschweiz event: using data centre waste heat to heat buildings (LEADER Digital)\n  At the SVIT Ostschweiz IMMOment event in St. Gallen, about 60 real estate professionals heard talks on energy. Gravag Energie warned of higher price and supply risks for winter 2026/27, and RY3T presented RY3T One, small computing units installed in buildings so that their waste heat heats the building; its CEO said about 80% of data centres do not use their waste heat.\n  Why it matters: Swiss property managers are hearing about building-level heat reuse from computing, a topic where Energo can offer MEP and simulation input ahead of IMMO27.\n  Source: https://www.leaderdigital.ch/news/wenn-das-rechenzentrum-zur-heizung-wird-16876.html\n  Thread, Italy's transposition of the EPBD (Case Green): The two months Italy has to answer the reasoned opinions run out in early December and the final renovation plan is due by 31 December 2026, while MASE now appears to wait for Parliament to start transposition.\n  Thread, Italian building incentives for 2027: The budget bill (A.C. 3174-bis) is in the Chamber's Budget Committee, proposing 36% standard and 50% for main homes against 30% and 36% in current law. GSE's Conto Energia early exit window is open until 16 December.\n\nOTHER EUROPEAN COUNTRIES\n- Germany's Building Modernisation Law: what applies to heating replacements (Wirtschaftsjournal)\n  The former Buildings Energy Act is now the Building Modernisation Law, last amended in July 2026, and no longer contains the 65% renewable quota. New gas or oil heating installed in existing buildings after 29 July 2026 must cover a rising minimum share with biomethane, bio-oil or certain hydrogen from 2029, with alternatives such as solar thermal or heat recovery ventilation. The government must present a green gas and green heating oil quota law by 1 December 2026, and landlords and tenants split some network and CO2 costs from 2028.\n  Why it matters: Clarifies the German heating rules after the 65% rule was dropped; useful for comparing heating strategies across Energo's markets.\n  Source: https://wirtschaftsjournal.com/gebaeudeenergiegesetz-heizung\n  Thread, Heating rules across Europe: Germany's Building Modernisation Law now sets a stepped green fuel share for new fossil heating from 2029, and the EU added an F-gas exemption for commercial laundry heat pumps.\n\nCERTIFICATIONS\n- ASHRAE separates energy efficiency from operational carbon in Standard 90.1 (Facilitiesnet)\n  ASHRAE is separating energy efficiency from operational carbon goals: Standard 90.1 will keep setting efficiency requirements, while a separate aligned publication will help owners pursue operational emissions cuts. The article stresses controls integration, occupancy-based operation, benchmarking, sub-metering and data-driven maintenance.\n  Why it matters: A change in how Standard 90.1 is scoped matters for Energo's energy modelling and MEP design work that references it.\n  Source: https://www.facilitiesnet.com/hvac/article/ASHRAE-Standard-901-Charts-a-New-Course-for-Energy-Efficiency-Goals--21193\n- GBC Italia online seminar on AI, BIM, digital twins and sustainability certification, 26 November (Ingenio)\n  GBC Italia, supported by DAKU, holds a training seminar on 26 November 2026 from 14:30 to 17:30 on using artificial intelligence, BIM and digital twins together with environmental certification protocols. It is aimed at architects, engineers, surveyors and others in the construction chain, can be followed online and gives 3 professional training credits.\n  Why it matters: A low-cost way for the certification team to keep current on how GBC Italia sees digital tools in certified projects, with CFP credits.\n  Source: https://www.ingenio-web.it/articoli/intelligenza-artificiale-bim-digital-twin-convegno-gbc\n\nENGINEERING AND DATA CENTRES\n- Europe's data centre protests and how governments are responding (IR Insider)\n  After protesters entered a Microsoft data centre site in Amsterdam on 6 November, with 150 to 200 arrests, the Stop Dirty Data Centers movement of over 100 groups in 15 countries called for a moratorium. The EU's AI Continent Action Plan aims to triple data centres in five to seven years; Europe hosts about 3,400, 45% of them in Frankfurt, London, Amsterdam, Paris and Dublin. The Netherlands has barred new data centres or expansions in Amsterdam from 2025 to 2030.\n  Why it matters: Public and policy pressure on data centres is rising in Europe, which raises the value of efficiency, heat reuse and transparent reporting in new projects.\n  Source: https://www.irinsider.org/western-europe-/europeans-protested-data-centers-what-is-the-eu-doing-in-response\n- Harvard study: 403 large US data centres emitted more than Denmark in a year; COP31 adopts a data centre pledge (Danas)\n  A Harvard study in Nature Sustainability estimates that the 403 largest US data centres produced about 25.7 million tonnes of CO2 between May 2024 and April 2025, more than Denmark's annual emissions. At COP31 in Antalya a voluntary pledge was adopted for companies and countries to power data centres with clean energy and be more transparent about energy, water and emissions.\n  Why it matters: Pressure for transparent energy and water reporting on data centres keeps growing, which supports demand for metering, efficiency studies and heat reuse in Energo's data centre work.\n  Source: https://www.danas.rs/vesti/klimatske-promene/najveci-ai-data-centri-proizvedu-za-godinu-dana-vise-gasova-staklene-baste-nego-cela-danska\n  Thread, Data centres: energy, cooling and the grid: Pressure on data centres is rising: a Harvard study puts the 403 largest US sites above Denmark's emissions, COP31 adopted a voluntary clean power and transparency pledge, Loudoun County paused new applications and protest groups in 15 European countries call for a moratorium. Heat reuse keeps spreading.\n\nCONTENT IDEAS\n- Italy has weeks left to send the EU its building renovation plan (LinkedIn)\n  Angle: Italy's building renovation plan is due on 31 December: what it is and why it matters to owners.\n  Article outline:\n    * The deadlines: draft plan due by 31 December 2025, never sent; final plan due by 31 December 2026.\n    * The infringement: a reasoned opinion on 1 October with two months to comply, then a possible referral to the EU Court of Justice.\n    * What the plan does: it turns EPBD targets into national choices on obligations, incentives and priorities.\n    * The second gap: transposition of the directive, due by 29 May 2026, is still incomplete.\n    * What owners can do now: know their buildings' energy class and plan renovations rather than wait for the final rules.\n  Carousel outline:\n    * Slide 1: hook, 'Italy's Case Green plan is due on 31 December. It has not sent the draft.'\n    * Slide 2: the draft was due by 31 December 2025.\n    * Slide 3: the EU sent a reasoned opinion on 1 October with two months to comply.\n    * Slide 4: next step if nothing happens: possible referral to the EU Court of Justice.\n    * Slide 5: transposition of the directive, due 29 May 2026, is also incomplete.\n    * Slide 6: call to action: check your building's energy class now.\n- Italy: MASE issues new operating instructions for mandatory energy audits (LinkedIn)\n  Angle: New rules for Italian energy audits: what changes for multi-site and energy-intensive companies.\n  Article outline:\n    * What changed: Directorial Decree no. 293 of 5 November 2026 replaces earlier clarifications and FAQs on energy audits under Legislative Decree 102/2014.\n    * The main topics: multi-site companies, sampling and clustering, efficiency measures and performance indicators.\n    * Specific rules for energy-intensive and gas-intensive companies that use the audits to access relief.\n    * ENEA's role: controls, monitoring and new guidelines still to come.\n    * What companies should do: check whether their next audit follows the new instructions; Energo's audit approach can be written up as a section.\n  Carousel outline:\n    * Slide 1: hook, 'Italy has rewritten the instructions for mandatory energy audits.'\n    * Slide 2: Directorial Decree no. 293 of 5 November 2026 replaces older FAQs.\n    * Slide 3: multi-site companies: new rules on sampling and clustering.\n    * Slide 4: clearer rules on efficiency measures and performance indicators.\n    * Slide 5: energy-intensive and gas-intensive companies get specific instructions.\n    * Slide 6: ENEA will publish guidelines next.\n    * Slide 7: call to action: review your next audit plan now.\n- VSME becomes law: Delegated Regulation (EU) 2026/1560 caps value chain data requests (LinkedIn)\n  Angle: The value chain cap: what large clients can and cannot ask SMEs for from 2027.\n  Article outline:\n    * What the regulation is: Delegated Regulation (EU) 2026/1560, in force since 24 September 2026, the voluntary standard for companies outside the CSRD.\n    * The value chain cap: from financial years starting 1 January 2027, CSRD companies cannot ask suppliers with up to 1,000 employees for more than the standard covers.\n    * Micro companies with up to 10 employees: an even narrower set of data points.\n    * What this means for SMEs facing questionnaires from banks and customers.\n    * What to do: prepare one VSME report and use it to answer requests; Energo's reporting support can be described here.\n  Carousel outline:\n    * Slide 1: hook, 'From 2027 your big customers cannot ask you for unlimited ESG data.'\n    * Slide 2: the law: Delegated Regulation (EU) 2026/1560, in force since 24 September 2026.\n    * Slide 3: who it protects: suppliers with up to 1,000 employees.\n    * Slide 4: when: financial years starting on or after 1 January 2027.\n    * Slide 5: micro companies up to 10 employees get an even shorter list.\n    * Slide 6: call to action: build one VSME report and reuse it.\n- GSE opens voluntary early exit from the Conto Energia for PV plants over 20 kW (newsletter)\n  Angle: Leaving the Conto Energia early: what PV owners above 20 kW must decide by 16 December.\n  Article outline:\n    * What GSE opened: a voluntary early exit from the Conto Energia for incentivised PV plants above 20 kW.\n    * The trade: remaining incentives end from 2028, replaced by a ten-year payment, with full repowering required by 2030.\n    * The process: a non-binding expression of interest between 16 November and 16 December 2026, then a separate confirmation.\n    * What to check before applying: economic value, minimum producibility, module choice and timing of the works.\n    * What owners should do now: ask for a repowering feasibility check before the window closes.\n- Serbia: 41% of homes on district heating now pay by consumption, target 70% this season (LinkedIn)\n  Angle: Paying for heat by consumption in Serbia: why old buildings without meters lose out.\n  Article outline:\n    * The numbers: 41% of housing units on consumption billing, target 70% this season.\n    * How old buildings are billed: one meter at the substation, cost split by heated area.\n    * Why that matters: a flat's bill depends on the whole building, not its own use.\n    * The obstacle: old installations without individual meters.\n    * What building managers can ask: what it takes to add metering or allocators; Energo's MEP view can be added here.\n  Carousel outline:\n    * Slide 1: hook, 'Paying for heating by consumption? In older buildings, not quite.'\n    * Slide 2: 41% of Serbian homes on district heating already pay by consumption.\n    * Slide 3: the target is 70% this heating season.\n    * Slide 4: old buildings measure heat for the whole building.\n    * Slide 5: the bill is split by heated area, not by each flat's use.\n    * Slide 6: call to action: ask what individual metering would take in your building.\n- ASHRAE separates energy efficiency from operational carbon in Standard 90.1 (newsletter)\n  Angle: ASHRAE 90.1 splits efficiency from carbon: what it could mean for energy modelling.\n  Article outline:\n    * The change: ASHRAE is separating energy efficiency requirements from operational carbon goals.\n    * Standard 90.1 keeps the efficiency role; a separate aligned publication will address operational emissions.\n    * The practical levers named: controls integration, occupancy-based operation and grid-responsive energy use.\n    * Benchmarking, sub-metering and data-driven maintenance as tools to find waste.\n    * What project teams should ask: how the split may affect their energy modelling; Energo's modelling view can be added as a section.\n"}, {"id": "2026-11-23", "date": "2026-11-23", "kind": "weekly", "title": "Energo Intelligence: week of 23 November 2026", "item_ids": ["61d3ed5a2a76e852ac5dbc2c94df4ae94585dc45", "d87355a94adf90618a980dc0e8c45391a832629b", "7ef19c2720a172915527561d7dfbe66d0c771e77", "9c3ec2c4401e8c642b49e86b6fcb5a91a575c607", "70ba60da12a0a6a870813ddb146d2432a1ec9c25", "b66b7ef00c1435126181cd374674d791c85d6978", "0d463c4ca5712d250eda8fda9311df924c12d743", "c658b75b4fd22ae47f9dbbd7c3bdab0d04c4038d", "98e3e34a4487c11c572919897635c480d2e09a27", "eaf2e5bef6644b961f80b6d3828a70876a940103", "87f36c76b375de70153f189d4182722540c466d9", "29cfce8a4a089591b56a5a473b436b4844df8bdb", "b368b7d51b34aa72a4f2e84e41f6d0199385f694", "0bc55058b68cd3de5fa4a6ba9dc617d69f043aaa", "a4b51be1285c360d8ee295aad7811280a9654afa", "6f520f2ed184564ec6c8caedd13ec9a22601f8b0", "81b05a378e1318cdb8fd42ce45335cef7ed83c64", "1050184d7541fea307ae16526c48b0c840069a78", "8c42f65ec74909c0b1b27f43ebf39ad72abf661b", "a64d5d733414d9d3e0e1a7cee50b4263f42088f1", "bac02cac5e06c7d894d129ee8d305576a8ea0938", "08e4014f1ae8c3bbca88cd3abf5d6d8179977289", "93ef1d3b44acf06f014269b83ba9e31cf134b6ea", "c3ff8e545ed7fc8e5a098d48acbb545ff5ae3aef", "5a295d642f4fd25872d5b98b1c928e0216532aab", "8a4f13778bfb1c290b577ed295f137b0aeeb8f0b", "a38c60890dad92d90fee1c7c552595cd6d55f925", "f86e06ad24d629b8ab826dcf53eb27e1ec1e4e68", "18dacf7909ebd8f117429aac37817fae061319c8", "c9895bb356acfb6343518d7cf5c61ea9c4099b30", "9c98a8b145edd2e136389d4e50589e4538f5f5bf", "f8ed3219831ad9f1cd95a4dead6d82382ac0b0d5", "93094c878661668fd0a5458237438561f9cec4c0", "74f8caae205596293196a1e5a1ee6a19426faf2e", "9322acd0bf503897aab41e773623b98f22a13a6a", "edc3f6413b2b2b880b92a97998cb50d9ea53cc03", "208cad7b648b42baff2688157e2d289559077adb", "774d3ac6a02b62559867f93ddd6b4dd97223260d", "10ec27dae9acfb40a2507d4b85871c5ef0b9fd4f", "68dd4a59e365cf755cfa686b1005bc7f71d77c6e", "395bf7b42013ae555765b21b07097a57df760bfa", "abaccc676407c8a38fe2d90c296a244cc0fadde1", "56e9a91304e8e3916939834462ba53f7b471d2bf", "752c3a887f5ac22d0376cd3578b5f54455f5d309", "2bb9ec18e29adf0d263a3ce226c56185b0836a27", "559bba23d3d145f4882f902ec38423afb4ff3e61", "d7a23be6b4e2c69c1774ef96e22c7e26b5ce5379", "c15848fa3fff7bb0cb7eb57cb22b48fb99679931", "52b15b25c5d82c9cf5d290482773f16ad1f21808"], "text": "Energo Intelligence: week of 23 November 2026\n\n49 items with relevance 2 or 3 processed in the last 7 days (163 new items read today, 63 kept).\n\nTOP 5 THIS WEEK\n\n- SFDR 2.0: Parliament and Council reach provisional agreement on three fund categories (Global Regulation Tomorrow)\n  On 19 November 2026 the Council and Parliament reached a provisional deal on the revised Sustainable Finance Disclosure Regulation, with three product categories: sustainable, transition and ESG basics.\n  Why it matters: Real estate fund managers will need to show which category their products fit and back it with emissions and Taxonomy data, which drives demand for building-level ESG reporting, EPC and energy data.\n  Source: https://www.regulationtomorrow.com/2026/11/co-legislators-reach-agreement-on-sfdr-2-0\n\n- EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition (éNordEst)\n  On 1 October 2026 the Commission sent Italy a reasoned opinion for not submitting the draft national building renovation plan required by Article 3 of the EPBD (Directive 2024/1275), and a second one for only partly transposing the Energy Efficiency Directive.\n  Why it matters: The renovation plan sets Italy's 2030, 2040 and 2050 targets and funding routes, so the delay keeps clients without a clear renovation trajectory while EU pressure grows.\n  Source: https://www.enordest.it/2026/11/15/case-green-leuropa-mette-in-mora-due-volte-litalia\n\n- Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027 (ESG Today)\n  The Commission has opened a consultation on draft standards for limited assurance of sustainability reporting under the CSRD, prepared with technical advice from CEAOB and based on ISSA 5000 with EU adaptations.\n  Why it matters: Clients reporting under CSRD will be assured against these rules, so the evidence trail for Energo's ESG and Taxonomy work has to meet them.\n  Source: https://www.esgtoday.com/eu-commission-releases-draft-sustainability-reporting-assurance-standards\n\n- GSE opens voluntary early exit from the Conto Energia for PV plants over 20 kW (Ingenio)\n  GSE has published the operating rules and public notice for a voluntary early exit from the Conto Energia.\n  Why it matters: Owners of older PV plants on commercial and industrial buildings need a quick technical and economic check of repowering before 16 December; Energo can support the yield and module assessment.\n  Source: https://www.ingenio-web.it/articoli/fuoriuscita-anticipata-conto-energia-regole-gse\n\n- Italy: MASE issues new operating instructions for mandatory energy audits (ENEA - efficienza energetica)\n  Directorial Decree no. 293 of 5 November 2026 updates the operating instructions for energy audits under Legislative Decree 102/2014 and replaces earlier ministry clarifications and FAQs.\n  Why it matters: Changes how mandatory energy audits for Italian companies must be prepared; a service opening for Energo's engineering and testing teams.\n  Source: https://www.efficienzaenergetica.enea.it/vi-segnaliamo/diagnosi-energetiche-dal-mase-nuove-istruzioni-operative-per-le-imprese.html\n\nDEADLINES AND OPEN CONSULTATIONS (NEXT 6 MONTHS)\n\n- 26 November 2026: GBC Italia online seminar on AI, BIM and certification\n- 28 November 2026: UNI 11337-7 (BIM roles) public inquiry closes\n- 30 November 2026: Energy Community Ministerial Council on guarantees of origin\n- Early December 2026: Italy's two months to answer the EPBD and EED reasoned opinions end\n- 1 December 2026: Germany: green gas and heating oil quota bill due\n- 1 December 2026: European Parliament environment committee votes on the ETS reform\n- 2 December 2026: EFRAG SME Forum (online)\n- 16 December 2026: Conto Energia early exit: expressions of interest close\n- 31 December 2026: Italy's final national building renovation plan due\n- 1 January 2027: Italy: remote reading required for heat meters and cost allocators\n- 1 January 2027: National whole-life carbon (GWP) roadmaps due\n- 1 January 2027: Germany: first Building Modernisation Law requirements apply\n- 1 January 2027: VSME value chain cap applies (financial years from this date)\n- 18 January 2027: Consultation on the EU CSRD limited assurance standard closes\n- 19 January 2027: EFRAG consultation on the ISSB nature-related statement closes\n- 11 February 2027: Swiss renovation funding consultation closes\n- 15 February 2027: EFRAG 2027 to 2029 agenda consultation closes\n- 19 March 2027: Omnibus I CSRD amendments: transposition deadline\n- 24 March 2027: UK Future Homes Standard applies\n- 26 April 2027: Graubünden high-temperature heat pump tender closes\n\nEU REGULATION AND ESG REPORTING\n\n- VSME becomes law: Delegated Regulation (EU) 2026/1560 caps value chain data requests (Wall Street Italia)\n  Delegated Regulation (EU) 2026/1560, in force since 24 September 2026, sets the voluntary sustainability reporting standard for companies outside the CSRD. From financial years starting on or after 1 January 2027, companies under the CSRD may not ask value chain suppliers with up to 1,000 employees for more than the voluntary standard covers, and requests to micro companies with up to 10 employees are narrower still.\n  Why it matters: Defines what Energo's SME clients will be asked for by large customers and gives a clear scope for VSME reporting services.\n  Source: https://www.wallstreetitalia.com/esg-nuove-regole-ue-per-le-pmi-cosi-si-semplifica-la-sostenibilita-delle-imprese\n\n- EFRAG SME Forum on 2 December and consultation on its 2027 to 2029 reporting agenda (EFRAG news)\n  EFRAG's third SME Forum of 2026 takes place online on 2 December, 13:30 to 14:25 CET, covering new translations of Voluntary Standard guidance and the digital template updated for Delegated Regulation (EU) 2026/1560.\n  Why it matters: A direct chance to follow and comment on the SME standard that Energo's smaller ESG reporting clients are likely to use.\n  Source: https://www.efrag.org/en/news-and-calendar/news/join-the-third-sme-forum-meeting-of-2026-2-december\n\n- EFRAG consults on its draft comment letter on the ISSB nature-related disclosures statement (EFRAG news)\n  EFRAG has published a draft comment letter on the ISSB's exposure draft Practice Statement on nature-related disclosures, focusing on interoperability with the ESRS. Its public survey runs from 20 November 2026 to 19 January 2027, with workshops on 16 and 17 December 2026.\n  Why it matters: Signals where nature-related reporting is heading for companies reporting under ESRS or ISSB, which Energo's ESG reporting clients may need to prepare for.\n  Source: https://www.efrag.org/en/news-and-calendar/news/efrag-publishes-draft-comment-letter-and-launches-public-consultation-on-the-issbs-naturerelated\n\n- PwC: revised ESRS give companies more scope for a targeted double materiality assessment (PwC Nederland)\n  PwC Netherlands writes that the revised ESRS give companies more room to target their double materiality assessment.\n  Why it matters: A more targeted materiality assessment changes how Energo scopes ESG reporting work for clients.\n  Source: https://www.pwc.nl/en/insights-and-publications/themes/sustainability/revised-esrs-give-companies-more-scope-for-a-targeted-dma.html\n\n- CSRD in 2027 for Italian companies: narrower scope and revised ESRS (Namirial Corporate)\n  A Namirial briefing says Omnibus I narrowed the companies covered by the CSRD, and the revised ESRS were formalised in Delegated Regulation (EU) 2026/1563, simplifying technical reporting requirements.\n  Why it matters: Helps Energo explain to Italian clients which reporting duties apply from 2027 and which standards version to use.\n  Source: https://focus.namirial.com/it/direttiva-csrd-2027-novita-per-le-imprese\n\n- bremenports publishes its first sustainability report under the VSME standard (American Journal of Transportation)\n  Port company bremenports has published its 2026 sustainability report, covering 2024 and 2025, for the first time under the EU Voluntary Sustainability Reporting Standard for SMEs (VSME).\n  Why it matters: A real example of a public-sector company switching to VSME, useful when advising SMEs and suppliers that face ESG data requests from banks and customers.\n  Source: https://www.ajot.com/news/bremenports-publishes-new-sustainability-report-for-the-first-time-in-accordance-with-the-european-vsme-standard\n\n- EU endorses Antalya Compact to cut buildings' energy intensity by at least 25% by 2035 (European Commission Energy news)\n  At COP31 the EU endorsed the Antalya Compact for Energy Efficient Buildings, backed by 24 countries, which aims to cut buildings' energy use per square metre by at least 25% by 2035 against 2020 and to speed up electrification.\n  Why it matters: Adds an international reference point for energy intensity targets that clients may cite in renovation and decarbonisation plans.\n  Source: https://energy.ec.europa.eu/news/eu-backs-global-compact-cut-energy-bills-and-emissions-buildings-2026-11-20_en\n\n- EU authorises an F-gas exemption for commercial laundry equipment with heat pumps (EUR-Lex)\n  Commission Implementing Regulation (EU) 2026/2520 of 13 November 2026 authorises an exemption under the F-gas Regulation (EU) 2024/573 for the use of fluorinated greenhouse gases in certain commercial laundry equipment with heat pumps.\n  Why it matters: Another targeted F-gas exemption for heat pump equipment; relevant when specifying refrigerants in commercial projects.\n  Source: https://eur-lex.europa.eu/legal-content/EN/TXT?uri=CELEX%3A32026R2520\nThread, SFDR 2.0 and real estate funds: On 19 November 2026 the Council and Parliament reached a provisional agreement on SFDR 2.0, with three product categories (sustainable, transition, ESG basics) and at least 70% of a product's investments aligned with its category. Transition products can hold fossil fuel companies only if they put at least 20% of capex into Taxonomy-aligned activities and have a time-bound emissions plan. After formal adoption and publication, the rules apply two years later.\nThread, CSRD after Omnibus I: Omnibus I (Directive (EU) 2026/470) narrowed the CSRD to groups above 1,000 employees and 450 million euro turnover, with transposition due by March 2027, and the revised ESRS were formalised in Delegated Regulation (EU) 2026/1563. The voluntary SME standard is Delegated Regulation (EU) 2026/1560, capping value chain data requests from financial years starting 1 January 2027. Open consultations: the Commission's draft limited assurance standard until 18 January 2027, EFRAG's draft comment letter on the ISSB nature statement until 19 January 2027, and EFRAG's 2027 to 2029 agenda until 15 February 2027.\n\nITALY, SERBIA, SWITZERLAND\n\n- Case Green: MASE now waits for Parliament to move first on transposition (Staffetta Quotidiana)\n  Staffetta Quotidiana reports that the government, which had seemed ready to start transposing the Case Green directive, now appears to want Parliament to make the first move.\n  Why it matters: Transposition in Italy is stalling again, so clients face longer uncertainty on future EPC and renovation obligations.\n  Source: https://www.staffettaonline.com/articolo.aspx?id=409191\n\n- Italy has weeks left to send the EU its building renovation plan (QdS)\n  Italy has not sent the draft national building renovation plan required by Directive (EU) 2024/1275, which was due by 31 December 2025, and the final plan is due by 31 December 2026.\n  Why it matters: The renovation plan will set obligations, incentives and priorities for Italian buildings in the coming years; clients should expect rules to move quickly once it is filed.\n  Source: https://qds.it/case-green-inerzia-infrazioni-italia-arranca-un-mese-inviare-ue-piano-ristrutturazione\n\n- Commission opens infringement against Italy over ecodesign and energy label market surveillance (European Commission Energy news)\n  In its November infringement package the Commission sent Italy a letter of formal notice for not ensuring effective market surveillance of ecodesign and energy labelling rules, noting some provinces or regions where surveillance does not appear to be active.\n  Why it matters: Weak surveillance means non-compliant equipment can reach Italian projects, so specifications and commissioning checks matter more.\n  Source: https://energy.ec.europa.eu/news/november-infringements-package-key-decisions-energy-2026-11-19_en\n\n- ENEA and Milan Metropolitan City launch Deciwatt, a free one-stop shop for building renovation (ENEA-media)\n  Deciwatt is a free digital one-stop shop from Milan Metropolitan City with ENEA support that estimates a building's energy use and simulates renovation scenarios.\n  Why it matters: Public tools like this create first contact with owners considering renovation; Energo can follow with detailed audits, modelling and design.\n  Source: https://www.media.enea.it/comunicati-e-news/archivio-anni/anno-2026/energia-enea-presenta-lo-sportello-digitale-deciwatt-per-lefficienza-degli-edifici.html\n\n- CAM 2025: how the new Italian green procurement criteria handle LCA and LCC (Ingenio)\n  An Ingenio guide explains the minimum environmental criteria (CAM) of Ministerial Decree 24/11/2025, in force since 2 February 2026, which replaces DM 256/2022 except for some projects validated before that date.\n  Why it matters: Public projects in Italy now need LCA and LCC work under CAM, a direct opening for Energo's LCA services.\n  Source: https://www.ingenio-web.it/articoli/cam-2025-guida-operativa-a-lca-e-lcc-per-edifici-e-opere-di-ingegneria-civile\n\n- Italy: MASE decree sets technical rules for small open-loop geothermal systems (Ingenio)\n  MASE has published decree no. 364 of 11 November 2026, which sets requirements for small local open-loop geothermal systems under 2 MW, including groundwater heat exchange for building heating and cooling.\n  Why it matters: Clarifies the permitting and design rules for groundwater heat pump systems in Italy, which affects HVAC concepts on projects that consider them.\n  Source: https://www.ingenio-web.it/articoli/geotermia-circuito-aperto-decreto-mase-pozzi-monitoraggio\n\n- Building bonuses 2027: rules already in law versus budget bill proposals (Edilizia.com)\n  The 2027 budget bill, A.C. 3174-bis, is before the Chamber's Budget Committee.\n  Why it matters: Clients planning 2027 renovations should budget with both scenarios until the bill passes.\n  Source: https://www.edilizia.com/guide/bonus-edilizi-2027\n\n- Ance asks Parliament to soften Superbonus credit spreading and the new ecobonus limits (Edilportale)\n  In a hearing on the 2027 budget bill, builders' association Ance welcomed the extension of the 50% and 36% rates but contested two measures.\n  Why it matters: The final ecobonus limits will decide how much deep renovation in Italian condominiums is worth to clients in 2027.\n  Source: https://www.edilportale.com/news/2026/11/normativa/manovra-2027-le-richieste-ance-su-superbonus-ed-ecobonus_112727_15.html\n\n- FIRE: PNRR funds for ESCo renovation of Italian public housing ran out before most applications were examined (PMI.it)\n  According to FIRE's analysis of GSE data, PNRR measure M7-I17 for public housing admitted 124 of 286 applications, worth 1.57 billion euro in incentives, and left 147 unexamined because funds ran out.\n  Why it matters: Shows that demand for energy service contracts in Italy outstrips funding, and that measurement and verification of savings is a recurring barrier.\n  Source: https://www.pmi.it/economia/green-economy/502381/contratti-epc-servizi-energetici-pa.html\n\n- Emilia-Romagna opens a 7.63 million euro call for SME investment including energy efficiency (QualEnergia)\n  The Emilia-Romagna region's EuReCa Sviluppo Imprese call, with 7,630,000 euro, supports SME investments in development, digitalisation and diversification, while also promoting energy efficiency in companies and the regional energy supply chain.\n  Why it matters: A regional funding route for industrial clients' efficiency projects in Italy; check the call for eligible measures and dates.\n  Source: https://www.qualenergia.it/pro/articoli-pro/emilia-romagna-agevolazioni-imprese-efficienza-energetica-innovazione\n\n- UNI 11337-7 revision on BIM roles in final public inquiry until 28 November (Edilportale)\n  UNI has put the revision of UNI 11337-7, which defines professional roles in BIM, into final public inquiry, open to comments until 28 November 2026.\n  Why it matters: BIM role certification is used in Italian public tenders, so the change can affect how Energo's team qualifies for public projects.\n  Source: https://www.edilportale.com/news/2026/11/bim-news/uni-11337-7-le-nuove-figure-bim-in-inchiesta-pubblica_112765_75.html\n\n- EU prepares to recognise guarantees of origin from Energy Community countries (Energetski portal)\n  A framework for mutual recognition of renewable electricity guarantees of origin between the EU and Energy Community countries, prepared with the European Commission, is due to be considered at the Energy Community Ministerial Council on 30 November.\n  Why it matters: Recognised guarantees of origin would help Serbian clients document renewable electricity in ESG reports and certifications.\n  Source: https://energetskiportal.rs/eu-priprema-priznavanje-garancija-porekla-zelene-struje-iz-regiona\n\n- Serbia: 41% of homes on district heating now pay by consumption, target 70% this season (Blic)\n  The Serbian district heating association says 41% of housing units have moved to billing by consumption, with a target of 70% during this heating season.\n  Why it matters: Opens work on metering, heat cost allocation and renovation of building heating systems in Serbia.\n  Source: https://www.blic.rs/biznis/privreda/menja-se-obracun-grejanja-sta-naplata-po-potrosnji-znaci-za-stanare-starih-zgrada/5ls7ygz\n\n- VSE and Deloitte study: data centres could use up to 10% of Swiss electricity by 2050 (Netzwoche)\n  A Deloitte study for the Swiss electricity association VSE estimates Swiss data centres could use 2.5 to 7 TWh a year by 2050, up to 10% of expected demand, against 3.6% in 2024.\n  Why it matters: Heat reuse and grid limits are becoming planning conditions for Swiss data centres, which is where MEP design, energy modelling and CFD for cooling and heat recovery come in.\n  Source: https://www.netzwoche.ch/news/2026-11-20/rechenzentren-koennten-2050-ein-zehntel-des-schweizer-stroms-verbrauchen\n\n- Green data centres in Dielsdorf start heating homes near Zurich, up to 11,500 households planned (Trending Topics)\n  Energie 360 has put a new energy centre into operation on the Green data centre campus in Dielsdorf, which feeds server waste heat into a new district heating network; the first flats are now heated this way.\n  Why it matters: A working Swiss example of data centre heat reuse at district scale, useful as a reference when Energo designs or reviews cooling and heat recovery for data centres and district heating links.\n  Source: https://www.trendingtopics.eu/green-rechenzentren-abwaerme-dielsdorf\n\n- Graubünden opens first tender for industrial high-temperature heat pumps, up to 800,000 francs per project (Nau)\n  The canton of Graubünden has opened its first competitive tender under its climate protection and innovation law for industrial high-temperature heat pumps producing process heat.\n  Why it matters: A Swiss funding route for industrial heat pump projects that need feasibility and MEP design work.\n  Source: https://www.nau.ch/ort/chur/kanton-graubunden-kanton-fordert-warmepumpen-mit-bis-zu-800000-franken-67201338\n\n- 4th Swiss symposium on grey emissions in construction in Bern (Nachhaltigleben.ch)\n  Nachhaltigleben.ch lists the 4th Swiss symposium on grey (embodied) emissions in the building sector, held in Bern.\n  Why it matters: A meeting point for the Swiss embodied carbon community, relevant to Energo's LCA work in Switzerland.\n  Source: https://www.nachhaltigleben.ch/events-veranstaltungen/4193-4-schweizer-symposium-graue-emissionen-im-bausektor\nThread, Italy's transposition of the EPBD (Case Green): On 1 October 2026 the Commission sent Italy two reasoned opinions, for the missing draft national building renovation plan and for partial transposition of the Energy Efficiency Directive; the two months run out in early December, and the final renovation plan is due by 31 December 2026. Transposition of the directive, due by 29 May 2026, is still incomplete, and MASE now appears to wait for Parliament to move first. Opposition parties, designers and industry groups keep pressing for faster action.\nThread, Italian building incentives for 2027: The 2027 budget bill (A.C. 3174-bis, in the Chamber's Budget Committee) proposes 36% as the standard rate and 50% for main homes with a cap of 96,000 euro per unit, against 30% and 36% in current law, and drops the return of the ecobonus to 65%. Ance, engineers and architects ask Parliament to soften Article 37 on the last Superbonus credits, and the Conto Termico 3.0 is oversubscribed. GSE has opened a voluntary early exit from the Conto Energia for PV plants over 20 kW, with expressions of interest until 16 December 2026.\n\nOTHER EUROPEAN COUNTRIES\n\n- Spain approves decree-law transposing ETS2 for buildings and road transport (RUSSPAIN.com)\n  Spain's Council of Ministers approved a decree-law on 20 November 2026 that completes transposition of the recent EU emissions trading reforms, including the separate ETS2 for fuels used in buildings and road transport.\n  Why it matters: Confirms carbon pricing on heating fuels is moving into national law, which strengthens the cost case for heat pumps and renovation that Energo designs.\n  Source: https://russpain.com/news/spain-approves-ets2-carbon-market-for-buildings-and-road-transport-122756\n\n- Polish MEPs propose delaying ETS2 to 2031 or scrapping it (UA.NEWS)\n  Polish MEPs have tabled amendments to the EU emissions trading reform to delay ETS2, which covers building heating and road transport fuels, from 2028 to 2031 or remove it.\n  Why it matters: A further ETS2 delay would change the heating cost outlook clients use to justify building decarbonisation.\n  Source: https://ua.news/en/world/pols-ki-ievrodeputati-zaproponuvali-vidklasti-ets2-do-2031-roku-rmf24\n\n- Germany's Building Modernisation Law: new gas heating needs 10% bio share from 2029 (Netz Trends)\n  Germany's Building Modernisation Law (GModG), passed by the Bundestag on 10 July 2026, replaced the 65% renewable rule with a rising bio-fuel share.\n  Why it matters: Clarifies the heating rules German owners will plan around, and the comparison point for heat pump decisions in clients' portfolios.\n  Source: https://www.netz-trends.de/heizungsgesetz-biotreppe-gasheizung-2029\n\n- Germany's Building Modernisation Law: what applies to heating replacements (Wirtschaftsjournal)\n  The former Buildings Energy Act is now the Building Modernisation Law, last amended in July 2026, and no longer contains the 65% renewable quota.\n  Why it matters: Clarifies the German heating rules after the 65% rule was dropped; useful for comparing heating strategies across Energo's markets.\n  Source: https://wirtschaftsjournal.com/gebaeudeenergiegesetz-heizung\nThread, ETS2: carbon price on building heating: The carbon price on fuels for building heating and road transport starts in 2028 instead of 2027, and compensation rules for fuel consumers are in the Official Journal. Spain approved a decree-law on 20 November 2026 transposing ETS2, which still needs parliamentary validation, while Polish MEPs push to delay it to 2031 or scrap it; the environment committee votes on the ETS reform on 1 December.\nThread, Heating rules across Europe: Germany dropped its 65% renewable rule: under the Building Modernisation Law, new fossil heating installed in existing buildings after 29 July 2026 must use a rising share of green fuels from 2029, and a green gas quota bill is due by 1 December 2026. Liechtenstein is easing heat pump permits, France is shifting renovation aid toward energy savings certificates, Spain multiplies savings credits for heat pumps, the UK Future Homes Standard moves new homes to heat pumps from March 2027 and Graubünden has a tender for industrial high-temperature heat pumps until 26 April 2027. The EU has authorised F-gas exemptions for some indoor monoblock heat pumps and for commercial laundry equipment with heat pumps.\n\nCERTIFICATIONS\n\n- Vista Ostuni hotel in a 14th-century building earns LEED Gold (Ostuni News)\n  Vista Ostuni, a five-star hotel in the former Manifattura Tabacchi of Ostuni, a 14th-century building, has achieved LEED BD+C Gold in the hospitality category.\n  Why it matters: Shows LEED being used on historic Italian hospitality conversions, a segment where Energo can offer certification support.\n  Source: https://ostuninews.it/vista-ostuni-conquista-la-certificazione-leed-gold-architettura-e-sostenibilita-al-centro-del-progetto\n\n- Naples student residence Ibrido Student aims for LEED Gold in spring 2027 (Il Mattino)\n  The Ibrido Student residence of Bridge Towers University in the Centro Direzionale of Naples opened on 4 November with its first 184 students.\n  Why it matters: Student housing in southern Italy is using LEED as a quality signal, a market Energo can target for certification.\n  Source: https://www.ilmattino.it/napoli/cronaca/edifici_sostenibili_leed_ibrido_student_da_la_spinta_studentato_centro_direzionale-9903030.html\n\n- DGNB presents its new 2026 system for existing districts (myDGNB)\n  DGNB has released a 2026 version of its certification system for existing districts, aimed at owners, companies, municipalities and redevelopment bodies assessing and transforming existing quarters.\n  Why it matters: A new DGNB scheme for existing districts is relevant for Energo's DGNB work on large existing sites.\n  Source: https://my.dgnb.de/de/events/einblick-das-neue-dgnb-system-fuer-quartiere-mit-stimmen-aus-der-praxis-1\n\n- GBC Italia online seminar on AI, BIM, digital twins and sustainability certification, 26 November (Ingenio)\n  GBC Italia, supported by DAKU, holds a training seminar on 26 November 2026 from 14:30 to 17:30 on using artificial intelligence, BIM and digital twins together with environmental certification protocols.\n  Why it matters: A low-cost way for the certification team to keep current on how GBC Italia sees digital tools in certified projects, with CFP credits.\n  Source: https://www.ingenio-web.it/articoli/intelligenza-artificiale-bim-digital-twin-convegno-gbc\n\nENGINEERING AND DATA CENTRES\n\n- EU data centre rating scheme: A to G labels for PUE and WUE from 15 August 2027 (Legal 500)\n  A Legal 500 briefing summarises the Commission's June 2026 roadmap on digitalisation and AI in energy and its September 2026 proposal for a common EU rating scheme for data centres with installed IT power of 500 kW or more.\n  Why it matters: Operators will be rated publicly on PUE, WUE and heat reuse, so accurate metering, efficiency design and verified data become a commercial issue for data centre clients.\n  Source: https://www.legal500.com/intelligence/european-union/energy-and-natural-resources/data-centre-energy-efficiency-the-eus-digital-energy-roadmap\n\n- Spain sets new rules for data centres: 80% renewable power and efficiency limits (B92)\n  Spain's government has adopted rules requiring data centres to source 80% of their electricity from renewables and to meet water and energy efficiency standards, with temporary limits on water and power use until final EU criteria are set.\n  Why it matters: Another EU country is turning efficiency and renewable sourcing into conditions for data centres, which raises demand for efficiency design, measurement and reporting.\n  Source: https://www.b92.net/biz/svet/vesti/286943/nema-vise-rasipanja-struje-spanija-uvodi-drakonske-mere-za-data-centre/vest\n\n- UK Data Centre Covenant allows temporary on-site power for strategic data centres (ET Datacenters)\n  The UK government has set out a Data Centre Covenant giving 'exceptionally strategic' data centre projects access to temporary on-site generation until permanent grid connections are ready, though such equipment could run for 15 years or more.\n  Why it matters: Shows governments tying fast-track grid access to efficiency targets such as PUE 1.3, a benchmark Energo's data centre clients may be measured against.\n  Source: https://datacenters.economictimes.indiatimes.com/news/policy-land-power/uk-covenant-allows-temporary-power-for-strategic-data-centers/136043115\n\n- Greece: new law requires data centres to use at least 60% renewables and pay host communities (Balkan Green Energy News)\n  A Greek law on the electricity market and data centres is now in force.\n  Why it matters: Another EU country setting energy conditions for data centres, adding to the rules clients must design for across Europe.\n  Source: https://balkangreenenergynews.com/greece-introduces-obligatory-payments-to-communities-hosting-data-centers\n\n- Infomaniak and Gruyère Energie plan a 2.5 MW data centre in Bulle feeding district heating (Baublatt)\n  Infomaniak and Gruyère Energie have put a building application on public display for a data centre in Bulle (FR) with 2.5 MW of IT power and 170 racks on about 1,200 m2.\n  Why it matters: A Swiss reference for heat reuse and waterless cooling in data centre design, the kind of MEP and energy concept Energo can deliver.\n  Source: https://www.baublatt.ch/baubranche/infomaniak-plant-rechenzentrum-mit-abwaermenutzung-in-bulle-39891\n\n- SVIT Ostschweiz event: using data centre waste heat to heat buildings (LEADER Digital)\n  At the SVIT Ostschweiz IMMOment event in St. Gallen, about 60 real estate professionals heard talks on energy.\n  Why it matters: Swiss property managers are hearing about building-level heat reuse from computing, a topic where Energo can offer MEP and simulation input ahead of IMMO27.\n  Source: https://www.leaderdigital.ch/news/wenn-das-rechenzentrum-zur-heizung-wird-16876.html\n\n- Pančevo: former Azotara plant sold to a Dubai-linked firm, plan allows a data centre campus of up to 650 MW (Vojvođanski reporter)\n  HIP Azotara in Pančevo now belongs to Mileva Data Technologies, founded in July 2026 and owned by Mileva FZCO from Dubai; the change was registered on 11 August.\n  Why it matters: A potentially very large data centre in Serbia would need MEP, cooling and energy design, and the open questions on water and heat are where Energo's expertise fits.\n  Source: https://vojvodjanskireporter.rs/od-fabrike-djubriva-do-data-centra-azotara-prodata-kompaniji-povezanoj-sa-emiratima\n\n- Data centre heat for homes: Serbian outlet points to Kragujevac as a local example (Biznis Kurir)\n  Biznis Kurir explains how server heat can be captured by heat exchangers and raised by heat pumps to heat water or feed district heating, a model already in use in Denmark and the UK, including a London household device from Heata.\n  Why it matters: Shows heat reuse entering the Serbian conversation, a service angle for Energo's MEP and energy work on data centres.\n  Source: https://biznis.kurir.rs/info-biz/10157538/kako-serveri-mogu-grejati-domove-u-srbiji\n\n- Europe's data centre protests and how governments are responding (IR Insider)\n  After protesters entered a Microsoft data centre site in Amsterdam on 6 November, with 150 to 200 arrests, the Stop Dirty Data Centers movement of over 100 groups in 15 countries called for a moratorium.\n  Why it matters: Public and policy pressure on data centres is rising in Europe, which raises the value of efficiency, heat reuse and transparent reporting in new projects.\n  Source: https://www.irinsider.org/western-europe-/europeans-protested-data-centers-what-is-the-eu-doing-in-response\n\n- ASHRAE separates energy efficiency from operational carbon in Standard 90.1 (Facilitiesnet)\n  ASHRAE is separating energy efficiency from operational carbon goals: Standard 90.1 will keep setting efficiency requirements, while a separate aligned publication will help owners pursue operational emissions cuts.\n  Why it matters: A change in how Standard 90.1 is scoped matters for Energo's energy modelling and MEP design work that references it.\n  Source: https://www.facilitiesnet.com/hvac/article/ASHRAE-Standard-901-Charts-a-New-Course-for-Energy-Efficiency-Goals--21193\nThread, Data centres: energy, cooling and the grid: Rules are tightening: the EU plans annual A to G labels for PUE and WUE for data centres of 500 kW or more from 15 August 2027, Spain now requires 80% renewable power and efficiency standards with grid suspension as a sanction, and the UK ties fast-track power to strategic sites with a PUE target of 1.3. A VSE and Deloitte study says Swiss data centres could use up to 10% of national electricity by 2050, with heat reuse a key condition for local acceptance, and in Dielsdorf Green's data centres now heat homes, with up to 11,500 households planned. Pressure on emissions keeps growing, with the IEA warning of a 70% rise by 2030 and protests and moratoriums in Europe and the US.\n\nFOR MARIJA\n\n- SFDR 2.0: Parliament and Council reach provisional agreement on three fund categories\n- Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027\n- VSME becomes law: Delegated Regulation (EU) 2026/1560 caps value chain data requests\n- EFRAG SME Forum on 2 December and consultation on its 2027 to 2029 reporting agenda\n- EFRAG consults on its draft comment letter on the ISSB nature-related disclosures statement\n- PwC: revised ESRS give companies more scope for a targeted double materiality assessment\n- CSRD in 2027 for Italian companies: narrower scope and revised ESRS\n- bremenports publishes its first sustainability report under the VSME standard\n- EU prepares to recognise guarantees of origin from Energy Community countries\n- Vista Ostuni hotel in a 14th-century building earns LEED Gold\n- Naples student residence Ibrido Student aims for LEED Gold in spring 2027\n- GBC Italia online seminar on AI, BIM, digital twins and sustainability certification, 26 November\n\nFOR DANILO\n\n- EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition\n- Italy: MASE issues new operating instructions for mandatory energy audits\n- EU endorses Antalya Compact to cut buildings' energy intensity by at least 25% by 2035\n- EU authorises an F-gas exemption for commercial laundry equipment with heat pumps\n- Italy has weeks left to send the EU its building renovation plan\n- Commission opens infringement against Italy over ecodesign and energy label market surveillance\n- ENEA and Milan Metropolitan City launch Deciwatt, a free one-stop shop for building renovation\n- Italy: MASE decree sets technical rules for small open-loop geothermal systems\n- FIRE: PNRR funds for ESCo renovation of Italian public housing ran out before most applications were examined\n- Serbia: 41% of homes on district heating now pay by consumption, target 70% this season\n- VSE and Deloitte study: data centres could use up to 10% of Swiss electricity by 2050\n- Green data centres in Dielsdorf start heating homes near Zurich, up to 11,500 households planned\n- Graubünden opens first tender for industrial high-temperature heat pumps, up to 800,000 francs per project\n- Spain approves decree-law transposing ETS2 for buildings and road transport\n- Polish MEPs propose delaying ETS2 to 2031 or scrapping it\n- Germany's Building Modernisation Law: new gas heating needs 10% bio share from 2029\n- Germany's Building Modernisation Law: what applies to heating replacements\n- EU data centre rating scheme: A to G labels for PUE and WUE from 15 August 2027\n- Spain sets new rules for data centres: 80% renewable power and efficiency limits\n- UK Data Centre Covenant allows temporary on-site power for strategic data centres\n- Greece: new law requires data centres to use at least 60% renewables and pay host communities\n- Infomaniak and Gruyère Energie plan a 2.5 MW data centre in Bulle feeding district heating\n- SVIT Ostschweiz event: using data centre waste heat to heat buildings\n- Pančevo: former Azotara plant sold to a Dubai-linked firm, plan allows a data centre campus of up to 650 MW\n- Data centre heat for homes: Serbian outlet points to Kragujevac as a local example\n- Europe's data centre protests and how governments are responding\n- ASHRAE separates energy efficiency from operational carbon in Standard 90.1\n- Harvard study: 403 large US data centres emitted more than Denmark in a year; COP31 adopts a data centre pledge\n\nCONTENT IDEAS\n\n* SFDR 2.0: Parliament and Council reach provisional agreement on three fund categories\n  Angle: SFDR 2.0 is agreed: what the three fund categories mean for the building data asset owners will be asked for.\n  Channel: Newsletter\n  Article outline:\n   - What was agreed on 19 November 2026: three categories (sustainable, transition, ESG basics) replacing the Article 8 and 9 logic.\n   - The 70% threshold and the transition category rules: fossil fuel exclusions unless 20% of capex is Taxonomy-aligned and there is a time-bound emissions plan.\n   - Timeline: formal adoption, publication in the Official Journal, application two years later, implementing measures from the Commission.\n   - Section for Energo's view: which building data (energy, emissions, Taxonomy alignment) fund managers are likely to ask for.\n   - What owners and fund managers should check now about the data behind their portfolios.\n\n* EU sends Italy two reasoned opinions: missing Case Green renovation plan and partial EED transposition\n  Angle: Italy has two months to answer Brussels on Case Green and the EED: what the renovation plan would set and what owners can do meanwhile.\n  Channel: LinkedIn\n  Article outline:\n   - Explain the two reasoned opinions sent on 1 October 2026: the missing draft building renovation plan under EPBD Article 3 and the partial transposition of the Energy Efficiency Directive.\n   - Set out the next step: Italy has two months to respond, after which the Commission can refer the cases to the EU Court of Justice.\n   - Recall what the plan must contain: the building stock, 2030, 2040 and 2050 renovation targets, policies and funding sources.\n   - Summarise the directive targets cited in the article: residential primary energy down 16% by 2030 and 20 to 22% by 2035, and minimum performance standards for the worst non-residential buildings.\n   - Close with Energo's view, written as a section: what owners and designers can prepare now regardless of the political dispute.\n  Carousel outline:\n   - Slide 1: hook, 'Brussels has given Italy two months on Case Green.'\n   - Slide 2: two reasoned opinions sent on 1 October 2026: EPBD renovation plan and EED transposition.\n   - Slide 3: what happens next: a reply within two months or a possible referral to the EU Court of Justice.\n   - Slide 4: what the national renovation plan has to set: targets for 2030, 2040, 2050 and funding.\n   - Slide 5: the residential target: minus 16% average primary energy by 2030.\n   - Slide 6: non-residential: minimum performance standards for the worst-performing buildings.\n   - Slide 7: call to action: ask us where your building stands before the rules land.\n\n* Commission consults on EU limited assurance standard for CSRD reporting until 18 January 2027\n  Angle: CSRD reports will be checked against one EU assurance standard: what auditors will ask for, and how to have the data ready.\n  Channel: Newsletter\n  Article outline:\n   - Introduce the consultation launched on 12 November on the draft EU standard for limited assurance of sustainability reporting.\n   - Explain the basis: CEAOB technical advice built on ISSA 5000, adapted to the EU legal framework, and limited assurance confirmed by Omnibus I.\n   - Cover what assurers would check: ESRS and EU Taxonomy as criteria, Taxonomy eligibility and alignment, digital tagging and third-party verification reports.\n   - Note the open question on timing (2027, 2028 or later) and the 18 January 2027 deadline for comments.\n   - End with what reporting companies should ask their advisers now about evidence and data trails, with Energo's view as a separate section.\n\n* GSE opens voluntary early exit from the Conto Energia for PV plants over 20 kW\n  Angle: Leaving the Conto Energia early: what PV owners above 20 kW must decide by 16 December.\n  Channel: LinkedIn\n  Article outline:\n   - What GSE opened: a voluntary early exit from the Conto Energia for incentivised PV plants above 20 kW.\n   - The trade: remaining incentives end from 2028, replaced by a ten-year payment, with full repowering required by 2030.\n   - The process: a non-binding expression of interest between 16 November and 16 December 2026, then a separate confirmation.\n   - What to check before applying: economic value, minimum producibility, module choice and timing of the works.\n   - What owners should do now: ask for a repowering feasibility check before the window closes.\n  Carousel outline:\n   - Slide 1: hook, 'Own a PV plant above 20 kW under the Conto Energia? You have until 16 December.'\n   - Slide 2: GSE now allows a voluntary early exit from the incentives.\n   - Slide 3: incentives stop from 2028, replaced by a ten-year payment.\n   - Slide 4: the condition: full repowering of the plant by 2030.\n   - Slide 5: the window: expressions of interest from 16 November to 16 December 2026, non-binding.\n   - Slide 6: what to compare: economic value, producibility, modules and timing.\n   - Slide 7: call to action: get a feasibility check before you apply.\n\n* Italy: MASE issues new operating instructions for mandatory energy audits\n  Angle: New rules for Italian energy audits: what changes for multi-site and energy-intensive companies.\n  Channel: Website\n  Article outline:\n   - What changed: Directorial Decree no. 293 of 5 November 2026 replaces earlier clarifications and FAQs on energy audits under Legislative Decree 102/2014.\n   - The main topics: multi-site companies, sampling and clustering, efficiency measures and performance indicators.\n   - Specific rules for energy-intensive and gas-intensive companies that use the audits to access relief.\n   - ENEA's role: controls, monitoring and new guidelines still to come.\n   - What companies should do: check whether their next audit follows the new instructions; Energo's audit approach can be written up as a section.\n\n* VSME becomes law: Delegated Regulation (EU) 2026/1560 caps value chain data requests\n  Angle: The value chain cap: what large clients can and cannot ask SMEs for from 2027.\n  Channel: LinkedIn\n  Article outline:\n   - What the regulation is: Delegated Regulation (EU) 2026/1560, in force since 24 September 2026, the voluntary standard for companies outside the CSRD.\n   - The value chain cap: from financial years starting 1 January 2027, CSRD companies cannot ask suppliers with up to 1,000 employees for more than the standard covers.\n   - Micro companies with up to 10 employees: an even narrower set of data points.\n   - What this means for SMEs facing questionnaires from banks and customers.\n   - What to do: prepare one VSME report and use it to answer requests; Energo's reporting support can be described here.\n  Carousel outline:\n   - Slide 1: hook, 'From 2027 your big customers cannot ask you for unlimited ESG data.'\n   - Slide 2: the law: Delegated Regulation (EU) 2026/1560, in force since 24 September 2026.\n   - Slide 3: who it protects: suppliers with up to 1,000 employees.\n   - Slide 4: when: financial years starting on or after 1 January 2027.\n   - Slide 5: micro companies up to 10 employees get an even shorter list.\n   - Slide 6: call to action: build one VSME report and reuse it.\n\n* bremenports publishes its first sustainability report under the VSME standard\n  Angle: A German port reports under VSME for the first time: what the voluntary SME standard looks like in practice.\n  Channel: LinkedIn\n  Article outline:\n   - Introduce bremenports' 2026 report, its tenth, and the switch to VSME.\n   - Explain the two modules it used, Basic and Comprehensive, and the period covered (2024 and 2025).\n   - Place VSME in context: the voluntary standard for SMEs that stay outside CSRD but still get ESG data requests.\n   - Close with Energo's view, written as a section: when an SME should start with the Basic Module.\n  Carousel outline:\n   - Slide 1: hook, 'A port company just reported under VSME.'\n   - Slide 2: bremenports' tenth sustainability report, first under VSME.\n   - Slide 3: Basic and Comprehensive Modules both applied.\n   - Slide 4: why VSME: SMEs outside CSRD still get ESG data requests.\n   - Slide 5: call to action: ask us how to start your first VSME report.\n\n* Italy has weeks left to send the EU its building renovation plan\n  Angle: Italy's building renovation plan is due on 31 December: what it is and why it matters to owners.\n  Channel: Newsletter\n  Article outline:\n   - The deadlines: draft plan due by 31 December 2025, never sent; final plan due by 31 December 2026.\n   - The infringement: a reasoned opinion on 1 October with two months to comply, then a possible referral to the EU Court of Justice.\n   - What the plan does: it turns EPBD targets into national choices on obligations, incentives and priorities.\n   - The second gap: transposition of the directive, due by 29 May 2026, is still incomplete.\n   - What owners can do now: know their buildings' energy class and plan renovations rather than wait for the final rules.\n\n* CAM 2025: how the new Italian green procurement criteria handle LCA and LCC\n  Angle: CAM 2025 makes LCA and LCC part of Italian public projects: a practical guide for designers.\n  Channel: Website\n  Article outline:\n   - What changed: DM 24/11/2025 in force since 2 February 2026, replacing DM 256/2022 with transition cases.\n   - Wider scope: civil engineering works, renovation, maintenance and upgrades, heritage buildings where compatible.\n   - The new LCA and LCC section: method, data selection, indicators, award criteria and checks.\n   - Section for Energo's view: how an LCA and LCC study fits into a public tender timeline.\n   - What contracting authorities and designers should prepare before the next tender.\n\n* Italy: MASE decree sets technical rules for small open-loop geothermal systems\n  Angle: Groundwater heat pumps in Italy finally have national rules: what designers must now document.\n  Channel: LinkedIn\n  Article outline:\n   - Introduce decree no. 364 of 11 November 2026 on small open-loop geothermal systems under 2 MW.\n   - List the technical requirements: well design, hydrogeological surveys, water quality protection and temperature monitoring.\n   - Explain the digital register and the technical working group that will set thresholds for simplified procedures.\n   - Link it to the April 2026 decree on closed-loop systems.\n   - Close with Energo's view, written as a section: when open-loop geothermal makes sense on a building project.\n  Carousel outline:\n   - Slide 1: hook, 'Italy now has rules for groundwater heat pumps.'\n   - Slide 2: decree no. 364 of 11 November 2026, systems under 2 MW.\n   - Slide 3: wells, hydrogeology and water quality must be documented.\n   - Slide 4: temperatures are monitored and systems recorded in a register.\n   - Slide 5: simplified procedures still to be set by a working group.\n   - Slide 6: call to action: considering geothermal? Ask us for a feasibility check.\n\n* Serbia: 41% of homes on district heating now pay by consumption, target 70% this season\n  Angle: Paying for heat by consumption in Serbia: why old buildings without meters lose out.\n  Channel: LinkedIn\n  Article outline:\n   - The numbers: 41% of housing units on consumption billing, target 70% this season.\n   - How old buildings are billed: one meter at the substation, cost split by heated area.\n   - Why that matters: a flat's bill depends on the whole building, not its own use.\n   - The obstacle: old installations without individual meters.\n   - What building managers can ask: what it takes to add metering or allocators; Energo's MEP view can be added here.\n  Carousel outline:\n   - Slide 1: hook, 'Paying for heating by consumption? In older buildings, not quite.'\n   - Slide 2: 41% of Serbian homes on district heating already pay by consumption.\n   - Slide 3: the target is 70% this heating season.\n   - Slide 4: old buildings measure heat for the whole building.\n   - Slide 5: the bill is split by heated area, not by each flat's use.\n   - Slide 6: call to action: ask what individual metering would take in your building.\n\n* Green data centres in Dielsdorf start heating homes near Zurich, up to 11,500 households planned\n  Angle: From server room to living room: what the Dielsdorf project shows about designing data centres for heat reuse.\n  Channel: LinkedIn\n  Article outline:\n   - The project: Energie 360 energy centre on the Green campus in Dielsdorf, first flats now heated with server waste heat.\n   - Scale: network extended step by step, pipes to Regensdorf under construction, up to 11,500 households planned.\n   - Design choices Green names: heat extraction planned from the start, outside-air cooling in closed loops without water, backup power offering balancing energy.\n   - Section for Energo's view: what designing for heat reuse means for MEP, temperature levels and modelling.\n   - Questions owners and municipalities should ask early in a data centre project.\n  Carousel outline:\n   - Slide 1: hook, 'Servers near Zurich now heat homes.'\n   - Slide 2: the Dielsdorf energy centre feeds data centre heat into district heating.\n   - Slide 3: target: up to 11,500 households plus businesses.\n   - Slide 4: heat extraction was planned at the design stage.\n   - Slide 5: cooling with outside air in closed loops, no water use.\n   - Slide 6: call to action: plan heat reuse in your data centre project from day one, talk to Energo.\n\n* EU data centre rating scheme: A to G labels for PUE and WUE from 15 August 2027\n  Angle: Your data centre is getting an EU energy label: what A to G on PUE and WUE will mean.\n  Channel: LinkedIn\n  Article outline:\n   - Background: the June 2026 roadmap and the September 2026 proposal for an EU data centre rating scheme under the Energy Efficiency Directive.\n   - Who is covered: data centres with installed IT power of 500 kW or more.\n   - What the label shows: PUE and WUE from A to G, energy sources, grid flexibility, new-build clean power and heat reuse.\n   - Timing: annual labels from 15 August 2027, built on data already reported.\n   - Section for Energo's view: how to improve PUE and WUE before the first label, and what operators should verify now.\n  Carousel outline:\n   - Slide 1: hook, 'From August 2027, EU data centres get an energy label.'\n   - Slide 2: who: sites with 500 kW or more of IT power.\n   - Slide 3: PUE rated A to G.\n   - Slide 4: WUE rated A to G.\n   - Slide 5: also shown: energy sources, flexibility, heat reuse.\n   - Slide 6: labels come from data already reported, so data quality matters.\n   - Slide 7: call to action: check your metering and efficiency now.\n\n* Spain sets new rules for data centres: 80% renewable power and efficiency limits\n  Angle: Spain makes efficiency a licence condition for data centres: what operators elsewhere in Europe should prepare for.\n  Channel: LinkedIn\n  Article outline:\n   - What Spain adopted: 80% renewable electricity and water and energy efficiency standards for data centres.\n   - Temporary limits on water and power use until EU criteria are final, and sustainability reporting for the largest sites.\n   - The enforcement side: sanctions up to suspension of grid access for up to three years.\n   - Context from the item: 15 GW of approved grid access and 20 GW waiting.\n   - Section for Energo's view: what operators in other countries can do now on efficiency design and measurement.\n  Carousel outline:\n   - Slide 1: hook, 'Spain: no efficiency, no grid.'\n   - Slide 2: 80% of electricity from renewables.\n   - Slide 3: water and energy efficiency standards, with temporary limits.\n   - Slide 4: sustainability reporting for the largest sites.\n   - Slide 5: breaches can suspend grid access for up to three years.\n   - Slide 6: call to action: check your data centre's efficiency data before the rules reach you.\n\n* Infomaniak and Gruyère Energie plan a 2.5 MW data centre in Bulle feeding district heating\n  Angle: A Swiss data centre designed to heat a town: how heat reuse and waterless liquid cooling fit together.\n  Channel: LinkedIn\n  Article outline:\n   - Present the project: Infomaniak and Gruyère Energie, 2.5 MW IT power, 170 racks, about 1,200 m2 in Bulle.\n   - Explain the heat path: server heat raised by heat pumps into district heating, about 28 GWh a year, up to 7,500 t CO2 avoided against oil.\n   - Describe the cooling choice: a closed liquid system with no cooling towers, evaporation or extra water withdrawal.\n   - Give the timeline: permit display from 13 November, construction in the first half of 2027, operation in 2028.\n   - Close with Energo's view, written as a section: what
